      const edited = await editPaymentModal({title:'Edit Receipt', partyLabel:'Party', entry});
      if(!edited) return;
      // QA Round 15, Bug 1: the Edit flow had none of the Record flow's
      // checks at all. Same warn-before-save rule as recording a new
      // receipt, adjusted for an edit: "give back" the old amount first
      // (it's being replaced), but only if it's still against the same
      // party — if the party itself was changed, the old amount's effect
      // stays with that other party's ledger, not this one.
      // QA Round 16/17: using partyPendingTotal() here was wrong when the
      // party already holds an Advance from its OTHER receipts — that
      // function clamps at 0, silently discarding the existing advance, so
      // "extra" came out short by exactly that advance. Compute the
      // unclamped owed-minus-other-receipts figure instead, which can go
      // negative (an existing advance before this edit even applies).
      const oldAmount = entry.party===edited.party ? Number(entry.amount) : 0;
      const otherReceipts = partyReceiptsTotal(edited.party) - oldAmount;
      const pendingBeforeThis = partyOpeningBalance(edited.party) + partyCreditSalesTotal(edited.party) - otherReceipts;
      if(pendingBeforeThis<=0){
        const existingAdvance = -pendingBeforeThis;
        const msg = existingAdvance>0.009
          ? `${edited.party} already has an Advance of Rs ${fmtPlain(existingAdvance)} and no pending balance owed. The full Rs ${fmtPlain(edited.amount)} will be added to their Advance (new Advance: Rs ${fmtPlain(existingAdvance+edited.amount)}), applied against their next sale. Save it?`
          : `${edited.party} has no pending balance (Rs 0 owed). The full Rs ${fmtPlain(edited.amount)} will be recorded as an Advance from them, applied against their next sale. Save it?`;
        if(!await showConfirm(msg)) return;
      } else if(edited.amount > pendingBeforeThis){
        if(!await showConfirm(`This is Rs ${fmtPlain(edited.amount)}, more than ${edited.party}'s pending balance of Rs ${fmtPlain(pendingBeforeThis)} (after accounting for the amount being replaced). The extra Rs ${fmtPlain(edited.amount-pendingBeforeThis)} will be recorded as an Advance from them, applied against their next sale. Save it?`)) return;
      }
      try {
        await api('PATCH', '/api/receipts/'+b.dataset.redit, edited);
        if(edited.party !== ledgerParty) ledgerParty = edited.party;
        await refreshState();
        showToast('Receipt updated');
      } catch(e){ await showAlert(e.message); }
    };
  });
  main.querySelectorAll('[data-rdelete]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await showConfirm('Delete this receipt? This cannot be undone.')) return;
      try { await api('DELETE', '/api/receipts/'+b.dataset.rdelete); await refreshState(); showToast('Receipt deleted'); }
      catch(e){ await showAlert(e.message); }
    };
  });
}

      try {
        await api('PATCH', '/api/supplier-payments/'+b.dataset.spedit, {date:edited.date, supplier:edited.party, amount:edited.amount, account:edited.account, note:edited.note});
        if(edited.party !== ledgerSupplier) ledgerSupplier = edited.party;
        await refreshState();
        showToast('Payment updated');
      } catch(e){ await showAlert(e.message); }
    };
  });

    </section>`}
    <section class="block">
      <h2>Purchases List</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Supplier</th><th>Variety</th><th>Qty</th><th>Rate</th><th>Total</th><th>Status</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.purchases.slice().reverse().map(p=>`
            <tr>
              <td>${fmtDate(p.date)}</td><td>${p.supplier}</td><td>${p.item}</td><td>${fmtQty(p.qty)} ${p.unit||'kg'}</td><td>${fmtQty(p.rate)}</td><td>Rs ${fmt(p.total)}</td>
              <td>${p.staged ? '<span class="pill role" title="Entered during Historical Data Entry Mode — permanently excluded from Stock/Cash/Bank/Profit, counts only toward the Supplier Ledger">Historical</span>' : (p.type==='cash' ? '<span class="pill cash">Cash</span>' : (creditPurchaseStatus(p)==='clear'?'<span class="pill ok">Paid</span>':creditPurchaseStatus(p)==='partial'?'<span class="pill partial">Partially Paid</span>':'<span class="pill credit">Payable</span>'))}</td>
              ${ro?'':`<td class="row-actions">${(!p.staged && p.type==='credit' && creditPurchaseStatus(p)!=='clear') ? `<select class="acc-select" data-paccfor="${p.id}">${accountOptionsHtmlNoLocker('cash')}</select> <button class="btn danger" data-ppaid="${p.id}">Mark Paid</button>` : ''}
                <button class="btn danger" data-pedit="${p.id}">Edit</button>
                <button class="btn danger" data-pdelete="${p.id}">Delete</button></td>`}
            </tr>`).join('') || `<tr><td colspan="8" class="empty">No purchases entered yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>
    ${ro? '' : `
    <section class="block">
      <h2>Supplier Advance (Hold for Purchase)</h2>
      <div class="save-note" style="margin-bottom:12px;">Issue an amount to a supplier before the yarn type, quantity, or rate is known — the money leaves the account now and is held specifically for that purchase. Complete the purchase details later from the list below to resume the same entry.</div>
      <div class="form-grid">
        <div><label>Supplier / Mill Name</label><input id="pa_supplier"></div>
        <div><label>Date</label><input type="date" id="pa_date" value="${todayStr()}"></div>
        <div><label>Amount</label><input type="number" id="pa_amount"></div>
        <div id="pa_acc_wrap"><label>Paid From</label><select id="pa_account">${accountOptionsHtmlNoLocker('cash')}</select></div>
        <div id="pa_cover_wrap" style="display:none;"><label>Cover Shortfall From</label><select id="pa_cover_account" class="select-required"></select></div>
        <div id="pa_cover_wrap1" style="display:none;"><label>Cover Remaining Shortfall From</label><select id="pa_cover_account1" class="select-required"></select></div>
        <div id="pa_lender_wrap" style="display:none;"><label>Lender Name</label><input id="pa_lender_name" placeholder="e.g. X-Y-Z"></div>
        <div><label>Note (optional)</label><input id="pa_note"></div>
      </div>
      <div class="settings-note" id="pa_balances_note" style="margin-bottom:12px;"></div>
      <button class="btn gold" id="pa_add">Issue Advance</button>
    </section>`}
    <section class="block">
      <h2>Pending Supplier Advances</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Supplier</th><th>Amount</th><th>Account</th><th>Note</th><th>Status</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.purchaseAdvances.slice().reverse().map(a=>`
            <tr>
              <td>${fmtDate(a.date)}</td><td>${a.supplier}</td><td>Rs ${fmt(a.amount)}</td><td>${(allAccounts().find(x=>x.id===a.account)||{}).name||'Cash'}</td><td>${a.note||'—'}</td>
              <td>${a.status==='open'?'<span class="pill credit">Pending</span>':'<span class="pill ok">Completed</span>'}</td>
              ${ro?'':`<td class="row-actions">${a.status==='open'?`<button class="btn gold" data-pacomplete="${a.id}">Complete Purchase</button> <button class="btn danger" data-padelete="${a.id}">Cancel</button>`:'—'}</td>`}
            </tr>`).join('') || `<tr><td colspan="7" class="empty">No supplier advances issued yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>
    ${(()=>{
      const returnableList = state.purchases.filter(p=>!p.staged && purchaseReturnableQty(p.id)>0.001);
      return `
    ${ro? '' : `
    <section class="block">
      <h2>Purchase Return</h2>
      <div class="save-note" style="margin-bottom:12px;">Goods sent back to a supplier — reduces Stock either way. Choose Refund if the supplier hands money back into Cash/Bank, or Credit if it just reduces what you still owe them.</div>
      ${returnableList.length ? `
      <div class="form-grid">
        <div><label>Purchase</label><select id="pr_purchase">${returnableList.map(p=>`<option value="${p.id}">${fmtDate(p.date)} — ${p.supplier}, ${p.item} (${fmtQtyPlain(purchaseReturnableQty(p.id))} ${p.unit} returnable)</option>`).join('')}</select></div>
        <div><label>Date</label><input type="date" id="pr_date" value="${todayStr()}"></div>
        <div><label>Quantity Returned</label><input type="number" id="pr_qty" placeholder="e.g. 5"></div>
        <div><label>Settlement</label><select id="pr_settlement"><option value="refund">Refund (Cash/Bank)</option><option value="credit">Credit (reduce payable)</option></select></div>
        <div id="pr_acc_wrap"><label>Refund Into</label><select id="pr_account">${accountOptionsHtml('cash')}</select></div>
        <div><label>Note (optional)</label><input id="pr_note"></div>
      </div>
      <div class="settings-note" id="pr_hint" style="margin-bottom:12px;"></div>
      <button class="btn gold" id="pr_add">Record Return</button>
      ` : `<div class="empty">No purchases are currently eligible for a return (everything is either Historical, or already fully sold/returned).</div>`}
    </section>`}
    <section class="block">
      <h2>Purchase Returns List</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Purchase</th><th>Qty</th><th>Rate</th><th>Total</th><th>Settlement</th><th>Account</th><th>Note</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.purchaseReturns.slice().reverse().map(r=>{
            const p = state.purchases.find(x=>x.id===r.purchaseId);
            return `<tr><td>${fmtDate(r.date)}</td><td>${p?`${p.supplier} — ${p.item}`:'(purchase removed)'}</td><td>${fmtQty(r.qty)} ${p?p.unit:''}</td><td>${fmtQty(r.rate)}</td><td>Rs ${fmt(r.total)}</td>
              <td>${r.settlement==='refund'?'<span class="pill cash">Refund</span>':'<span class="pill credit">Credit</span>'}</td>
              <td>${r.settlement==='refund'?((allAccounts().find(a=>a.id===r.account)||{}).name||'Cash'):'—'}</td><td>${r.note||'—'}</td>
              ${ro?'':`<td class="row-actions"><button class="btn danger" data-prdelete="${r.id}">Delete</button></td></tr>`}`;
          }).join('') || `<tr><td colspan="9" class="empty">No purchase returns recorded yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>`;
    })()}
  `;
  if(ro) return;
  const form = main.querySelector('.form-grid').closest('section');
  attachCombo(main.querySelector('#p_supplier'), supplierNames, form);
  const paSupplierInput = main.querySelector('#pa_supplier');
  if(paSupplierInput) attachCombo(paSupplierInput, supplierNames, paSupplierInput.closest('section'));
  attachCombo(main.querySelector('#p_item'), knownVarieties, form);
  const p_unit = main.querySelector('#p_unit');
  function syncPurchaseUnit(){
    // same reasoning as Sales: once the item name matches stock in exactly
    // one unit, lock to it. If it matches stock in more than one unit
    // (legacy fragmented data) or none at all, leave Unit selectable.
    const name = main.querySelector('#p_item').value.trim();
    const unitsForName = Array.from(new Set(state.stock.filter(x=>x.name===name).map(x=>x.unit)));
    if(unitsForName.length===1){ p_unit.value = unitsForName[0]; p_unit.disabled = true; }
    else { p_unit.disabled = false; }
  }
  main.querySelector('#p_item').addEventListener('input', syncPurchaseUnit);
  syncPurchaseUnit();
  const p_qty = main.querySelector('#p_qty');
  const p_rate = main.querySelector('#p_rate');
  const p_total_display = main.querySelector('#p_total_display');
  function updatePurchaseTotalDisplay(){
    const qty = Number(p_qty.value)||0, rate = Number(p_rate.value)||0;
    p_total_display.value = (qty&&rate) ? fmtQtyPlain(qty*rate) : '';
  }
  p_qty.addEventListener('input', ()=>{ updatePurchaseTotalDisplay(); updatePurchaseFunding(); });
  p_rate.addEventListener('input', ()=>{ updatePurchaseTotalDisplay(); updatePurchaseFunding(); });
  // available balance for THIS account, treating the purchase being edited
  // (if any, and if it already drew cash from this same account) as not yet
  // spent — otherwise editing a cash purchase would double-count its own
  // old amount as unavailable.
  function purchaseAvailable(accId){
    return accountBalance(accId) + (editing && editing.type==='cash' && editing.account===accId ? Number(editing.total) : 0);
  }
  const updatePurchaseFunding = wireShortfallCover(main, 'p',
    ()=>main.querySelector('#p_account').value,
    ()=>main.querySelector('#p_type').value==='cash' ? (Number(p_qty.value)||0)*(Number(p_rate.value)||0) : 0,
    purchaseAvailable
  );
  main.querySelector('#p_account').addEventListener('change', updatePurchaseFunding);
  main.querySelector('#p_type').onchange = (e)=>{
    main.querySelector('#p_acc_wrap').style.display = e.target.value==='credit' ? 'none':'block';
    updatePurchaseFunding();
  };
  main.querySelector('#p_add').onclick = guardDoubleSubmit('p_add', async ()=>{
    const date=main.querySelector('#p_date').value, supplier=main.querySelector('#p_supplier').value.trim(),
      item=main.querySelector('#p_item').value.trim(), qty=Number(main.querySelector('#p_qty').value),
      unit=main.querySelector('#p_unit').value,
      rate=Number(main.querySelector('#p_rate').value), type=main.querySelector('#p_type').value,
      account=main.querySelector('#p_account').value;
    if(!supplier||!item||!qty||!rate){ await showAlert('Please fill all required fields'); return; }
    let funding = null;
    if(type==='cash'){
      funding = await resolveShortfallMulti({ date, account, total: qty*rate, getAvailable: purchaseAvailable, prefix:'p', main });
      if(!funding) return;
    }
    const body = {date, supplier, item, qty, unit, rate, type, account};
    // funding links only make sense on creation — an edit's own shortfall
    // (if any) isn't this purchase's original funding story.
    if(funding && !editing){ body.fundingTransferIds = funding.transferIds; body.fundingLoanIds = funding.loanIds; }
    try {
      if(editing){ await api('PATCH', '/api/purchases/'+editing.id, body); editingPurchaseId = null; }
      else { await api('POST', '/api/purchases', body); }
      await refreshState();
      showToast(editing ? 'Purchase updated' : 'Purchase added');
    } catch(e){ await showAlert(e.message); }
  });
  if(editing){
    main.querySelector('#p_cancel').onclick = ()=>{ editingPurchaseId = null; render(); };
  }
  main.querySelectorAll('[data-ppaid]').forEach(b=>{
    b.onclick = async ()=>{
      const sel = main.querySelector(`[data-paccfor="${b.dataset.ppaid}"]`);
      const account = sel ? sel.value : 'cash';
      const purchase = state.purchases.find(p=>p.id===b.dataset.ppaid);
      const total = purchase ? Number(purchase.total) : 0;
      const ok = await ensureFundsAvailable({ date: todayStr(), account, total, getAvailable: accountBalance });
      if(!ok) return;
      try { await api('POST', '/api/purchases/'+b.dataset.ppaid+'/mark-paid', {account}); await refreshState(); showToast('Marked as paid'); }
      catch(e){ await showAlert(e.message); }
    };
  });
  main.querySelectorAll('[data-pedit]').forEach(b=>{
    b.onclick = ()=>{ editingPurchaseId = b.dataset.pedit; render(); };
  });
  main.querySelectorAll('[data-pdelete]').forEach(b=>{
    b.onclick = async ()=>{
      // QA Round 16: the server now blocks per-purchase (only when THIS
      // purchase has actually drawn money from the supplier's FIFO-pooled
      // payments), not just because the supplier has payments somewhere.
      // Same check up front here, using the Ledger's own FIFO math, so a
      // blocked delete never shows the generic "cannot be undone" confirm.
      const purchase = state.purchases.find(p=>p.id===b.dataset.pdelete);
      if(purchase && state.purchaseReturns.some(r=>r.purchaseId===purchase.id)){
        await showAlert('This purchase has a Purchase Return recorded against it — delete that return first, then this purchase.');
        return;
      }
      if(purchase && purchase.type==='credit' && !purchase.paid){
        const applied = Number(purchase.total) - creditPurchaseOutstanding(purchase);
        if(applied > 0.009){
          await showAlert(`Rs ${fmtPlain(applied)} has already been paid against this purchase (FIFO-applied from ${purchase.supplier}'s payments) — delete or edit that payment from the Ledger first, then this purchase.`);
          return;
        }
      }
      if(!await showConfirm('Delete this purchase entry? This cannot be undone.')) return;
      try {
        await api('DELETE', '/api/purchases/'+b.dataset.pdelete);
        if(editingPurchaseId===b.dataset.pdelete) editingPurchaseId = null;
        await refreshState();
        showToast('Purchase deleted');
      } catch(e){ await showAlert(e.message); }
    };
  });
  enableEnterNav(form, '#p_add');
  const paAccount = main.querySelector('#pa_account');
  if(paAccount){
    function paAvailable(accId){ return accountBalance(accId); }
    const updatePaFunding = wireShortfallCover(main, 'pa',
      ()=>paAccount.value,
      ()=>Number(main.querySelector('#pa_amount').value)||0,
      paAvailable
    );
    paAccount.addEventListener('change', updatePaFunding);
    main.querySelector('#pa_amount').addEventListener('input', updatePaFunding);
    main.querySelector('#pa_add').onclick = guardDoubleSubmit('pa_add', async ()=>{
      const date = main.querySelector('#pa_date').value, supplier = main.querySelector('#pa_supplier').value.trim(),
        amount = Number(main.querySelector('#pa_amount').value), account = paAccount.value,
        note = main.querySelector('#pa_note').value.trim();
      if(!supplier || !date || !amount){ await showAlert('Please fill all required fields'); return; }
      if(!isPositiveAmount(amount)){ await showAlert('Amount must be greater than zero'); return; }
      const funding = await resolveShortfallMulti({ date, account, total: amount, getAvailable: paAvailable, prefix:'pa', main });
      if(!funding) return;
      const body = {date, supplier, amount, account, note, fundingTransferIds: funding.transferIds, fundingLoanIds: funding.loanIds};
      try {
        await api('POST', '/api/purchase-advances', body);
        await refreshState();
        showToast('Advance issued');
      } catch(e){ await showAlert(e.message); }
    });
  }
  main.querySelectorAll('[data-pacomplete]').forEach(b=>{
    b.onclick = async ()=>{
      const advance = state.purchaseAdvances.find(a=>a.id===b.dataset.pacomplete);
      if(!advance) return;
      const details = await completeAdvanceModal({advance});
      if(!details) return;
      try {
        await api('POST', '/api/purchase-advances/'+advance.id+'/complete', details);
        await refreshState();
        showToast('Purchase completed');
      } catch(e){ await showAlert(e.message); }
    };
  });
  main.querySelectorAll('[data-padelete]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await showConfirm('Cancel this advance? The held amount returns to the account.')) return;
      try {
        await api('DELETE', '/api/purchase-advances/'+b.dataset.padelete);
        await refreshState();
        showToast('Advance cancelled');
      } catch(e){ await showAlert(e.message); }
    };
  });
  const prPurchaseSel = main.querySelector('#pr_purchase');
  if(prPurchaseSel){
    const prSettlementSel = main.querySelector('#pr_settlement');
    const prAccWrap = main.querySelector('#pr_acc_wrap');
    const prQty = main.querySelector('#pr_qty');
    const prHint = main.querySelector('#pr_hint');
    function updatePrHint(){
      const purchase = state.purchases.find(x=>x.id===prPurchaseSel.value);
      if(!purchase) return;
      const returnable = purchaseReturnableQty(purchase.id);
      // 'credit' settlement only has something to reduce on an unpaid
      // credit purchase — same guard the server enforces (see
      // POST /api/purchase-returns) — so hide it here rather than let the
      // user hit a confusing rejection after filling the whole form.
      const creditOpt = prSettlementSel.querySelector('option[value="credit"]');
      const creditMakesSense = purchase.type==='credit' && !purchase.paid;
      creditOpt.disabled = !creditMakesSense;
      if(!creditMakesSense && prSettlementSel.value==='credit') prSettlementSel.value = 'refund';
      prAccWrap.style.display = prSettlementSel.value==='refund' ? 'block' : 'none';
      prQty.placeholder = `Up to ${fmtQtyPlain(returnable)} ${purchase.unit}`;
    }
    prPurchaseSel.addEventListener('change', updatePrHint);
    prSettlementSel.addEventListener('change', updatePrHint);
    updatePrHint();
    main.querySelector('#pr_add').onclick = guardDoubleSubmit('pr_add', async ()=>{
      const purchaseId = prPurchaseSel.value;
      const date = main.querySelector('#pr_date').value;
      const qty = Number(prQty.value);
      const settlement = prSettlementSel.value;
      const account = main.querySelector('#pr_account').value;
      const note = main.querySelector('#pr_note').value.trim();
      if(!purchaseId||!date||!qty){ await showAlert('Select a purchase and enter date and quantity'); return; }
      const returnable = purchaseReturnableQty(purchaseId);
      if(qty > returnable + 0.001){ await showAlert(`Only ${fmtQtyPlain(returnable)} can still be returned from this purchase.`); return; }
      const body = {purchaseId, date, qty, settlement, note};
      if(settlement==='refund') body.account = account;
      try{
        await api('POST', '/api/purchase-returns', body);
        await refreshState();
        showToast('Purchase return recorded');
      }catch(e){ await showAlert(e.message); }
    });
  }
  main.querySelectorAll('[data-prdelete]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await showConfirm('Delete this purchase return? This cannot be undone.')) return;
      try{ await api('DELETE', '/api/purchase-returns/'+b.dataset.prdelete); await refreshState(); showToast('Purchase return deleted'); }
      catch(e){ await showAlert(e.message); }
    };
  });
}

// ---------- FINANCIAL ENTRY (Cheque Entry / Payment / Bank Transfer sub-tabs) ----------
function renderCheques(main){
  const ro = !canEditActiveClient();
  const FIN_TABS = [
    {id:'cheque', label:'Cheque Entry (Payment/Receipt)'},
    {id:'payment', label:'Payment'},
    {id:'transfer', label:'Bank Transfer'}
  ];
  const tab = FIN_TABS.find(t=>t.id===financeTab) ? financeTab : 'cheque';
  main.innerHTML = `
    <div class="subtabs">${FIN_TABS.map(t=>`<button data-ftab="${t.id}" class="${tab===t.id?'active':''}">${t.label}</button>`).join('')}</div>
    ${tab==='cheque' ? chequeEntrySectionHtml(ro) : ''}
    ${tab==='payment' ? paymentSectionHtml(ro) : ''}
    ${tab==='transfer' ? transferSectionHtml(ro) : ''}
  `;
  main.querySelectorAll('[data-ftab]').forEach(b=>{
    b.onclick = ()=>{ financeTab = b.dataset.ftab; render(); };
  });
  if(ro) return;
  if(tab==='cheque') wireChequeEntrySection(main);
  if(tab==='payment') wirePaymentSection(main);
  if(tab==='transfer') wireTransferSection(main);
}

function chequeEntrySectionHtml(ro){
  return `
    ${ro? '' : `
    <section class="block">
      <h2>New Cheque Entry</h2>
      <div class="form-grid">
        <div><label>Direction</label><select id="c_direction">
          <option value="received">Receipt (from Buyer)</option>
          <option value="issued">Payment (to Supplier)</option>
        </select></div>
        <div><label>Date</label><input type="date" id="c_date" value="${todayStr()}"></div>
        <div><label id="c_party_label">Party Name</label><input id="c_party"></div>
        <div><label>Bank Name (cheque drawn on)</label><input id="c_bank" placeholder="e.g. Meezan Bank"></div>
        <div><label>Amount</label><input type="number" id="c_amount"></div>
        <div><label>Cashing / Due Date</label><input type="date" id="c_due"></div>
        <div><label id="c_account_label">Deposit Into (when cleared)</label><select id="c_account">${accountOptionsHtml('cash')}</select></div>
      </div>
      <button class="btn gold" id="c_add">Add Cheque</button>
      <div class="save-note" id="c_note">A cheque received from a buyer. Go to the <b>Payment</b> tab to mark it cleared once it's cashed at the bank.</div>
    </section>`}
    <section class="block">
      <h2>Cheques List</h2>

function wirePaymentSection(main){
  main.querySelectorAll('[data-clear]').forEach(b=>{
    b.onclick=async ()=>{
      const accSel = main.querySelector(`[data-clearacc="${b.dataset.clear}"]`);
      const account = accSel ? accSel.value : undefined;
      // only an issued (paid-to-supplier) cheque draws money out on
      // clearing — a received cheque is an inflow, nothing to check.
      const cheque = state.cheques.find(c=>c.id===b.dataset.clear);
      if(cheque && cheque.direction==='issued' && account){
        const ok = await ensureFundsAvailable({ date: todayStr(), account, total: Number(cheque.amount), getAvailable: accountBalance });
        if(!ok) return;
      }
      // QA Round 14, Bugs 1/2/3 also apply to clearing a cheque (it posts
      // a receipt/payment the same as the Payment tab does) — same
      // warn-don't-block treatment.
      if(cheque){
        const pending = cheque.direction==='issued' ? supplierPendingTotal(cheque.party) : partyPendingTotal(cheque.party);
        const amt = Number(cheque.amount);
        const advanceNote = cheque.direction==='issued' ? 'an Advance to them, applied against their next purchase' : 'an Advance from them, applied against their next sale';
        if(pending<=0){
          if(!await showConfirm(`${cheque.party} has no pending balance (Rs 0 owed). The full Rs ${fmtPlain(amt)} will be recorded as ${advanceNote}. Clear it?`)) return;
        } else if(amt > pending){
          if(!await showConfirm(`This cheque is Rs ${fmtPlain(amt)}, more than ${cheque.party}'s pending balance of Rs ${fmtPlain(pending)}. The extra Rs ${fmtPlain(amt-pending)} will be recorded as ${advanceNote}. Clear it?`)) return;
        }
      }
      try { await api('POST', '/api/cheques/'+b.dataset.clear+'/clear', {account}); await refreshState(); showToast('Cheque marked cleared'); }
      catch(e){ await showAlert(e.message); }
    };
  });
  const payAdd = main.querySelector('#pay_add');
  if(!payAdd) return;
  const pay_direction = main.querySelector('#pay_direction');
  const pay_party = main.querySelector('#pay_party');
  function syncPayDirection(){
    const isPayment = pay_direction.value==='payment';
    const names = isPayment ? supplierNames() : partyNames();
    pay_party.innerHTML = names.length ? `<option value="">— select —</option>${names.map(n=>`<option value="${n}">${n}</option>`).join('')}` : `<option value="">— no ${isPayment?'suppliers':'parties'} yet —</option>`;
    main.querySelector('#pay_party_label').textContent = isPayment ? 'Supplier' : 'Party';
    main.querySelector('#pay_account_label').textContent = isPayment ? 'Paid From' : 'Received Into';
    main.querySelector('#pay_note_text').innerHTML = isPayment
      ? `Amount can be less than the total payable — it will be applied to the supplier's oldest credit purchase(s) first. See the <b>Ledger</b> tab for full history.`
      : `Amount can be less than the total pending — it will be applied to the party's oldest credit sale(s) first. See the <b>Ledger</b> tab for full history.`;
  }
  const form = payAdd.closest('section');
  const updatePaymentFunding = wireShortfallCover(main, 'pay',
    ()=>main.querySelector('#pay_account').value,
    ()=>pay_direction.value==='payment' ? (Number(main.querySelector('#pay_amount').value)||0) : 0,
    accountBalance
  );
  pay_direction.onchange = ()=>{ syncPayDirection(); updatePaymentFunding(); };
  main.querySelector('#pay_amount').addEventListener('input', updatePaymentFunding);
  main.querySelector('#pay_account').addEventListener('change', updatePaymentFunding);
  payAdd.onclick = guardDoubleSubmit('pay_add', async ()=>{
    const isPayment = pay_direction.value==='payment';
    const who = pay_party.value;
    const date = main.querySelector('#pay_date').value;
    const amount = Number(main.querySelector('#pay_amount').value);
    const account = main.querySelector('#pay_account').value;
    const note = main.querySelector('#pay_note').value.trim();
    if(!who||!date||!amount){ await showAlert(`Select a ${isPayment?'supplier':'party'} and enter date and amount`); return; }
    if(!isPositiveAmount(amount)){ await showAlert('Amount must be greater than zero'); return; }
    // Neither endpoint caps the amount against what's actually owed, so a
    // typo (extra zeros) or a stale-balance party could silently
    // overpay/overpay-for-nothing. Warn — don't block, since a deliberate
    // advance is a legitimate, intended case — and the excess is recorded
    // as a visible Advance Balance (Ledger) rather than disappearing.
    const pending = isPayment ? supplierPendingTotal(who) : partyPendingTotal(who);
    const advanceNote = isPayment ? 'an Advance to them, applied against their next purchase' : 'an Advance from them, applied against their next sale';
    if(pending<=0){
      if(!await showConfirm(`${who} has no pending balance (Rs 0 owed). The full Rs ${fmtPlain(amount)} will be recorded as ${advanceNote}. Record it?`)) return;
    } else if(amount > pending){
      if(!await showConfirm(`This is Rs ${fmtPlain(amount)}, more than ${who}'s pending balance of Rs ${fmtPlain(pending)}. The extra Rs ${fmtPlain(amount-pending)} will be recorded as ${advanceNote}. Record it?`)) return;
    }
    let funding = null;
    if(isPayment){
      funding = await resolveShortfallMulti({ date, account, total: amount, getAvailable: accountBalance, prefix:'pay', main });
      if(!funding) return;
    }
    try {
      if(isPayment) await api('POST', '/api/supplier-payments', {date, supplier:who, amount, account, note, fundingTransferIds: funding.transferIds, fundingLoanIds: funding.loanIds});
      else await api('POST', '/api/receipts', {date, party:who, amount, account, note});
      await refreshState(); showToast('Recorded');
    } catch(e){ await showAlert(e.message); }
  });
  enableEnterNav(form, '#pay_add');
}

        <div id="ip_cover_wrap" style="display:none;"><label>Cover Shortfall From</label><select id="ip_cover_account" class="select-required"></select></div>

        <div id="ip_lender_wrap" style="display:none;"><label>Lender Name</label><input id="ip_lender_name" placeholder="e.g. X-Y-Z"></div>
      </div>
      <div class="settings-note" id="ip_balances_note" style="margin-bottom:12px;"></div>
      <button class="btn gold" id="ip_add">Record Payment</button>
      <div class="save-note">This amount is subtracted from the investor's Net Balance Owed above, and from the account it was paid from.</div>
      <div style="overflow-x:auto;margin-top:14px;">
      <table>
        <thead><tr><th>Date</th><th>Investor</th><th>Amount</th><th>Paid From</th><th>Note</th><th></th></tr></thead>
        <tbody>
          ${investorPayouts.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${(state.investors.find(i=>i.id===p.recipientId)||{}).name||'(removed)'}</td><td>Rs ${fmt(p.amount)}</td><td>${(allAccounts().find(a=>a.id===(p.account||'cash'))||{}).name||'Cash'}</td><td>${p.note||'—'}</td><td class="row-actions"><button class="btn danger" data-editpayout="${p.id}">Edit</button><button class="btn danger" data-delpayout="${p.id}">Delete</button></td></tr>`).join('') || `<tr><td colspan="6" class="empty">No payments recorded yet</td></tr>`}

        await api('PATCH','/api/investors/'+editing.id, {name, amount, account, date});
        editingInvestorId = null;
      } else {

      }

    b.onclick=async()=>{

      try{
        await api('DELETE','/api/investors/'+b.dataset.delinv);
        if(editingInvestorId===b.dataset.delinv) editingInvestorId = null;

        showToast('Investor deleted');
      }catch(e){ await showAlert(e.message); }
    };

  enableEnterNav(form, '#i_add');

    main.querySelector('#is_period_all').onclick = ()=>{ isSavePeriod = 'all'; render(); };
    main.querySelector('#is_save').onclick = async()=>{
      const investorId = main.querySelector('#is_investor').value;
      if(!investorId){ await showAlert('Select an investor'); return; }
      // resolve the save folder FIRST, right on the click — see the long
      // comment on fsResolveSaveDir for why this can't happen after the
      // POST/refreshState calls below.
      const dir = await fsResolveSaveDir(false);
      const periodLabel = isSavePeriod==='month' ? todayStr().slice(0,7) : 'All Time';
      const totalInv = totalInvestment();
      let rows, investorId_, investorName;
      if(investorId==='__all__'){
        rows = state.investors.map(inv=>investorSummaryRow(inv, isSavePeriod, totalInv));
        investorId_ = null;
        investorName = 'All Investors';
      } else {
        const inv = state.investors.find(i=>i.id===investorId);
        if(!inv){ await showAlert('Select an investor'); return; }
        rows = [investorSummaryRow(inv, isSavePeriod, totalInv)];
        investorId_ = inv.id;
        investorName = inv.name;
      }
      const totals = investorSummaryRowsTotal(rows);
      try{
        const created = await api('POST','/api/investor-summaries', {
          investorId: investorId_, investorName, date: todayStr(), period: isSavePeriod, periodLabel,
          investment: totals.investment, profitShare: totals.netProfit + totals.expenseShare, expenseShare: totals.expenseShare,
          paidOut: totals.paidOut, netOwed: totals.netOwed, rows
        });
        await refreshState();
        await downloadInvestorSummaryImage(created, dir);
        showToast(dir ? `Investor summary saved to folder "${dir.name}"` : 'Investor summary saved and downloaded');
      }catch(e){ await showAlert(e.message); }
    };
    main.querySelector('#is_change_location').onclick = async()=>{
      if(!fsApiSupported()){ await showAlert("Your browser doesn't support choosing a save folder. Use Chrome or Edge for this, or just use your browser's normal Downloads folder."); return; }
      const dir = await fsResolveSaveDir(true);
      if(dir){ showToast(`Save location updated to "${dir.name}" — future downloads will go there`); render(); }
    };

    b.onclick = async()=>{
      if(!await showConfirm('Delete this saved investor summary? This cannot be undone.')) return;
      try{
        await api('DELETE','/api/investor-summaries/'+b.dataset.delis);
        await refreshState();
        showToast('Saved investor summary deleted');
      }catch(e){ await showAlert(e.message); }
    };
  });
  const ipForm = main.querySelector('#ip_investor').closest('section');
  const updateInvestorPayFunding = wireShortfallCover(main, 'ip',
    ()=>main.querySelector('#ip_account').value,
    ()=>Number(main.querySelector('#ip_amount').value)||0,
    accountBalance
  );
  main.querySelector('#ip_amount').addEventListener('input', updateInvestorPayFunding);
  main.querySelector('#ip_account').addEventListener('change', updateInvestorPayFunding);
  main.querySelector('#ip_add').onclick = guardDoubleSubmit('ip_add', async()=>{
    const recipientId = main.querySelector('#ip_investor').value;
    const date = main.querySelector('#ip_date').value;
    const amount = Number(main.querySelector('#ip_amount').value);
    const account = main.querySelector('#ip_account').value;
    const note = main.querySelector('#ip_note').value.trim();
    if(!recipientId||!date||!amount){ await showAlert('Select an investor and enter date and amount'); return; }
    if(!isPositiveAmount(amount)){ await showAlert('Amount must be greater than zero'); return; }
    const inv = state.investors.find(i=>i.id===recipientId);
    if(inv){
      const owed = Number(inv.amount) + investorProfitShare(inv,'all') - investorExpenseShare(inv,'all') - payoutsTotal('investor', inv.id);
      if(amount > owed){
        if(!await showConfirm(`This investor is only owed Rs ${fmtPlain(owed)}, but you're paying Rs ${fmtPlain(amount)} — Rs ${fmtPlain(amount-owed)} more than owed. Continue anyway?`)) return;
      }
    }
    const funding = await resolveShortfallMulti({ date, account, total: amount, getAvailable: accountBalance, prefix:'ip', main });
    if(!funding) return;
    try{
      await api('POST','/api/payouts', {date, recipientType:'investor', recipientId, amount, account, note, fundingTransferIds: funding.transferIds, fundingLoanIds: funding.loanIds});
      await refreshState();
      showToast('Payment recorded');
    }catch(e){ await showAlert(e.message); }
  });
  main.querySelectorAll('[data-editpayout]').forEach(b=>{
    b.onclick = async()=>{
      const p = state.payouts.find(x=>x.id===b.dataset.editpayout);
      if(!p) return;
      const edited = await editPayoutModal({title:'Edit Investor Payment', recipientLabel:'Investor', recipients:state.investors.map(i=>({id:i.id, name:i.name})), entry:p});
      if(!edited) return;
      try{
        await api('PATCH', '/api/payouts/'+p.id, edited);
        await refreshState();
        showToast('Payment updated');
      }catch(e){ await showAlert(e.message); }
    };
  });
  main.querySelectorAll('[data-delpayout]').forEach(b=>{
    b.onclick = async()=>{
      if(!await showConfirm('Delete this payment record? This cannot be undone.')) return;
      try{
        await api('DELETE','/api/payouts/'+b.dataset.delpayout);
        await refreshState();
        showToast('Payment record deleted');
      }catch(e){ await showAlert(e.message); }
    };
  });
  enableEnterNav(ipForm, '#ip_add');
}

function commissionLedgerHtml(){
  if(!ledgerPartnerId || !state.partners.find(p=>p.id===ledgerPartnerId)) ledgerPartnerId = state.partners[0].id;
  const partner = state.partners.find(p=>p.id===ledgerPartnerId);
  const rows = partnerLedgerRows(partner);
  const earned = partnerTotalEarnings(partner);
  const paidOut = payoutsTotal('partner', partner.id);
  const owed = earned - paidOut;
  return `
    <section class="block">
      <h2>Commission Agent Ledger — ${partner.name}</h2>
      <div class="form-grid" style="margin-bottom:0;">
        <div><label>Agent</label><select id="cl_partner">${state.partners.map(p=>`<option value="${p.id}" ${p.id===ledgerPartnerId?'selected':''}>${p.name}</option>`).join('')}</select></div>

      <div class="card"><div class="label">Total Commission Earned (incl. opening)</div><div class="value">Rs ${fmt(earned)}</div></div>
      <div class="card"><div class="label">Total Paid</div><div class="value">Rs ${fmt(paidOut)}</div></div>
      <div class="card ${owed>0?'warn':''}"><div class="label">Net Balance Owed</div><div class="value">Rs ${fmt(owed)}</div></div>

      <h2>${partner.name} — Transactions</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Party / Item</th><th>Amount</th><th>Balance</th></tr></thead>
        <tbody>
          <tr><td>—</td><td>Opening</td><td>—</td><td>—</td><td>Rs ${fmt(partner.openingProfit||0)}</td></tr>
          ${rows.map(r=>`
            <tr><td>${fmtDate(r.date)}</td><td>${r.kind==='payout'?'<span class="pill credit">Payment</span>':'<span class="pill ok">Commission</span>'}</td>
            <td>${r.kind==='payout'?(r.payout.note||'—'):(r.party+' — '+r.item)}</td>
            <td style="color:${r.amount<0?'var(--danger,#c0392b)':'inherit'};">${r.amount<0?'-':'+'}Rs ${fmt(Math.abs(r.amount))}</td>
            <td>Rs ${fmt(r.balance)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No commission or payments recorded yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>
  `;
}

    </section>`}
    <section class="block">
      <h2>Personal Loans List</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Lender</th><th>Date</th><th>Amount</th><th>Deposited Into</th><th>Shortfall For</th><th>Paid Back</th><th>Outstanding</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.personalLoans.map(l=>{
            const paidOut = payoutsTotal('loan', l.id);
            const outstanding = personalLoanOutstanding(l);
            const fundedFor = personalLoanFundedTransaction(l.id);
            return `<tr><td>${l.lender}</td><td>${fmtDate(l.date)}</td><td>Rs ${fmt(l.amount)}</td><td>${(allAccounts().find(a=>a.id===(l.account||'cash'))||{}).name||'Cash'}</td><td>${fundedFor||'—'}</td><td>Rs ${fmt(paidOut)}</td><td>Rs ${fmt(outstanding)}</td>
          ${ro?'':`<td class="row-actions"><button class="btn danger" data-delloan="${l.id}">Remove</button></td>`}</tr>`;}).join('') || `<tr><td colspan="8" class="empty">No personal loans recorded yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>
    ${ro? '' : `
    <section class="block">
      <h2>Pay Back Loan</h2>
      <div class="form-grid">
        <div><label>Loan</label><select id="plp_loan">${state.personalLoans.map(l=>`<option value="${l.id}">${l.lender} — Rs ${fmtPlain(personalLoanOutstanding(l))} outstanding</option>`).join('') || '<option value="">— no loans —</option>'}</select></div>
        <div><label>Date</label><input type="date" id="plp_date" value="${todayStr()}"></div>
        <div><label>Amount</label><input type="number" id="plp_amount" placeholder="e.g. 50000"></div>
        <div><label>Paid From</label><select id="plp_account">${accountOptionsHtml('cash')}</select></div>
        <div><label>Note (optional)</label><input id="plp_note"></div>
        <div id="plp_cover_wrap" style="display:none;"><label>Cover Shortfall From</label><select id="plp_cover_account" class="select-required"></select></div>
        <div id="plp_cover_wrap1" style="display:none;"><label>Cover Remaining Shortfall From</label><select id="plp_cover_account1" class="select-required"></select></div>
        <div id="plp_lender_wrap" style="display:none;"><label>Lender Name</label><input id="plp_lender_name" placeholder="e.g. X-Y-Z"></div>
      </div>
      <div class="settings-note" id="plp_balances_note" style="margin-bottom:12px;"></div>
      <button class="btn gold" id="plp_add">Record Payment</button>
      <div class="save-note">This amount is subtracted from the loan's outstanding balance above, and from the account it was paid from.</div>
      <div style="overflow-x:auto;margin-top:14px;">
      <table>
        <thead><tr><th>Date</th><th>Lender</th><th>Amount</th><th>Paid From</th><th>Note</th><th></th></tr></thead>
        <tbody>
          ${loanPayouts.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${(state.personalLoans.find(l=>l.id===p.recipientId)||{}).lender||'(removed)'}</td><td>Rs ${fmt(p.amount)}</td><td>${(allAccounts().find(a=>a.id===(p.account||'cash'))||{}).name||'Cash'}</td><td>${p.note||'—'}</td><td class="row-actions"><button class="btn danger" data-editpayout="${p.id}">Edit</button><button class="btn danger" data-delpayout="${p.id}">Delete</button></td></tr>`).join('') || `<tr><td colspan="6" class="empty">No repayments recorded yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>`}
  `;
  if(ro) return;
  main.querySelector('#pl_add').onclick = async()=>{
    const lender = main.querySelector('#pl_lender').value.trim();
    const amount = Number(main.querySelector('#pl_amount').value);
    const date = main.querySelector('#pl_date').value;
    const account = main.querySelector('#pl_account').value;
    const note = main.querySelector('#pl_note').value.trim();
    if(!lender||!amount||!date){ await showAlert('Enter lender name, amount and date'); return; }
    if(!isPositiveAmount(amount)){ await showAlert('Amount must be greater than zero'); return; }
    try{
      await api('POST','/api/personal-loans', {lender, amount, date, account, note});
      await refreshState();
      showToast('Personal loan added');
    }catch(e){ await showAlert(e.message); }
  };
  enableEnterNav(main.querySelector('#pl_lender').closest('section'), '#pl_add');
  main.querySelectorAll('[data-delloan]').forEach(b=>{
    b.onclick = async()=>{
      if(!await showConfirm('Delete this personal loan record? This cannot be undone.')) return;
      try{
        await api('DELETE','/api/personal-loans/'+b.dataset.delloan);
        await refreshState();
        showToast('Personal loan deleted');
      }catch(e){ await showAlert(e.message); }
    };
  });
  const plpForm = main.querySelector('#plp_loan').closest('section');
  const updateLoanPayFunding = wireShortfallCover(main, 'plp',
    ()=>main.querySelector('#plp_account').value,
    ()=>Number(main.querySelector('#plp_amount').value)||0,
    accountBalance
  );
  main.querySelector('#plp_amount').addEventListener('input', updateLoanPayFunding);
  main.querySelector('#plp_account').addEventListener('change', updateLoanPayFunding);
  main.querySelector('#plp_add').onclick = guardDoubleSubmit('plp_add', async()=>{
    const recipientId = main.querySelector('#plp_loan').value;
    const date = main.querySelector('#plp_date').value;
    const amount = Number(main.querySelector('#plp_amount').value);
    const account = main.querySelector('#plp_account').value;
    const note = main.querySelector('#plp_note').value.trim();
    if(!recipientId||!date||!amount){ await showAlert('Select a loan and enter date and amount'); return; }
    if(!isPositiveAmount(amount)){ await showAlert('Amount must be greater than zero'); return; }
    const loanRec = state.personalLoans.find(l=>l.id===recipientId);
    if(loanRec){
      const owed = personalLoanOutstanding(loanRec);
      if(amount > owed){
        if(!await showConfirm(`Only Rs ${fmtPlain(owed)} is outstanding on this loan, but you're paying Rs ${fmtPlain(amount)} — Rs ${fmtPlain(amount-owed)} more than owed. Continue anyway?`)) return;
      }
    }
    const funding = await resolveShortfallMulti({ date, account, total: amount, getAvailable: accountBalance, prefix:'plp', main });
    if(!funding) return;
    try{
      await api('POST','/api/payouts', {date, recipientType:'loan', recipientId, amount, account, note, fundingTransferIds: funding.transferIds, fundingLoanIds: funding.loanIds});
      await refreshState();
      showToast('Payment recorded');
    }catch(e){ await showAlert(e.message); }
  });
  main.querySelectorAll('[data-editpayout]').forEach(b=>{
    b.onclick = async()=>{
      const p = state.payouts.find(x=>x.id===b.dataset.editpayout);
      if(!p) return;
      const edited = await editPayoutModal({title:'Edit Loan Repayment', recipientLabel:'Loan', recipients:state.personalLoans.map(l=>({id:l.id, name:l.lender})), entry:p});
      if(!edited) return;
      try{
        await api('PATCH', '/api/payouts/'+p.id, edited);
        await refreshState();
        showToast('Payment updated');
      }catch(e){ await showAlert(e.message); }
    };
  });
  main.querySelectorAll('[data-delpayout]').forEach(b=>{
    b.onclick = async()=>{
      if(!await showConfirm('Delete this payment record? This cannot be undone.')) return;
      try{
        await api('DELETE','/api/payouts/'+b.dataset.delpayout);
        await refreshState();
        showToast('Payment record deleted');
      }catch(e){ await showAlert(e.message); }
    };
  });
  enableEnterNav(plpForm, '#plp_add');
}

function renderExpenses(main){
  const ro = !canEditActiveClient();
  const editing = editingExpenseId ? state.expenses.find(x=>x.id===editingExpenseId) : null;
  main.innerHTML = `
    ${ro? '' : `
    <section class="block">
      <h2>${editing?'Edit Expense Entry':'New Expense Entry'}</h2>
      <div class="form-grid">
        <div><label>Date</label><input type="date" id="e_date" value="${editing?editing.date:todayStr()}"></div>
        <div><label>Description</label><input id="e_desc" placeholder="e.g. Rent, Electricity, Labor" value="${editing?editing.desc:''}"></div>
        <div><label>Amount</label><input type="number" id="e_amount" value="${editing?editing.amount:''}"></div>
        <div><label>Paid From</label><select id="e_account">${accountOptionsHtml(editing?editing.account:'cash')}</select></div>
        <div id="e_cover_wrap" style="display:none;"><label>Cover Shortfall From</label><select id="e_cover_account" class="select-required"></select></div>
        <div id="e_cover_wrap1" style="display:none;"><label>Cover Remaining Shortfall From</label><select id="e_cover_account1" class="select-required"></select></div>
        <div id="e_lender_wrap" style="display:none;"><label>Lender Name</label><input id="e_lender_name" placeholder="e.g. X-Y-Z"></div>
      </div>
      <div class="settings-note" id="e_balances_note" style="margin-bottom:12px;"></div>
      <button class="btn gold" id="e_add">${editing?'Save Changes':'Add Expense'}</button>
      ${editing?'<button class="btn danger" id="e_cancel" style="margin-left:8px;">Cancel Edit</button>':''}
    </section>`}
    <section class="block">
      <h2>Expenses List</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Paid From</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.expenses.slice().reverse().map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.desc}</td><td>Rs ${fmt(e.amount)}</td><td>${(allAccounts().find(a=>a.id===(e.account||'cash'))||{}).name||'Cash'}</td>
          ${ro?'':`<td class="row-actions"><button class="btn danger" data-eedit="${e.id}">Edit</button><button class="btn danger" data-edelete="${e.id}">Delete</button></td>`}</tr>`).join('') || `<tr><td colspan="5" class="empty">No expenses entered yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>
  `;
  if(ro) return;
  const form = main.querySelector('.form-grid').closest('section');
  function expenseAvailable(accId){
    return accountBalance(accId) + (editing && editing.account===accId ? Number(editing.amount) : 0);
  }
  const updateExpenseFunding = wireShortfallCover(main, 'e',
    ()=>main.querySelector('#e_account').value,
    ()=>Number(main.querySelector('#e_amount').value)||0,
    expenseAvailable
  );
  main.querySelector('#e_amount').addEventListener('input', updateExpenseFunding);
  main.querySelector('#e_account').addEventListener('change', updateExpenseFunding);
  main.querySelector('#e_add').onclick=guardDoubleSubmit('e_add', async()=>{
    const date=main.querySelector('#e_date').value, desc=main.querySelector('#e_desc').value.trim(),
      amount=Number(main.querySelector('#e_amount').value), account=main.querySelector('#e_account').value;
    if(!desc||!amount){ await showAlert('Enter description and amount'); return; }
    if(!isPositiveAmount(amount)){ await showAlert('Amount must be greater than zero'); return; }
    const funding = await resolveShortfallMulti({ date, account, total: amount, getAvailable: expenseAvailable, prefix:'e', main });
    if(!funding) return;
    try{
      if(editing){
        await api('PATCH','/api/expenses/'+editing.id, {date, desc, amount, account});
        editingExpenseId = null;
      } else {
        await api('POST','/api/expenses', {date, desc, amount, account, fundingTransferIds: funding.transferIds, fundingLoanIds: funding.loanIds});
      }
      await refreshState();
      showToast(editing ? 'Expense updated' : 'Expense added');
    }catch(e){ await showAlert(e.message); }
  });
  if(editing){
    main.querySelector('#e_cancel').onclick = ()=>{ editingExpenseId = null; render(); };
  }
  main.querySelectorAll('[data-eedit]').forEach(b=>{
    b.onclick = ()=>{ editingExpenseId = b.dataset.eedit; render(); };
  });
  main.querySelectorAll('[data-edelete]').forEach(b=>{
    b.onclick = async()=>{
      if(!await showConfirm('Delete this expense entry? This cannot be undone.')) return;
      try{
        await api('DELETE','/api/expenses/'+b.dataset.edelete);
        if(editingExpenseId===b.dataset.edelete) editingExpenseId = null;
        await refreshState();
        showToast('Expense deleted');
      }catch(e){ await showAlert(e.message); }
    };
  });
  enableEnterNav(form, '#e_add');
}

// ---------- REPORTS ----------

  const ym = todayStr().slice(0,7);

  const monthPurch = state.purchases.filter(p=>!p.staged && p.date && p.date.startsWith(ym));

      <div class="cards">
        <div class="card"><div class="label">Starting Position</div><div class="value">Rs ${fmt(nwt.startingValue)}</div></div>
        <div class="card"><div class="label">Current Net Worth</div><div class="value">Rs ${fmt(nwt.points.length?nwt.points[nwt.points.length-1].value:nwt.startingValue)}</div></div>
        <div class="card ${nwtGrowth>=0?'':'warn'}"><div class="label">Growth Since Start</div><div class="value">${nwtGrowth>=0?'+':'−'}Rs ${fmt(Math.abs(nwtGrowth))}</div></div>
        <div class="card ${nwtVsInvestment>=0?'':'warn'}"><div class="label">Above Total Investment</div><div class="value">${nwtVsInvestment>=0?'+':'−'}Rs ${fmt(Math.abs(nwtVsInvestment))}</div></div>
      </div>

      <div style="overflow-x:auto;margin-top:10px;">
      <table>
        <thead><tr><th>Month</th><th>Investment</th><th>Profit</th><th>Commission</th><th>Expenses</th><th>Investor Payouts</th><th>Net Change</th><th>Running Total</th></tr></thead>
        <tbody>
          ${nwt.points.map(p=>{
            if(p.ym==='Start') return `<tr style="background:var(--gold-soft);"><td>Starting Position</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>Rs ${fmt(p.value)}</td></tr>`;
