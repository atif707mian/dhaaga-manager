          <thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Bill Amount</th><th>Amount Received</th><th>Balance</th><th>Status</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.type==='bill'?'Bill':'Receipt'}${r.staged?' <span class="pill role" title="Historical entry">Historical</span>':''}</td><td>${r.desc}</td>
            <td>${r.type==='bill'?'Rs '+fmt(r.amount):'—'}</td><td>${r.type==='receipt'?'Rs '+fmt(r.amount):'—'}</td>
            <td>Rs ${fmt(r.balance)}</td><td>${r.type==='bill'?statusPill(r.status):'—'}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">No bills or receipts for this party yet</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr style="font-weight:700;background:var(--gold-soft);"><td colspan="3">Total</td><td>Rs ${fmt(totalBilled)}</td><td>Rs ${fmt(totalReceived)}</td><td>Rs ${fmt(finalBalance)}</td><td></td></tr></tfoot>` : ''}
        </table>
        </div>
        <div class="save-note" style="margin-top:8px;">Running Balance is what this party still owes after each line (opening balance + bills − receipts). Includes Historical entries, same as the Party Ledger. Total row: Total Billed, Total Received, and Final Balance Due as of today.</div>`;
      })() : `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;margin-bottom:12px;">
        <button class="btn ${receivingReportPeriod==='week'?'gold':'nav'}" id="rr_period_week">Weekly</button>
        <button class="btn ${receivingReportPeriod==='month'?'gold':'nav'}" id="rr_period_month">Monthly</button>
        <button class="btn ${receivingReportPeriod==='all'?'gold':'nav'}" id="rr_period_all">All Time</button>
      </div>
      ${receivingReportPeriod==='week' ? (()=>{
        const { days, parties, byParty } = receivingReportData(receivingReportWeekOffset);
        const dayLabel = d => new Date(d).toLocaleDateString('en-US', {weekday:'short', day:'numeric', month:'short'});
        const dayTotals = days.map(d => parties.reduce((a,p)=>a+(byParty[p][d]||0),0));
        const partyTotals = parties.map(p => days.reduce((a,d)=>a+(byParty[p][d]||0),0));
        const grandTotal = dayTotals.reduce((a,v)=>a+v,0);
        return `
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <button class="btn nav" id="rr_prev_week">← Previous Week</button>
          <span style="color:var(--muted);font-size:13px;">${fmtDate(days[0])} to ${fmtDate(days[6])}${receivingReportWeekOffset===0?' (This Week)':''}</span>
          <button class="btn ${receivingReportWeekOffset===0?'gold':'nav'}" id="rr_this_week">This Week</button>
          <button class="btn nav" id="rr_next_week">Next Week →</button>
        </div>
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Party</th>${days.map(d=>`<th>${dayLabel(d)}</th>`).join('')}<th>Total</th></tr></thead>
          <tbody>
            ${parties.map((p,i)=>`<tr><td>${p}</td>${days.map(d=>`<td>${byParty[p][d]?'Rs '+fmt(byParty[p][d]):'—'}</td>`).join('')}<td>Rs ${fmt(partyTotals[i])}</td></tr>`).join('') || `<tr><td colspan="${days.length+2}" class="empty">No receipts recorded this week</td></tr>`}
          </tbody>
          ${parties.length ? `<tfoot><tr style="font-weight:700;background:var(--gold-soft);"><td>Total</td>${dayTotals.map(t=>`<td>Rs ${fmt(t)}</td>`).join('')}<td>Rs ${fmt(grandTotal)}</td></tr></tfoot>` : ''}
        </table>
        </div>`;
      })() : receivingReportPeriod==='month' ? (()=>{
        const { ym, label } = receivingReportMonthBounds(receivingReportMonthOffset);
        const rows = receivingReportTransactions(d => d && d.startsWith(ym));
        const grandTotal = rows.reduce((a,r)=>a+r.amount,0);
        return `
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <button class="btn nav" id="rr_prev_month">← Previous Month</button>
          <span style="color:var(--muted);font-size:13px;">${label}${receivingReportMonthOffset===0?' (This Month)':''}</span>
          <button class="btn ${receivingReportMonthOffset===0?'gold':'nav'}" id="rr_this_month">This Month</button>
          <button class="btn nav" id="rr_next_month">Next Month →</button>
        </div>
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Party</th><th>Amount</th><th>Received Into</th><th>Note</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.party}</td><td>Rs ${fmt(r.amount)}</td><td>${r.method}</td><td>${r.note||'—'}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No receipts recorded this month</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr style="font-weight:700;background:var(--gold-soft);"><td colspan="2">Total</td><td>Rs ${fmt(grandTotal)}</td><td colspan="2"></td></tr></tfoot>` : ''}
        </table>
        </div>`;
      })() : (()=>{
        const rows = receivingReportTransactions(()=>true);
        const grandTotal = rows.reduce((a,r)=>a+r.amount,0);
        return `
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Party</th><th>Amount</th><th>Received Into</th><th>Note</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.party}</td><td>Rs ${fmt(r.amount)}</td><td>${r.method}</td><td>${r.note||'—'}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No receipts recorded yet</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr style="font-weight:700;background:var(--gold-soft);"><td colspan="2">Total</td><td>Rs ${fmt(grandTotal)}</td><td colspan="2"></td></tr></tfoot>` : ''}
        </table>
        </div>`;
      })()}`}
    </section>
    <section class="block">
      <h2>Bank Ledger</h2>
      <div class="form-grid" style="margin-bottom:0;">
        <div><label>Account</label><select id="rep_account">${accountOptionsHtml(reportsAccount)}</select></div>
      </div>
      <div class="cards">
        <div class="card"><div class="label">Opening Balance</div><div class="value">Rs ${fmt(reportsAccount==='cash' ? Number(state.settings.openingCash||0) : Number((state.banks.find(b=>b.id===reportsAccount)||{}).openingBalance||0))}</div></div>
        <div class="card"><div class="label">Current Balance</div><div class="value">Rs ${fmt(accountBalance(reportsAccount))}</div></div>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th><th>Balance</th></tr></thead>
        <tbody>
          ${accountLedgerRows(reportsAccount).map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.kind}</td><td>${r.desc||'—'}</td><td style="color:${r.amount<0?'var(--danger,#c0392b)':'inherit'};">${r.amount<0?'-':'+'}Rs ${fmt(Math.abs(r.amount))}</td><td>Rs ${fmt(r.balance)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No transactions yet</td></tr>'}
        </tbody>
      </table>
      </div>
    </section>
    <section class="block">
      <h2>Personal Loans Report</h2>
      <div class="save-note" style="margin-bottom:12px;">Each loan's full history in one place — when it was taken and into which account, and every repayment's date and the account it was paid from — for matching against a bank statement.</div>
      ${personalLoanReportGroups().map(g=>{
        const outstanding = personalLoanOutstanding(g.loan);
        const takenAccount = (allAccounts().find(a=>a.id===(g.loan.account||'cash'))||{}).name||'Cash';
        const fundedFor = personalLoanFundedTransaction(g.loan.id);
        return `
        <div style="margin-bottom:18px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600;">${g.loan.lender}${outstanding>0.009?` <span class="pill due">Rs ${fmt(outstanding)} outstanding</span>`:' <span class="pill ok">Fully Repaid</span>'}</div>
          ${fundedFor ? `<div class="settings-note" style="margin-bottom:8px;">Taken to cover a shortfall during: <b>${fundedFor}</b></div>` : ''}
          <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Date</th><th>Event</th><th>Amount</th><th>Account</th></tr></thead>
            <tbody>
              <tr><td>${fmtDate(g.loan.date)}</td><td>Loan Taken${g.loan.note?' — '+g.loan.note:''}</td><td>+Rs ${fmt(g.loan.amount)}</td><td>${takenAccount}</td></tr>
              ${g.repayments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>Repayment${p.note?' — '+p.note:''}</td><td>-Rs ${fmt(p.amount)}</td><td>${(allAccounts().find(a=>a.id===(p.account||'cash'))||{}).name||'Cash'}</td></tr>`).join('') || `<tr><td colspan="4" class="empty">No repayments yet</td></tr>`}
            </tbody>
          </table>
          </div>
        </div>`;
      }).join('') || '<div class="empty">No personal loans recorded yet</div>'}
    </section>
    <section class="block">
      <h2>Cheque Clearing Status</h2>
      <div class="cards">
        <div class="card warn"><div class="label">Received — Pending</div><div class="value">Rs ${fmt(chequesPendingTotal('received'))}</div></div>
        <div class="card warn"><div class="label">Issued — Pending</div><div class="value">Rs ${fmt(chequesPendingTotal('issued'))}</div></div>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Direction</th><th>Party</th><th>Bank</th><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead>
        <tbody>
          ${state.cheques.slice().reverse().map(c=>`<tr><td>${fmtDate(c.date)}</td><td>${c.direction==='issued'?'Issued':'Received'}</td><td>${c.party}</td><td>${c.bank||'—'}</td><td>Rs ${fmt(c.amount)}</td><td>${fmtDate(c.dueDate)}</td><td>${c.status==='pending'?'<span class="pill due">Pending</span>':'<span class="pill ok">Cleared</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No cheques entered yet</td></tr>'}
        </tbody>
      </table>
      </div>
    </section>
    <section class="block">
      <h2>Edit / Delete History</h2>
      <div class="form-grid" style="margin-bottom:14px;">
        <div><label>From Date</label><input type="date" id="audit_from" value="${auditFrom}"></div>
        <div><label>To Date</label><input type="date" id="audit_to" value="${auditTo}"></div>
        <div><label>Party / Supplier</label><input id="audit_party" value="${auditParty}" placeholder="e.g. Rex Hosiery"></div>
        <div style="align-self:end;"><button class="btn gold" id="audit_filter">Filter</button></div>
      </div>
      <div class="save-note" style="margin-top:-6px;margin-bottom:14px;">Showing the last 10 by default — search by date and/or party/supplier above to see every matching entry.</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn ${auditView==='edit'?'gold':'danger'}" id="view_edit">Edited Entries</button>
        <button class="btn ${auditView==='delete'?'gold':'danger'}" id="view_delete">Deleted Entries</button>
      </div>
      ${auditView==='edit' ? `
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th></th><th>Type</th><th>Date</th><th>Party/Supplier</th><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead>
          <tbody>
            ${auditRows('edit').map(a=>{
              const b = auditDisplay(a.kind, a.before), af = auditDisplay(a.kind, a.after);
              return `
              <tr style="background:rgba(255,0,0,.04);"><td><b>Before</b></td><td>${kindLabel(a.kind)}</td><td>${fmtDate(b.date)}</td><td>${b.who}</td><td>${b.item}</td><td>${b.qty}</td><td>${b.rate}</td><td>${b.total}</td></tr>
              <tr style="background:rgba(0,150,0,.05);border-bottom:2px solid var(--line);"><td><b>After</b></td><td>${kindLabel(a.kind)}</td><td>${fmtDate(af.date)}</td><td>${af.who}</td><td>${af.item}</td><td>${af.qty}</td><td>${af.rate}</td><td>${af.total}</td></tr>
            `;}).join('') || `<tr><td colspan="8" class="empty">No edits in this range</td></tr>`}
          </tbody>
        </table>
        </div>
      ` : `
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Deleted On</th><th>Type</th><th>Date</th><th>Party/Supplier</th><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead>
          <tbody>
            ${auditRows('delete').map(a=>{
              const e = auditDisplay(a.kind, a.entry);
              return `<tr><td>${fmtDate(a.actionDate)}</td><td>${kindLabel(a.kind)}</td><td>${fmtDate(e.date)}</td><td>${e.who}</td><td>${e.item}</td><td>${e.qty}</td><td>${e.rate}</td><td>${e.total}</td></tr>`;
            }).join('') || `<tr><td colspan="8" class="empty">No deletions in this range</td></tr>`}
          </tbody>
        </table>
        </div>
      `}
    </section>
  `;
  main.querySelector('#audit_filter').onclick = ()=>{
    auditFrom = main.querySelector('#audit_from').value;
    auditTo = main.querySelector('#audit_to').value;
    auditParty = main.querySelector('#audit_party').value;
    render();
  };
  enableEnterNav(main.querySelector('#audit_from').closest('section'), '#audit_filter');
  main.querySelector('#view_edit').onclick = ()=>{ auditView='edit'; render(); };
  main.querySelector('#view_delete').onclick = ()=>{ auditView='delete'; render(); };
  main.querySelector('#rep_account').onchange = (e)=>{ reportsAccount = e.target.value; render(); };
  main.querySelector('#rr_party').onchange = (e)=>{ receivingReportParty = e.target.value; render(); };
  if(main.querySelector('#rr_period_week')){
    main.querySelector('#rr_period_week').onclick = ()=>{ receivingReportPeriod = 'week'; render(); };
    main.querySelector('#rr_period_month').onclick = ()=>{ receivingReportPeriod = 'month'; render(); };
    main.querySelector('#rr_period_all').onclick = ()=>{ receivingReportPeriod = 'all'; render(); };
  }
  if(main.querySelector('#rr_prev_week')){
    main.querySelector('#rr_prev_week').onclick = ()=>{ receivingReportWeekOffset -= 1; render(); };
    main.querySelector('#rr_next_week').onclick = ()=>{ receivingReportWeekOffset += 1; render(); };
    main.querySelector('#rr_this_week').onclick = ()=>{ receivingReportWeekOffset = 0; render(); };
  }
  if(main.querySelector('#rr_prev_month')){
    main.querySelector('#rr_prev_month').onclick = ()=>{ receivingReportMonthOffset -= 1; render(); };
    main.querySelector('#rr_next_month').onclick = ()=>{ receivingReportMonthOffset += 1; render(); };
    main.querySelector('#rr_this_month').onclick = ()=>{ receivingReportMonthOffset = 0; render(); };
  }
}

// ---------- SETTINGS ----------
function renderSettings(main){
  const ro = !isAdmin(); // gates GLOBAL-admin-only tabs (Clients/Users/Backup — affect the whole SaaS deployment)
  const ce = canEditActiveClient(); // gates THIS client's own settings (editor-or-admin on the active client)
  const editingUser = editingUserId ? userList.find(u=>u.id===editingUserId) : null;
  const editingBank = editingBankId ? state.banks.find(b=>b.id===editingBankId) : null;
  const editingClient = editingClientId ? adminClients.find(c=>c.id===editingClientId) : null;
  const ALL_SETTINGS_TABS = [
    {id:'clients', label:'Clients', adminOnly:true},
    {id:'users', label:'Users', adminOnly:true},
    {id:'opening', label:'Opening Balances', adminOnly:false},
    {id:'banks', label:'Bank Accounts', adminOnly:false},
    {id:'preferences', label:'Preferences', adminOnly:false},
    {id:'backup', label:'Backup', adminOnly:true}
  ];
  const SETTINGS_TABS = ALL_SETTINGS_TABS.filter(t=>!t.adminOnly || !ro);
  const tab = SETTINGS_TABS.find(t=>t.id===settingsTab) ? settingsTab : SETTINGS_TABS[0].id;
  const clientScopedTab = ['opening','preferences','banks'].includes(tab);
  const activeClientForSettings = clientList.find(c=>c.id===session.activeClientId);
  main.innerHTML = `
    ${clientScopedTab ? `
    <div class="settings-client-picker">
      <label>${isAdmin()&&clientList.length>1?'Editing settings for':'Client'}</label>
      ${isAdmin()&&clientList.length>1
        ? `<select id="settingsClientSwitch">${clientList.map(c=>`<option value="${c.id}" ${c.id===session.activeClientId?'selected':''}>${c.name}</option>`).join('')}</select>`
        : `<b>${activeClientForSettings?activeClientForSettings.name:'—'}</b>`}
    </div>` : ''}
    <div class="subtabs">${SETTINGS_TABS.map(t=>`<button data-stab="${t.id}" class="${tab===t.id?'active':''}">${t.label}</button>`).join('')}</div>
    ${tab==='opening' ? (()=>{
      const OPENING_SUBTABS = [
        {id:'material', label:'Material'},
        {id:'supplier', label:'Supplier'},
        {id:'buyer', label:'Buyer'}
      ];
      const osub = OPENING_SUBTABS.find(t=>t.id===masterTab) ? masterTab : 'material';
      return `
    <section class="block">
      <h2>Opening Cash${activeClientForSettings?' — '+activeClientForSettings.name:''}</h2>
      <div class="form-grid">
        <div><label>Opening Cash</label><input type="number" id="op_cash" value="${state.settings.openingCash}" ${ce?'':'disabled'}></div>
      </div>
      <div class="settings-note" style="margin-bottom:12px;">Opening Cash is the cash this client's business started with before any entries were made here — every later Cash in Hand figure is this plus all cash sales/receipts minus cash purchases/expenses/payouts.</div>
      ${ce? '<button class="btn gold" id="save_opening">Save</button>' : ''}
    </section>
    <div class="subtabs">${OPENING_SUBTABS.map(t=>`<button data-otab="${t.id}" class="${osub===t.id?'active':''}">${t.label}</button>`).join('')}</div>
    ${osub==='material' ? materialSectionHtml(!ce) : ''}
    ${osub==='supplier' ? supplierSectionHtml(!ce) : ''}
    ${osub==='buyer' ? buyerSectionHtml(!ce) : ''}
    `;
    })() : ''}
    ${tab==='preferences' ? `
    <section class="block">
      <h2>Preferences${activeClientForSettings?' — '+activeClientForSettings.name:''}</h2>
      <div class="form-grid">
        <div><label>Cheque Reminder — days before</label><input type="number" id="c_rem" value="${state.settings.chequeReminderDays}" ${ce?'':'disabled'}></div>
        <div><label>Credit Recovery Reminder — days before</label><input type="number" id="cr_rem" value="${state.settings.creditReminderDays}" ${ce?'':'disabled'}></div>
      </div>
      <div class="settings-note" style="margin-bottom:12px;">
        <label style="display:flex;align-items:center;gap:8px;color:var(--ink);"><input type="checkbox" id="setup_mode" ${state.settings.setupMode?'checked':''} ${ce?'':'disabled'}> Historical Data Entry Mode — while this is on, every new Sale/Purchase is marked "Historical" and is <b>permanently</b> excluded from Stock, Cash in Hand, Bank balances and Profit (and skips the oversell/unit guards, so old records can be entered in any order, even without a matching Purchase on file). It still counts immediately and permanently toward the Party/Supplier Ledger, Recoverable/Payable Due, and Dashboard reminders — that's the only thing this mode is for. Turning it off only changes how the <b>next new</b> entry is tagged; it does not go back and change anything already marked Historical.</label>
      </div>
      <h2 style="margin-top:20px;">Theme</h2>
      <div class="form-grid">
        <div><label>Theme Color</label><input type="color" id="theme_color" value="${state.settings.themeColor||'#2563EB'}" ${ce?'':'disabled'} style="height:40px;padding:4px;"></div>
        <div><label>Font Size</label><select id="font_size" ${ce?'':'disabled'}>
          <option value="small" ${state.settings.fontSize==='small'?'selected':''}>Small</option>
          <option value="medium" ${(!state.settings.fontSize||state.settings.fontSize==='medium')?'selected':''}>Medium</option>
          <option value="large" ${state.settings.fontSize==='large'?'selected':''}>Large</option>
        </select></div>
      </div>
      <div class="settings-note" style="margin-bottom:12px;">Changes the color and font size for everyone using this client.</div>
      ${ce? '<button class="btn gold" id="save_preferences">Save</button>' : ''}
    </section>` : ''}
    ${tab==='banks' ? `
    <section class="block">
      ${ce? `
      <h2>${editingBank?'Edit Bank Account':'Add Bank Account'}${activeClientForSettings?' — '+activeClientForSettings.name:''}</h2>
      <div class="form-grid">
        <div><label>Bank / Account Name</label><input id="b_name" placeholder="e.g. Meezan Bank" value="${editingBank?editingBank.name:''}"></div>
        <div><label>Opening Balance</label><input type="number" id="b_balance" value="${editingBank?editingBank.openingBalance:''}"></div>
      </div>
      <div class="settings-note" style="margin-bottom:12px;">
        <label style="display:flex;align-items:center;gap:8px;color:var(--ink);"><input type="checkbox" id="b_locker" ${editingBank&&editingBank.locker?'checked':''}> Locker / Frozen Account — record-keeping only. Excluded from the Dashboard and Total Funds; balance can still be moved into Cash in Hand via a Transfer.</label>
      </div>
      <button class="btn gold" id="b_add">${editingBank?'Save Changes':'Add Bank Account'}</button>
      ${editingBank?'<button class="btn danger" id="b_cancel" style="margin-left:8px;">Cancel Edit</button>':''}
      ` : `<h2>Bank Accounts${activeClientForSettings?' — '+activeClientForSettings.name:''}</h2>`}
      <div style="overflow-x:auto;margin-top:14px;">
      <table>
        <thead><tr><th>Bank</th><th>Current Balance</th>${ce?'<th></th>':''}</tr></thead>
        <tbody>
          ${state.banks.map(b=>`<tr><td>${b.name}${b.locker?' <span class="pill role" title="Record-keeping only — excluded from Dashboard and Total Funds">Locker</span>':''}</td><td>Rs ${fmt(accountBalance(b.id))}</td>${ce?`<td class="row-actions"><button class="btn danger" data-editbank="${b.id}">Edit</button><button class="btn danger" data-delbank="${b.id}">Remove</button></td>`:''}</tr>`).join('') || `<tr><td colspan="${ce?3:2}" class="empty">No bank accounts added yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>` : ''}
    ${(!ro && tab==='clients') ? `
    <section class="block">
      <h2>${editingClient?'Edit Client':'Clients'}</h2>
      <div class="form-grid">
        <div><label>Client Name</label><input id="cl_name" placeholder="e.g. Bismillah Traders" value="${editingClient?editingClient.name:''}"></div>
        ${editingClient?`
        <div><label>Theme Color</label><input type="color" id="cl_theme" value="${editingClient.themeColor||'#2563EB'}" style="height:40px;padding:4px;"></div>
        <div><label>Font Size</label><select id="cl_fontsize">
          <option value="small" ${editingClient.fontSize==='small'?'selected':''}>Small</option>
          <option value="medium" ${(!editingClient.fontSize||editingClient.fontSize==='medium')?'selected':''}>Medium</option>
          <option value="large" ${editingClient.fontSize==='large'?'selected':''}>Large</option>
        </select></div>` : ''}
      </div>
      <button class="btn gold" id="cl_add">${editingClient?'Save Changes':'Add Client'}</button>
      ${editingClient?'<button class="btn danger" id="cl_cancel" style="margin-left:8px;">Cancel Edit</button>':''}
      <div class="settings-note" style="margin-top:10px;">Each client is a separate business with its own fully isolated data, including its own theme color and font size. Deactivating a client hides it from the switcher without deleting its data.</div>
      <div style="overflow-x:auto;margin-top:14px;">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Theme</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${adminClients.map(c=>`<tr><td>${c.clientNumber}</td><td>${c.name}</td><td><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${c.themeColor||'#2563EB'};vertical-align:middle;border:1px solid var(--line);"></span></td><td><span class="pill role">${c.status==='active'?'Active':'Inactive'}</span></td>
          <td class="row-actions"><button class="btn danger" data-editclient="${c.id}">Edit</button><button class="btn danger" data-toggleclient="${c.id}" data-newstatus="${c.status==='active'?'inactive':'active'}">${c.status==='active'?'Deactivate':'Activate'}</button></td></tr>`).join('') || `<tr><td colspan="5" class="empty">Loading...</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>` : ''}
    ${(!ro && tab==='users') ? `
    <section class="block">
      <h2>${editingUser ? 'Edit User' : 'Add New User'}</h2>
      <div class="form-grid">
        <div><label>Username</label><input id="u_name" value="${editingUser?editingUser.username:''}" autocomplete="off" name="new_user_username_${editingUser?editingUser.id:'new'}"></div>
        <div><label>Password</label><input type="password" id="u_pass" placeholder="${editingUser?'Leave blank to keep current password':''}" autocomplete="new-password" name="new_user_password_${editingUser?editingUser.id:'new'}"></div>
        <div><label>Role</label><select id="u_role"><option value="standard" ${editingUser&&editingUser.role==='standard'?'selected':''}>Standard (assigned to one client)</option><option value="admin" ${editingUser&&editingUser.role==='admin'?'selected':''}>Admin (all clients + Settings)</option></select></div>
        <div id="u_client_wrap"><label>Client</label><select id="u_client">${clientList.map(c=>`<option value="${c.id}" ${editingUser&&editingUser.clients&&editingUser.clients[0]&&editingUser.clients[0].clientId===c.id?'selected':''}>${c.name}</option>`).join('') || '<option value="">— no clients yet —</option>'}</select></div>
        <div id="u_access_wrap"><label>Access Level</label><select id="u_access"><option value="editor" ${editingUser&&editingUser.clients&&editingUser.clients[0]&&editingUser.clients[0].accessLevel==='editor'?'selected':''}>Editor (read/write)</option><option value="viewer" ${editingUser&&editingUser.clients&&editingUser.clients[0]&&editingUser.clients[0].accessLevel==='viewer'?'selected':''}>Viewer (read only)</option></select></div>
      </div>
      <button class="btn gold" id="u_add">${editingUser?'Save Changes':'Add User'}</button>
      ${editingUser?'<button class="btn danger" id="u_cancel" style="margin-left:8px;">Cancel</button>':''}
      <div style="overflow-x:auto;margin-top:14px;">
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Client</th><th>Access</th><th></th></tr></thead>
        <tbody>
          ${userList.filter(u=>u.status==='active').map(u=>{
            const uc = (u.clients||[])[0];
            return `<tr><td>${u.username}</td><td><span class="pill role">${u.role==='admin'?'Admin':'Standard'}</span></td><td>${uc?uc.clientName:'—'}</td><td>${uc?(uc.accessLevel==='editor'?'Editor':'Viewer'):'—'}</td>
          <td class="row-actions"><button class="btn danger" data-edituser="${u.id}">Edit</button>${u.username===session.username ? '' : `<button class="btn danger" data-deluser="${u.id}">Remove</button>`}</td></tr>`;}).join('') || `<tr><td colspan="5" class="empty">Loading...</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>` : ''}
    ${(!ro && tab==='backup') ? `
    <section class="block">
      <h2>Backup</h2>
      <button class="btn gold" id="bk_run">Run Backup Now</button>
      <div class="settings-note" style="margin:10px 0;">This backs up the entire database (all clients). Backups are stored on the server at <code>${backupSettings?backupSettings.location:'./backups'}</code>.</div>
      <button class="btn gold" id="bk_source" style="margin-top:4px;">Backup Source Code to GitHub</button>
      <div class="settings-note" style="margin:10px 0;">This saves the software's own source files (not client data) to the private GitHub repository already connected on this computer.</div>
      <div style="overflow-x:auto;margin-top:10px;">
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Type</th><th>Status</th><th>Size</th><th></th></tr></thead>
        <tbody>
          ${backupHistory.map(b=>`<tr><td>${fmtDateTime(b.createdAt)}</td><td>${b.fileName||'—'}</td><td>${b.type}</td><td><span class="pill role">${b.status}</span></td><td>${fmtBytes(b.fileSize)}</td>
          <td class="row-actions">${b.status==='success'?`<a class="btn danger" href="/api/backup/download/${b.id}">Download</a>`:`<span title="${b.errorMessage||''}">failed</span>`}</td></tr>`).join('') || `<tr><td colspan="6" class="empty">No backups yet</td></tr>`}
        </tbody>
      </table>
      </div>
      <h2 style="margin-top:24px;">Scheduled Backups</h2>
      ${backupSettings ? `
      <div class="form-grid">
        <div><label><input type="checkbox" id="bs_enabled" ${backupSettings.scheduleEnabled?'checked':''}> Enable automatic backups</label></div>
        <div><label>Frequency</label><select id="bs_freq">
          <option value="hourly" ${backupSettings.frequency==='hourly'?'selected':''}>Hourly</option>
          <option value="daily" ${backupSettings.frequency==='daily'?'selected':''}>Daily</option>
          <option value="weekly" ${backupSettings.frequency==='weekly'?'selected':''}>Weekly (Sunday)</option>
          <option value="monthly" ${backupSettings.frequency==='monthly'?'selected':''}>Monthly (1st)</option>
        </select></div>
        <div id="bs_time_wrap"><label>${backupSettings.frequency==='hourly'?'Minute Past the Hour':'Time of Day'}</label><input type="${backupSettings.frequency==='hourly'?'number':'time'}" id="bs_time" ${backupSettings.frequency==='hourly'?`min="0" max="59" value="${(backupSettings.timeOfDay||'02:00').split(':')[1]}"`:`value="${backupSettings.timeOfDay}"`}></div>
        <div><label>Timezone</label><input id="bs_tz" value="${backupSettings.timezone}"></div>
        <div><label>Keep how many backups</label><input type="number" id="bs_retain" value="${backupSettings.retentionCount}"></div>
        <div><label>Storage Folder</label><input id="bs_location" value="${backupSettings.location}"></div>
      </div>
      <button class="btn gold" id="bs_save">Save Schedule</button>
      ` : '<div class="empty">Loading...</div>'}
      <h2 style="margin-top:24px;">Restore from Backup File</h2>
      <div class="settings-note" style="margin-bottom:10px;">Restoring OVERWRITES all current data with the contents of the uploaded file. A safety backup of the current data is taken automatically first. This cannot be undone except by restoring an earlier backup.</div>
      <div class="form-grid">
        <div><label>Backup File (.dump)</label><input type="file" id="rs_file" accept=".dump"></div>
        <div><label>Type RESTORE to confirm</label><input id="rs_confirm" class="no-skip-empty"></div>
      </div>
      <button class="btn danger" id="rs_go">Restore</button>
    </section>` : ''}
  `;
  main.querySelectorAll('[data-stab]').forEach(b=>{
    b.onclick = ()=>{ settingsTab = b.dataset.stab; render(); };
  });
  const settingsClientSwitch = main.querySelector('#settingsClientSwitch');
  if(settingsClientSwitch){
    settingsClientSwitch.onchange = async()=>{
      try{
        session = await api('POST','/api/session/active-client', {clientId: settingsClientSwitch.value});
        await loadState();
      }catch(e){ await showAlert(e.message); }
    };
  }
  if(tab==='opening'){
    const osub = ['material','supplier','buyer'].includes(masterTab) ? masterTab : 'material';
    main.querySelectorAll('[data-otab]').forEach(b=>{
      b.onclick = ()=>{ masterTab = b.dataset.otab; render(); };
    });
    if(ce){
      main.querySelector('#save_opening').onclick=async()=>{
        const openingCash = Number(main.querySelector('#op_cash').value)||0;
        try{
          state.settings = await api('PATCH','/api/settings', {...state.settings, openingCash});
          render();
          showToast('Opening balance saved');
        }catch(e){ await showAlert(e.message); }
      };
      enableEnterNav(main.querySelector('#op_cash').closest('section'), '#save_opening');
      if(osub==='material') wireMaterialSection(main);
      if(osub==='supplier') wireSupplierSection(main);
      if(osub==='buyer') wireBuyerSection(main);
    }
  }
  if(ce && tab==='preferences'){
    const savePreferences = async (toastMsg)=>{
      const chequeReminderDays = Number(main.querySelector('#c_rem').value)||0;
      const creditReminderDays = Number(main.querySelector('#cr_rem').value)||0;
      const setupMode = main.querySelector('#setup_mode').checked;
      const themeColor = main.querySelector('#theme_color').value;
      const fontSize = main.querySelector('#font_size').value;
      try{
        await api('PATCH','/api/settings', {...state.settings, chequeReminderDays, creditReminderDays, setupMode, themeColor, fontSize});
        // turning Historical Data Entry Mode off doesn't just change
        // settings — the server also unstages every historical sale/purchase
        // and recomputes stock/profit for them (unstageHistoricalEntries).
        // A plain render() here would keep showing the stale, pre-activation
        // state.sales/purchases/stock already sitting in memory — a full
        // refreshState() is what actually re-fetches them.
        await refreshState();
        showToast(toastMsg);
      }catch(e){ await showAlert(e.message); }
    };
    main.querySelector('#save_preferences').onclick = ()=> savePreferences('Preferences saved');
    // this toggle is meant to stay on across sessions while backlog data is
    // entered — save it the moment it's clicked instead of requiring a
    // separate Save click, so switching tabs (or away and back) before
    // remembering to hit Save doesn't silently discard it.
    main.querySelector('#setup_mode').onchange = ()=> savePreferences('Historical Data Entry Mode ' + (main.querySelector('#setup_mode').checked ? 'enabled' : 'disabled'));
    enableEnterNav(main.querySelector('#c_rem').closest('section'), '#save_preferences');
  }
  if(ce && tab==='banks'){
    const bform = main.querySelector('#b_name').closest('section');
    main.querySelector('#b_add').onclick = async()=>{
      const name = main.querySelector('#b_name').value.trim();
      const balance = Number(main.querySelector('#b_balance').value)||0;
      const locker = main.querySelector('#b_locker').checked;
      if(!name){ await showAlert('Enter a bank/account name'); return; }
      try{
        if(editingBank){
          await api('PATCH','/api/banks/'+editingBank.id, {name, openingBalance:balance, locker});
          editingBankId = null;
        } else {
          await api('POST','/api/banks', {name, openingBalance:balance, locker});
        }
        await refreshState();
        showToast(editingBank ? 'Bank account updated' : 'Bank account added');
      }catch(e){ await showAlert(e.message); }
    };
    if(editingBank){
      main.querySelector('#b_cancel').onclick = ()=>{ editingBankId = null; render(); };
    }
    main.querySelectorAll('[data-editbank]').forEach(b=>{
      b.onclick = ()=>{ editingBankId = b.dataset.editbank; render(); };
    });
    main.querySelectorAll('[data-delbank]').forEach(b=>{
      b.onclick = async()=>{
        if(!await showConfirm('Remove this bank account? This cannot be undone.')) return;
        try{
          await api('DELETE','/api/banks/'+b.dataset.delbank);
          if(editingBankId===b.dataset.delbank) editingBankId = null;
          await refreshState();
          showToast('Bank account removed');
        }catch(e){ await showAlert(e.message); }
      };
    });
    enableEnterNav(bform, '#b_add');
  }
  if(!ro && tab==='clients'){
    const clform = main.querySelector('#cl_name').closest('section');
    main.querySelector('#cl_add').onclick = async()=>{
      const name = main.querySelector('#cl_name').value.trim();
      if(!name){ await showAlert('Enter a client name'); return; }
      try{
        if(editingClient){
          const themeColor = main.querySelector('#cl_theme').value;
          const fontSize = main.querySelector('#cl_fontsize').value;
          await api('PATCH','/api/clients/'+editingClient.id, {name, themeColor, fontSize});
          editingClientId = null;
        } else {
          await api('POST','/api/clients', {name});
        }
        await refreshClients();
        await loadState(); // client list/theme on the header switcher may have changed
        showToast(editingClient ? 'Client updated' : 'Client added');
      }catch(e){ await showAlert(e.message); }
    };
    if(editingClient){
      main.querySelector('#cl_cancel').onclick = ()=>{ editingClientId = null; render(); };
    }
    main.querySelectorAll('[data-editclient]').forEach(b=>{
      b.onclick = ()=>{ editingClientId = b.dataset.editclient; render(); };
    });
    main.querySelectorAll('[data-toggleclient]').forEach(b=>{
      b.onclick = async()=>{
        try{
          await api('PATCH','/api/clients/'+b.dataset.toggleclient, {status: b.dataset.newstatus});
          await refreshClients();
          await loadState();
          showToast(b.dataset.newstatus==='active' ? 'Client activated' : 'Client deactivated');
        }catch(e){ await showAlert(e.message); }
      };
    });
    enableEnterNav(clform, '#cl_add');
  }
  if(!ro && tab==='users'){
    const uform = main.querySelector('#u_name').closest('section');
    const roleSelect = main.querySelector('#u_role');
    const toggleClientFields = ()=>{
      const show = roleSelect.value === 'standard';
      main.querySelector('#u_client_wrap').style.display = show ? '' : 'none';
      main.querySelector('#u_access_wrap').style.display = show ? '' : 'none';
    };
    toggleClientFields();
    roleSelect.onchange = toggleClientFields;
    main.querySelector('#u_add').onclick = async ()=>{
      const username = main.querySelector('#u_name').value.trim();
      const password = main.querySelector('#u_pass').value;
      const role = roleSelect.value;
      const clientId = main.querySelector('#u_client').value;
      const accessLevel = main.querySelector('#u_access').value;
      if(!username){ await showAlert('Enter a username'); return; }
      if(!editingUser && !password){ await showAlert('Enter a password'); return; }
      if(role==='standard' && !clientId){ await showAlert('Select a client for this standard user'); return; }
      try {
        const body = { username, password: password||undefined, role, clientId: role==='standard'?clientId:undefined, accessLevel: role==='standard'?accessLevel:undefined };
        if(!editingUser) body.password = password;
        const res = editingUser
          ? await fetch('/api/users/'+encodeURIComponent(editingUser.id), { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
          : await fetch('/api/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const data = await res.json().catch(()=>({}));
        if(!res.ok){ await showAlert(data.error || 'Could not save user'); return; }
        editingUserId = null;
        await loadState(); // in case we changed our own username/role, refresh the session too
        await refreshUsers();
        showToast(editingUser ? 'User updated' : 'User added');
      } catch(e){ await showAlert('Network error. Please try again.'); }
    };
    if(editingUser){
      main.querySelector('#u_cancel').onclick = ()=>{ editingUserId = null; render(); };
    }
    main.querySelectorAll('[data-edituser]').forEach(b=>{
      b.onclick = ()=>{ editingUserId = b.dataset.edituser; render(); };
    });
    main.querySelectorAll('[data-deluser]').forEach(b=>{
      b.onclick = async ()=>{
        try {
          const res = await fetch('/api/users/'+encodeURIComponent(b.dataset.deluser), { method:'DELETE' });
          const data = await res.json().catch(()=>({}));
          if(!res.ok){ await showAlert(data.error || 'Could not remove user'); return; }
          await refreshUsers();
          showToast('User removed');
        } catch(e){ await showAlert('Network error. Please try again.'); }
      };
    });
    enableEnterNav(uform, '#u_add');
  }
  if(!ro && tab==='backup'){
    main.querySelector('#bk_run').onclick = async()=>{
      const btn = main.querySelector('#bk_run');
      btn.disabled = true; btn.textContent = 'Running...';
      try{
        await api('POST','/api/backup/run');
        await refreshBackups();
        showToast('Backup completed');
      }catch(e){ await showAlert(e.message); }
      finally{ btn.disabled = false; btn.textContent = 'Run Backup Now'; }
    };
    main.querySelector('#bk_source').onclick = async()=>{
      const btn = main.querySelector('#bk_source');
      btn.disabled = true; btn.textContent = 'Backing up...';
      try{
        const r = await api('POST','/api/backup/source');
        showToast(r.committed ? 'Source code backed up to GitHub' : 'Already up to date — nothing changed since the last backup');
      }catch(e){ await showAlert(e.message); }
      finally{ btn.disabled = false; btn.textContent = 'Backup Source Code to GitHub'; }
    };
    if(backupSettings){
      main.querySelector('#bs_freq').onchange = ()=>{
        const freq = main.querySelector('#bs_freq').value;
        const wrap = main.querySelector('#bs_time_wrap');
        const timeInput = main.querySelector('#bs_time');
        if(freq==='hourly'){
          wrap.querySelector('label').textContent = 'Minute Past the Hour';
          if(timeInput.type!=='number'){
            const minute = (timeInput.value||'02:00').split(':')[1] || '0';
            const ni = document.createElement('input'); ni.type='number'; ni.id='bs_time'; ni.min=0; ni.max=59; ni.value=minute;
            timeInput.replaceWith(ni);
          }
        } else {
          wrap.querySelector('label').textContent = 'Time of Day';
          if(timeInput.type!=='time'){
            const ni = document.createElement('input'); ni.type='time'; ni.id='bs_time'; ni.value='02:'+String(timeInput.value||0).padStart(2,'0');
            timeInput.replaceWith(ni);
          }
        }
      };
      main.querySelector('#bs_save').onclick = async()=>{
        try{
          const freq = main.querySelector('#bs_freq').value;
          const timeInput = main.querySelector('#bs_time');
          const timeOfDay = freq==='hourly' ? ('00:'+String(Number(timeInput.value)||0).padStart(2,'0')) : timeInput.value;
          backupSettings = await api('PATCH','/api/backup/settings', {
            scheduleEnabled: main.querySelector('#bs_enabled').checked,
            frequency: freq,
            timeOfDay,
            timezone: main.querySelector('#bs_tz').value.trim(),
            retentionCount: Number(main.querySelector('#bs_retain').value)||14,
            location: main.querySelector('#bs_location').value.trim()
          });
          render();
          showToast('Backup schedule saved');
        }catch(e){ await showAlert(e.message); }
      };
    }
    main.querySelector('#rs_go').onclick = async()=>{
      const file = main.querySelector('#rs_file').files[0];
      const confirmText = main.querySelector('#rs_confirm').value.trim();
      if(!file){ await showAlert('Choose a backup file to restore'); return; }
      if(confirmText !== 'RESTORE'){ await showAlert('Type RESTORE (exactly) to confirm this overwrites all current data'); return; }
      if(!await showConfirm('This will OVERWRITE all current data with the uploaded backup. A safety backup is taken first, but this cannot otherwise be undone. Continue?')) return;
      const btn = main.querySelector('#rs_go');
      btn.disabled = true; btn.textContent = 'Restoring...';
      try{
        const res = await fetch('/api/backup/restore?confirm=RESTORE', { method:'POST', headers:{'Content-Type':'application/octet-stream'}, body: file });
        const data = await res.json().catch(()=>({}));
        if(!res.ok){ await showAlert(data.error || 'Restore failed'); return; }
        if(data.warnings) await showAlert('Restore completed with warnings:\n'+data.warnings);
        else await showAlert('Restore complete.');
        await refreshBackups();
        await loadState();
      }catch(e){ await showAlert('Network error during restore. Please try again.'); }
      finally{ btn.disabled = false; btn.textContent = 'Restore'; }
    };
  }
}

loadState();
// pick up the remembered save-folder name (display only, no permission
// request) so the "Saving to..." note is accurate from the first render,
// not just after this session's first save.
(async()=>{
  if(!fsApiSupported()) return;
  try{
    const h = await fsGetSavedDir();
    if(h){ fsSavedDirName = h.name; render(); }
  }catch(e){}
})();
</script>
