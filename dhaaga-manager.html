// A loan taken via "Cover Shortfall From" is recorded on the purchase/
// expense/payout/supplier-payment/transfer that actually needed the money
// (fundingLoanIds), not the other way around — this is the reverse lookup,
// answering "which payment was this loan actually for?" A loan added
// directly via "Add New Personal Loan" (not through a shortfall-cover
// flow) has no such link and returns null.
function personalLoanFundedTransaction(loanId){
  const accName = (id)=> (allAccounts().find(a=>a.id===id)||{}).name || id;
  const p = state.purchases.find(x=>(x.fundingLoanIds||[]).includes(loanId));
  if(p) return `Purchase — ${p.supplier}, ${p.item}, ${fmtQtyPlain(p.qty)} ${p.unit} (${fmtDate(p.date)})`;
  const e = state.expenses.find(x=>(x.fundingLoanIds||[]).includes(loanId));
  if(e) return `Expense — ${e.desc} (${fmtDate(e.date)})`;
  const sp = state.supplierPayments.find(x=>(x.fundingLoanIds||[]).includes(loanId));
  if(sp) return `Supplier Payment — ${sp.supplier} (${fmtDate(sp.date)})`;
  const po = state.payouts.find(x=>(x.fundingLoanIds||[]).includes(loanId));
  if(po){
    const name = po.recipientType==='investor' ? (state.investors.find(i=>i.id===po.recipientId)||{}).name
      : po.recipientType==='loan' ? (state.personalLoans.find(l=>l.id===po.recipientId)||{}).lender
      : (state.partners.find(x=>x.id===po.recipientId)||{}).name;
    const label = po.recipientType==='investor' ? 'Investor Payout' : po.recipientType==='loan' ? 'Personal Loan Repayment' : 'Commission Agent Payout';
    return `${label} — ${name||'—'} (${fmtDate(po.date)})`;
  }
  const tr = state.transfers.find(x=>(x.fundingLoanIds||[]).includes(loanId));
  if(tr) return `Transfer — ${accName(tr.fromAccount)} → ${accName(tr.toAccount)} (${fmtDate(tr.date)})`;
  return null;
}
// ---------- shared "insufficient funds" safeguard, used by every cash-
// outflow form (Purchases, Expenses, Supplier/Investor/Commission-Agent
// payments): shows every account's available balance, offers a "Cover
// Shortfall From" choice (another account, or a tracked Personal Loan) when
// the chosen account can't cover it, and blocks going negative outright if
// nothing was chosen. ----------
function fundingBalancesNoteHtml(getAvailable){
  return 'Available — ' + allAccounts().map(a=>{
    const bank = state.banks.find(b=>b.id===a.id);
    return `${a.name}${bank&&bank.locker?' (Locker, frozen)':''}: Rs ${fmtPlain(getAvailable(a.id))}`;
  }).join(' &nbsp;|&nbsp; ');
}
// Lockers are frozen by design (see the Locker feature) — their funds move
// only through a deliberate Bank Transfer, never auto-tapped to cover a
// shortfall here, so they're excluded from these candidates entirely. Every
// other real account is listed regardless of whether it alone covers the
// full shortfall — the balance shown next to each makes that obvious, and
// the actual sufficiency check happens once the amounts are known below.
// A blank first option, always selected by default, so the browser never
// silently pre-picks a real account for you — you must actively choose one
// (or Personal Loan) before the shortfall can be covered.
// currentValue re-selects whatever was already chosen — this list gets
// rebuilt on every recompute (including the one triggered by this very
// select's own 'change' event), and without re-marking the right <option>
// as selected, that rebuild would silently snap the value back to blank
// right after picking one, making the field look like it "stopped working".
function fundingCoverOptionsHtml(excludeIds, getAvailable, shortfall, currentValue){
  const candidates = allAccounts().filter(a=>{
    if(excludeIds.includes(a.id)) return false;
    const bank = state.banks.find(b=>b.id===a.id);
    if(bank && bank.locker) return false;
    return true;
  });
  const opts = candidates.map(a=>{
    const bal = getAvailable(a.id);
    return `<option value="${a.id}" ${a.id===currentValue?'selected':''}>${a.name} (Rs ${fmtPlain(bal)} available${bal<shortfall?' — not enough alone':''})</option>`;
  }).join('');
  return `<option value="" ${!currentValue?'selected':''}>— choose an account —</option>` + opts + `<option value="__loan__" ${currentValue==='__loan__'?'selected':''}>Personal Loan (enter lender name)</option>`;
}
// Wires a 2-round "Cover Shortfall From" chain — a shortfall bigger than any
// single account needs two (occasionally three, counting the primary)
// accounts combined, so picking one account reveals a second "Cover
// Remaining Shortfall From" round for whatever's still short afterward.
// Personal Loan can close the gap at either round. `prefix` is this form's
// field-id prefix (e.g. 'p' for Purchases); the caller must render
// #${prefix}_balances_note, #${prefix}_cover_wrap/_cover_account,
// #${prefix}_cover_wrap1/_cover_account1 and #${prefix}_lender_wrap.
// getExtraExclude (optional) supplies further ids that must never appear as
// a cover source — used by the Transfer form so covering a shortfall in the
// "From" account can never draw from the very "To" account it's sending
// money toward.
function wireShortfallCover(main, prefix, getAccount, getTotal, getAvailable, getExtraExclude){
  function recompute(){
    const account = getAccount();
    const total = getTotal();
    const extra = getExtraExclude ? getExtraExclude() : [];
    const balNote = main.querySelector(`#${prefix}_balances_note`);
    if(balNote) balNote.innerHTML = fundingBalancesNoteHtml(getAvailable);
    const w0 = main.querySelector(`#${prefix}_cover_wrap`);
    const w1 = main.querySelector(`#${prefix}_cover_wrap1`);
    const lenderWrap = main.querySelector(`#${prefix}_lender_wrap`);
    if(!total || total<=getAvailable(account)){ w0.style.display='none'; w1.style.display='none'; lenderWrap.style.display='none'; return; }
    let remaining = total - getAvailable(account);
    const sel0 = main.querySelector(`#${prefix}_cover_account`);
    const prevVal0 = sel0.value;
    sel0.innerHTML = fundingCoverOptionsHtml([account, ...extra], getAvailable, remaining, prevVal0);
    w0.querySelector('label').textContent = `Cover Shortfall From (${(allAccounts().find(a=>a.id===account)||{}).name||account} is short by Rs ${fmtPlain(remaining)})`;
    w0.style.display = 'block';
    const val0 = sel0.value;
    if(!val0 || val0==='__loan__'){
      w1.style.display = 'none';
      lenderWrap.style.display = val0==='__loan__' ? 'block' : 'none';
      return;
    }
    remaining -= getAvailable(val0);
    if(remaining<=0.009){ w1.style.display='none'; lenderWrap.style.display='none'; return; }
    const sel1 = main.querySelector(`#${prefix}_cover_account1`);
    const prevVal1 = sel1.value;
    sel1.innerHTML = fundingCoverOptionsHtml([account, val0, ...extra], getAvailable, remaining, prevVal1);
    w1.querySelector('label').textContent = `Cover Remaining Shortfall From (still short by Rs ${fmtPlain(remaining)})`;
    w1.style.display = 'block';
    lenderWrap.style.display = sel1.value==='__loan__' ? 'block' : 'none';
  }
  main.querySelector(`#${prefix}_cover_account`).addEventListener('change', recompute);
  main.querySelector(`#${prefix}_cover_account1`).addEventListener('change', recompute);
  recompute();
  return recompute;
}
// Two phases on purpose: PLAN everything first (pure — no API calls), and
// only once the whole plan is confirmed valid does EXECUTE actually create
// any transfer/loan. Earlier this ran transfer-then-validate-next-round in
// one pass, so a round that failed validation (nothing chosen, or a stale
// double-click re-running the same check) still left the earlier rounds'
// transfers already committed — a "blocked" purchase quietly leaving real
// money moved behind it. Now a blocked attempt commits nothing at all.
// Returns {transferIds, loanIds} (both possibly empty) on success — the ids
// of whatever got auto-created to cover the shortfall, so the caller can
// pass them along as fundingTransferIds/fundingLoanIds when it creates the
// entity those funds were actually for. QA Round 17: without this link,
// deleting that entity later left the auto-transfer/loan behind as an
// orphan. Returns null on cancel/failure — always falsy, same as the old
// boolean false, so existing `if(!result) return;` call sites still work.
async function resolveShortfallMulti({date, account, total, getAvailable, prefix, main}){
  const available = getAvailable(account);
  if(total <= available) return {transferIds:[], loanIds:[]};
  let remaining = total - available;
  const accName = (allAccounts().find(a=>a.id===account)||{}).name || account;
  const rounds = [
    {wrap: main.querySelector(`#${prefix}_cover_wrap`), sel: main.querySelector(`#${prefix}_cover_account`)},
    {wrap: main.querySelector(`#${prefix}_cover_wrap1`), sel: main.querySelector(`#${prefix}_cover_account1`)}
  ];
  const plan = []; // {kind:'transfer', from, amount} | {kind:'loan', amount}
  let loanTriggered = false;
  for(const r of rounds){
    if(remaining<=0.009) break;
    if(!r.wrap || r.wrap.style.display==='none') break;
    const val = r.sel.value;
    if(!val){
      await showAlert(`${accName} is short by Rs ${fmtPlain(remaining)}. Choose an account — or Personal Loan — under "Cover Shortfall From" to cover the difference.`);
      return null;
    }
    if(val==='__loan__'){ loanTriggered = true; break; }
    const bank = state.banks.find(b=>b.id===val);
    if(bank && bank.locker){
      await showAlert('Locker accounts are frozen and cannot auto-cover a shortfall — move funds out manually first via Financial Entry → Bank Transfer.');
      return null;
    }
    const take = Math.min(getAvailable(val), remaining);
    if(take>0.009){ plan.push({kind:'transfer', from:val, amount:take}); remaining -= take; }
  }
  let lenderName = '';
  if(remaining>0.009){
    if(!loanTriggered){
      await showAlert(`${accName} is still short by Rs ${fmtPlain(remaining)} even after the selected account(s). Choose Personal Loan to cover the rest, or pick a larger account.`);
      return null;
    }
    lenderName = main.querySelector(`#${prefix}_lender_name`).value;
    if(!lenderName || !lenderName.trim()){ await showAlert("Enter the lender's name for this personal loan."); return null; }
    plan.push({kind:'loan', amount:remaining, lender:lenderName.trim()});
  }
  // plan is fully valid — now, and only now, actually move any money.
  const transferIds = [], loanIds = [];
  for(const step of plan){
    if(step.kind==='transfer'){
      const coverName = (allAccounts().find(a=>a.id===step.from)||{}).name || step.from;
      try{ const row = await api('POST','/api/transfers', {date, fromAccount:step.from, toAccount:account, amount:step.amount, note:'Auto-transfer to cover a shortfall'}); transferIds.push(row.id); }
      catch(e){ await showAlert(`Could not transfer Rs ${fmtPlain(step.amount)} from ${coverName}: ${e.message}`); return null; }
    } else {
      try{ const row = await api('POST','/api/personal-loans', {date, lender:step.lender, amount:step.amount, account, note:`Covered a shortfall in ${accName}`}); loanIds.push(row.id); }
      catch(e){ await showAlert('Could not record the personal loan: '+e.message); return null; }
    }
  }
  return {transferIds, loanIds};
}
// Same cover-shortfall UI/logic as the full forms, packaged as a one-off
// modal for actions that don't have a persistent form of their own — Mark
// Paid (a credit purchase) and Mark Cleared (an issued cheque). Resolves
// true once funds are actually secured and the caller may proceed, false if
// cancelled — callers should not perform their action on a false result.
function resolveShortfallModal({date, account, total, getAvailable}){
  return new Promise((resolve)=>{
    const root = document.getElementById('modalRoot');
    const accName = (allAccounts().find(a=>a.id===account)||{}).name || account;
    root.innerHTML = `<div class="modal-overlay"><div class="modal-box">
      <p>${escapeHtml(accName)} doesn't have enough for this — Rs ${fmt(total)} needed. Choose how to cover the difference.</p>
      <div class="form-grid">
        <div id="sfm_cover_wrap" style="display:none;"><label>Cover Shortfall From</label><select id="sfm_cover_account" class="select-required"></select></div>
        <div id="sfm_cover_wrap1" style="display:none;"><label>Cover Remaining Shortfall From</label><select id="sfm_cover_account1" class="select-required"></select></div>
        <div id="sfm_lender_wrap" style="display:none;"><label>Lender Name</label><input id="sfm_lender_name" placeholder="e.g. X-Y-Z"></div>
      </div>
      <div class="settings-note" id="sfm_balances_note" style="margin-bottom:12px;"></div>
      <div class="modal-actions"><button class="btn danger" id="sfm_cancel">Cancel</button><button class="btn gold" id="sfm_confirm">Confirm</button></div>
    </div></div>`;
    const close = (v)=>{ root.innerHTML=''; resolve(v); };
    root.querySelector('#sfm_cancel').onclick = ()=>close(false);
    root.querySelector('.modal-overlay').onclick = (e)=>{ if(e.target.classList.contains('modal-overlay')) close(false); };
    wireShortfallCover(root, 'sfm', ()=>account, ()=>total, getAvailable);
    enableEnterNav(root, '#sfm_confirm');
    root.querySelector('#sfm_confirm').onclick = async ()=>{
      const ok = await resolveShortfallMulti({ date, account, total, getAvailable, prefix:'sfm', main: root });
      if(ok) close(true);
    };
  });
}
// Shared entry point: if the account already has enough, resolves true
// immediately with no UI. Otherwise opens resolveShortfallModal and waits
// for the user to actually secure the difference (or cancel).
async function ensureFundsAvailable({date, account, total, getAvailable}){
  if(total <= getAvailable(account)) return true;
  return await resolveShortfallModal({date, account, total, getAvailable});
}
function cashInHand(){ return accountBalance('cash'); }
// lockers (frozen holding accounts, e.g. cash kept in a safe deposit box)
// are excluded here and from the Dashboard — they only count once their
// funds are transferred into a real account like Cash in Hand.
function totalFunds(){ return accountBalance('cash') + state.banks.filter(b=>!b.locker).reduce((a,b)=> a + accountBalance(b.id), 0); }

// ---------- other derived numbers ----------
// must match the Stock page's own per-row Value column (qty × avgCost) —
// using the last purchase rate() here instead of avgCost was why the
// Dashboard/Reports "Stock Value" tile drifted away from the Stock page's
// own row-sum as soon as an item had more than one purchase rate.
function stockValue(){ return state.stock.reduce((a,s)=> a + Number(s.qty)*Number(s.avgCost), 0); }
function totalInvestment(){ return state.investors.reduce((a,i)=> a + Number(i.amount), 0); }
// ---------- party ledger (credit sales + receipts, FIFO allocated) ----------
function partyNames(){
  const names = new Set();
  state.sales.forEach(s=>{ if(s.party) names.add(s.party); });
  state.parties.forEach(p=>{ if(p.name) names.add(p.name); });
  return Array.from(names).filter(Boolean).sort();
}
function partyOpeningBalance(party){
  const p = state.parties.find(x=>x.name===party);
  return p ? Number(p.openingBalance)||0 : 0;
}
function supplierNames(){
  const names = new Set();
  state.purchases.forEach(p=>{ if(p.supplier) names.add(p.supplier); });
  state.suppliers.forEach(s=>{ if(s.name) names.add(s.name); });
  return Array.from(names).filter(Boolean).sort();
}
function partyReceiptsTotal(party){
  return state.receipts.filter(r=>r.party===party).reduce((a,r)=>a+Number(r.amount),0);
}
// a return (either settlement) always means less was actually kept, so it
// shrinks THIS specific sale's own effective total — never a generic
// addition to the receipts pool, which would let it get FIFO-applied
// against some OTHER, unrelated sale for the same party. A refund-settled
// return additionally moves cash (see accountBalance); a credit-settled
// return needs nothing further, since the smaller total already reduces
// what's owed on its own.
function saleReturnsTotal(saleId){
  return state.salesReturns.filter(r=>r.saleId===saleId).reduce((a,r)=>a+Number(r.total),0);
}
function purchaseReturnsTotal(purchaseId){
  return state.purchaseReturns.filter(r=>r.purchaseId===purchaseId).reduce((a,r)=>a+Number(r.total),0);
}
// a completed Supplier Advance always settles its own linked purchase
// first — same per-record principle as a return, never pooled, so the
// money can never land against some other, unrelated purchase.
function pendingPurchaseAdvancesTotal(){
  return state.purchaseAdvances.filter(a=>a.status==='open').reduce((a,v)=>a+Number(v.amount),0);
}
function purchaseAdvanceAppliedFor(purchaseId){
  const adv = state.purchaseAdvances.find(a=>a.status==='completed' && a.purchaseId===purchaseId);
  return adv ? Number(adv.amount) : 0;
}
// Historical Data Entry Mode only defers Stock/Cash/Bank/Profit — the party
// ledger, recoverable/payable totals and their due-date reminders are meant
// to work immediately for a staged entry too (that's the whole point of
// giving it its own date), so these deliberately do NOT filter out staged
// rows, unlike accountBalance/recomputeStockItem/totalProfitAllSales etc.
function partyCreditSalesTotal(party){
  return state.sales.filter(s=>s.party===party && s.type==='credit')
    .reduce((a,s)=>a+Math.max(0, Number(s.total)-saleReturnsTotal(s.id)),0);
}
// opening balance is what this party already owed before using this app —
// same principle as a bank account's opening_balance being the base that
// later transactions build on top of.
function partyPendingTotal(party){
  return Math.max(0, partyOpeningBalance(party) + partyCreditSalesTotal(party) - partyReceiptsTotal(party));
}
// the mirror case: receipts beyond what's actually owed. Previously this
// just vanished into partyPendingTotal's Math.max(0, ...) clamp — recorded
// (with a warning) but with no trace of the overage anywhere. It already
// correctly applies against this party's next credit sale on its own
// (partyLedgerRows pools the party's full receipts total and allocates it
// oldest-sale-first every time it runs) — this just makes that advance
// visible instead of silently disappearing.
function partyAdvanceBalance(party){
  return Math.max(0, partyReceiptsTotal(party) - partyOpeningBalance(party) - partyCreditSalesTotal(party));
}
// ---------- supplier ledger (credit purchases + supplier payments, FIFO
// allocated) — the payable-side mirror of the party ledger above. A purchase
// marked "paid" via the single-invoice Mark Paid button on the Purchases tab
// is treated as fully settled outside the pool (it never draws from
// supplierPayments), same as a cash sale never draws from receipts.
function supplierOpeningBalance(supplier){
  const s = state.suppliers.find(x=>x.name===supplier);
  return s ? Number(s.openingBalance)||0 : 0;
}
function supplierPaymentsTotal(supplier){
  return state.supplierPayments.filter(p=>p.supplier===supplier).reduce((a,p)=>a+Number(p.amount),0);
}
function supplierCreditPurchasesTotal(supplier){
  return state.purchases.filter(p=>p.supplier===supplier && p.type==='credit' && !p.paid)
    .reduce((a,p)=>a+Math.max(0, Number(p.total)-purchaseReturnsTotal(p.id)-purchaseAdvanceAppliedFor(p.id)),0);
}
function supplierPendingTotal(supplier){
  return Math.max(0, supplierOpeningBalance(supplier) + supplierCreditPurchasesTotal(supplier) - supplierPaymentsTotal(supplier));
}
// mirror of partyAdvanceBalance — payments beyond what's actually payable,
// shown instead of silently vanishing. Already applies automatically
// against this supplier's next credit purchase on its own.
function supplierAdvanceBalance(supplier){
  return Math.max(0, supplierPaymentsTotal(supplier) - supplierOpeningBalance(supplier) - supplierCreditPurchasesTotal(supplier));
}
function supplierLedgerRows(supplier){
  const purchases = state.purchases.filter(p=>p.supplier===supplier).slice().sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0));
  let pool = supplierPaymentsTotal(supplier);
  return purchases.map(p=>{
    // cash/already-marked-paid purchases never draw from the pool, so a
    // return against one only matters if it's refund-settled (handled by
    // accountBalance) — a 'credit' settlement is blocked server-side for
    // exactly this case, since shrinking its total here would have no effect.
    if(p.type==='cash' || p.paid){ return {purchase:p, paid:Number(p.total), status:'clear', effectiveTotal:Number(p.total)}; }
    const total = Math.max(0, Number(p.total) - purchaseReturnsTotal(p.id) - purchaseAdvanceAppliedFor(p.id));
    const applied = Math.min(pool, total);
    pool -= applied;
    const status = total<=0.009 ? 'clear' : (applied<=0 ? 'pending' : (applied<total ? 'partial' : 'clear'));
    return {purchase:p, paid:applied, status, effectiveTotal:total};
  });
}
function creditPurchaseStatus(purchase){
  if(purchase.type!=='credit' || purchase.paid) return 'clear';
  const row = supplierLedgerRows(purchase.supplier).find(r=>r.purchase.id===purchase.id);
  return row ? row.status : 'pending';
}
function creditPurchaseOutstanding(purchase){
  if(purchase.type!=='credit' || purchase.paid) return 0;
  const row = supplierLedgerRows(purchase.supplier).find(r=>r.purchase.id===purchase.id);
  return row ? row.effectiveTotal - row.paid : Math.max(0, Number(purchase.total)-purchaseReturnsTotal(purchase.id)-purchaseAdvanceAppliedFor(purchase.id));
}
function payableDueTotal(){
  return supplierNames().reduce((a,s)=>a + supplierPendingTotal(s), 0);
}
// oldest-first: apply this party's total receipts against their credit sales
// in date order, so each sale ends up "clear" / "partial" / "pending"
function partyLedgerRows(party){
  const sales = state.sales.filter(s=>s.party===party).slice().sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0));
  let pool = partyReceiptsTotal(party);
  return sales.map(s=>{
    // a cash sale never draws from the pool, so a return against one only
    // matters if it's refund-settled (handled by accountBalance) — a
    // 'credit' settlement is blocked server-side for exactly this case.
    if(s.type==='cash'){ return {sale:s, received:Number(s.total), status:'clear', effectiveTotal:Number(s.total)}; }
    const total = Math.max(0, Number(s.total) - saleReturnsTotal(s.id));
    const applied = Math.min(pool, total);
    pool -= applied;
    const status = total<=0.009 ? 'clear' : (applied<=0 ? 'pending' : (applied<total ? 'partial' : 'clear'));
    return {sale:s, received:applied, status, effectiveTotal:total};
  });
}
// one party's full history as a single chronological statement — every
// bill (sale) and every receipt interleaved in date order with a running
// balance, so it reads as a narrative: "billed X, received Y (partial),
// received Z more (cleared), billed W (pending)...". Reuses
// partyLedgerRows' own FIFO status per bill so the status column here
// always agrees with the Party Ledger. Includes Historical/staged entries
// (same as the Party Ledger) since this is about the party's real
// standing, not a live Cash/Profit figure.
function partyCombinedStatement(party){
  const statusBySaleId = new Map(partyLedgerRows(party).map(r=>[r.sale.id, r.status]));
  const bills = state.sales.filter(s=>s.party===party).map(s=>({
    date: s.date, type:'bill', amount: Number(s.total),
    desc: `${s.item} — ${fmtQtyPlain(s.qty)} ${s.unit||'kg'} @ Rs ${fmtPlain(s.rate)}`,
    staged: !!s.staged, status: statusBySaleId.get(s.id) || (s.type==='cash'?'clear':'pending')
  }));
  const receipts = state.receipts.filter(r=>r.party===party).map(r=>({
    date: r.date, type:'receipt', amount: Number(r.amount),
    desc: `Received into ${(allAccounts().find(a=>a.id===(r.account||'cash'))||{}).name||'Cash'}${r.note?' — '+r.note:''}`,
    staged: !!r.staged, status: null
  }));
  const rows = [...bills, ...receipts].sort((a,b)=>{
    if(a.date<b.date) return -1;
    if(a.date>b.date) return 1;
    return a.type===b.type ? 0 : (a.type==='bill' ? -1 : 1); // same day: bill is billed before it's paid
  });
  let balance = partyOpeningBalance(party);
  return rows.map(r=>{
    balance += r.type==='bill' ? r.amount : -r.amount;
    return {...r, balance};
  });
}
function creditSaleStatus(sale){
  if(sale.type!=='credit') return 'clear';
  const row = partyLedgerRows(sale.party).find(r=>r.sale.id===sale.id);
  return row ? row.status : 'pending';
}
function creditSaleOutstanding(sale){
  if(sale.type!=='credit') return 0;
  const row = partyLedgerRows(sale.party).find(r=>r.sale.id===sale.id);
  return row ? row.effectiveTotal - row.received : Math.max(0, Number(sale.total)-saleReturnsTotal(sale.id));
}
function creditDueTotal(){
  return partyNames().reduce((a,p)=>a + partyPendingTotal(p), 0);
}
function chequesPendingTotal(direction){ return state.cheques.filter(c=>c.status==='pending' && (!direction || c.direction===direction)).reduce((a,c)=>a+Number(c.amount),0); }
function daysLabel(n){ return `${n} ${n===1?'day':'days'}`; }
// a stable, distinct color per party/supplier/lender name, used as a
// left-edge stripe on each Reminders row so rows read as grouped-by-party
// at a glance without disturbing the existing overdue/upcoming row
// background. Same name always gets the same color (simple string hash
// into a fixed palette) — not random per render.
// no red here on purpose — an overdue reminder row already has a red
// background/border, so a red party-stripe would camouflage into it
// instead of standing out (this is exactly what happened for a party whose
// name hashed to red against Bismillah Traders' real data).
const PARTY_COLORS = ['#2563EB','#D97706','#059669','#475569','#7C3AED','#DB2777','#0891B2','#65A30D'];
function partyColor(name){
  let hash = 0;
  for(let i=0;i<String(name).length;i++){ hash = (hash*31 + String(name).charCodeAt(i)) | 0; }
  return PARTY_COLORS[Math.abs(hash) % PARTY_COLORS.length];
}
function reminderAlerts(){
  const alerts = [];
  state.cheques.filter(c=>c.status==='pending').forEach(c=>{
    const d = daysUntil(c.dueDate);
    if(d <= state.settings.chequeReminderDays){
      const label = c.direction==='issued' ? 'Cheque to Pay' : 'Cheque to Collect';
      alerts.push({overdue:d<0, party:c.party, text:`${label} — ${c.party}${c.bank?` (${c.bank})`:''}: Rs ${fmt(c.amount)}, due ${fmtDate(c.dueDate)} ${d<0?`(${daysLabel(Math.abs(d))} overdue)`:`(${daysLabel(d)} left)`}`});
    }
  });
  state.sales.filter(s=>s.type==='credit' && s.dueDate).forEach(s=>{
    const outstanding = creditSaleOutstanding(s);
    if(outstanding<=0) return;
    const d = daysUntil(s.dueDate);
    if(d <= state.settings.creditReminderDays){
      alerts.push({overdue:d<0, party:s.party, text:`Recovery — ${s.party}: Rs ${fmt(outstanding)}, due ${fmtDate(s.dueDate)} ${d<0?`(${daysLabel(Math.abs(d))} overdue)`:`(${daysLabel(d)} left)`}`});
    }
  });
  // opening-balance receivables/payables (money already owed before this app
  // was used) get their own optional Due Date on the Buyer/Supplier record —
  // same reminder treatment as a credit sale's recovery date, reported
  // against the opening-balance amount specifically (not the party's full
  // pending total, which may also include separately-reminded credit sales).
  state.parties.filter(p=>p.dueDate && Number(p.openingBalance)>0 && partyPendingTotal(p.name)>0).forEach(p=>{
    const d = daysUntil(p.dueDate);
    if(d <= state.settings.creditReminderDays){
      alerts.push({overdue:d<0, party:p.name, text:`Recovery (Opening Balance) — ${p.name}: Rs ${fmt(p.openingBalance)}, due ${fmtDate(p.dueDate)} ${d<0?`(${daysLabel(Math.abs(d))} overdue)`:`(${daysLabel(d)} left)`}`});
    }
  });
  state.suppliers.filter(s=>s.dueDate && Number(s.openingBalance)>0 && supplierPendingTotal(s.name)>0).forEach(s=>{
    const d = daysUntil(s.dueDate);
    if(d <= state.settings.creditReminderDays){
      alerts.push({overdue:d<0, party:s.name, text:`Payable (Opening Balance) — ${s.name}: Rs ${fmt(s.openingBalance)}, due ${fmtDate(s.dueDate)} ${d<0?`(${daysLabel(Math.abs(d))} overdue)`:`(${daysLabel(d)} left)`}`});
    }
  });
  // personal loans have no due date — they're meant to be cleared as soon as
  // possible, so every outstanding one stays flagged (as overdue) until paid.
  state.personalLoans.forEach(l=>{
    const outstanding = personalLoanOutstanding(l);
    if(outstanding<=0) return;
    alerts.push({overdue:true, party:l.lender, text:`Personal Loan — repay ${l.lender}: Rs ${fmt(outstanding)} outstanding, borrowed ${fmtDate(l.date)}`});
  });
  return alerts.sort((a,b)=> (a.overdue===b.overdue)?0:(a.overdue?-1:1));
}
// Dashboard's per-party Recovery summary boxes, next to the Reminders list —
// same two data sources as reminderAlerts()'s "Recovery" entries (credit
// sales + opening-balance recovery), just grouped by party and bucketed
// into a fixed 3-day "due soon" window vs overdue, instead of a flat list
// gated by the (separately configurable) reminder-days setting.
function partyRecoverySummary(){
  const byParty = {};
  const add = (name, amount, days) => {
    if(amount<=0) return;
    if(!byParty[name]) byParty[name] = {name, overdue:0, dueSoon:0};
    if(days < 0) byParty[name].overdue += amount;
    else if(days <= 3) byParty[name].dueSoon += amount;
  };
  state.sales.filter(s=>s.type==='credit' && s.dueDate).forEach(s=>{
    const outstanding = creditSaleOutstanding(s);
    if(outstanding<=0) return;
    add(s.party, outstanding, daysUntil(s.dueDate));
  });
  state.parties.filter(p=>p.dueDate && Number(p.openingBalance)>0 && partyPendingTotal(p.name)>0).forEach(p=>{
    add(p.name, Number(p.openingBalance), daysUntil(p.dueDate));
  });
  return Object.values(byParty)
    .filter(v=>v.overdue>0 || v.dueSoon>0)
    .sort((a,b)=> b.overdue - a.overdue || b.dueSoon - a.dueSoon);
}
// Stock qty/avgCost is always fully rebuilt from the current purchases + sales
// arrays (never patched incrementally) — this keeps average cost mathematically
// correct (a plain weighted average is order-independent) no matter how many
// times an old purchase/sale gets edited or deleted later.
function recomputeStock(){
  const map = new Map();
  const key = (name,unit)=> name+'␀'+(unit||'kg');
  state.purchases.forEach(p=>{
    const k = key(p.item, p.unit);
    if(!map.has(k)) map.set(k, {name:p.item, unit:p.unit||'kg', purchQty:0, purchValue:0, saleQty:0, lastRate:0, lastDate:''});
    const m = map.get(k);
    m.purchQty += Number(p.qty);
    m.purchValue += Number(p.qty)*Number(p.rate);
    if(!m.lastDate || p.date >= m.lastDate){ m.lastDate = p.date; m.lastRate = Number(p.rate); }
  });
  state.sales.forEach(s=>{
    const k = key(s.item, s.unit);
    if(!map.has(k)) map.set(k, {name:s.item, unit:s.unit||'kg', purchQty:0, purchValue:0, saleQty:0, lastRate:0, lastDate:''});
    map.get(k).saleQty += Number(s.qty);
  });
  const existingIds = new Map(state.stock.map(s=>[key(s.name, s.unit), s.id]));
  state.stock = Array.from(map.values()).map(m=>({
    id: existingIds.get(key(m.name, m.unit)) || uid(),
    name: m.name,
    unit: m.unit,
    qty: m.purchQty - m.saleQty,
    avgCost: m.purchQty>0 ? m.purchValue/m.purchQty : 0,
    rate: m.lastRate
  }));
}
function currentAvgCost(name, unit){
  const item = state.stock.find(s=>s.name===name && s.unit===(unit||'kg'));
  return item ? Number(item.avgCost)||0 : 0;
}
// ---------- partner profit-sharing ----------
function saleNetProfitForInvestors(s){
  if(s.profit===undefined) return 0;
  const pct = Number(s.partnerPercent)||0;
  return s.profit - (s.profit * pct/100);
}
function periodMatches(dateStr, period){
  if(!dateStr) return false;
  if(period==='all') return true;
  if(period==='day') return dateStr===todayStr();
  if(period==='week'){
    const d = new Date(dateStr); const now = new Date(todayStr());
    const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-now.getDay());
    return d >= startOfWeek && d <= now;
  }
  if(period==='month'){ return dateStr.slice(0,7)===todayStr().slice(0,7); }
  return true;
}
function investorProfitShare(investor, period){
  period = period || 'all';
  const totalInv = totalInvestment();
  const share = totalInv ? (Number(investor.amount)||0) / totalInv : 0; // profit is split by each investor's % of total investment
  let total = 0;
  state.sales.forEach(s=>{
    if(s.staged || s.profit===undefined) return;
    if(!periodMatches(s.date, period)) return;
    total += saleNetProfitForInvestors(s) * share;
  });
  return total;
}
function investorExpenseShare(investor, period){
  period = period || 'all';
  const totalInv = totalInvestment();
  const share = totalInv ? (Number(investor.amount)||0) / totalInv : 0; // expenses are split the same way as profit — by % of total investment
  let total = 0;
  state.expenses.forEach(e=>{
    if(!periodMatches(e.date, period)) return;
    total += Number(e.amount) * share;
  });
  return total;
}
// one investor's row exactly as the Investors List table itself computes
// it (same columns, same formulas) — used by the Save & Send Investor
// Summary feature so the saved/downloaded record matches what's on screen.
function investorSummaryRow(investor, period, totalInv){
  const paidOut = payoutsTotal('investor', investor.id);
  const netProfit = investorProfitShare(investor, period) - investorExpenseShare(investor, period);
  const netOwed = Number(investor.amount) + investorProfitShare(investor,'all') - investorExpenseShare(investor,'all') - paidOut;
  return {
    name: investor.name,
    investment: Number(investor.amount),
    pctOfTotal: totalInv ? (Number(investor.amount)/totalInv)*100 : 0,
    depositedInto: investor.staged ? 'Historical' : ((allAccounts().find(a=>a.id===(investor.account||'cash'))||{}).name||'Cash'),
    expenseShare: investorExpenseShare(investor, period),
    netProfit,
    paidOut,
    netOwed
  };
}
// a saved summary's rows for display — the real per-investor breakdown if
// this record was saved after "rows" existed, otherwise a single-row
// fallback built from the older flat total columns.
function investorSummaryDisplayRows(r){
  if(r.rows && r.rows.length) return r.rows;
  return [{
    name: r.investorName, investment: Number(r.investment), pctOfTotal: null, depositedInto: '—',
    expenseShare: Number(r.expenseShare), netProfit: Number(r.profitShare)-Number(r.expenseShare), paidOut: Number(r.paidOut), netOwed: Number(r.netOwed)
  }];
}
function investorSummaryRowsTotal(rows){
  return rows.reduce((a,x)=>({
    investment: a.investment+Number(x.investment),
    expenseShare: a.expenseShare+Number(x.expenseShare),
    netProfit: a.netProfit+Number(x.netProfit),
    paidOut: a.paidOut+Number(x.paidOut),
    netOwed: a.netOwed+Number(x.netOwed)
  }), {investment:0, expenseShare:0, netProfit:0, paidOut:0, netOwed:0});
}
function partnerTotalEarnings(partner){
  let total = Number(partner.openingProfit)||0;
  state.sales.forEach(s=>{
    if(s.staged || s.profit===undefined || s.partnerId!==partner.id) return;
    // a loss-making sale (negative profit) must never create a negative
    // commission — the agent's cut only ever applies to an actual profit.
    total += Math.max(0, s.profit) * ((Number(s.partnerPercent)||0)/100);
  });
  return total;
}
// combined, date-ordered ledger for one commission agent: each qualifying
// sale's commission (added) and each payout to this agent (deducted),
// running from the agent's opening commission — the payout side draws down
// the running balance the same day it's recorded, same principle as the
// party/supplier ledgers above.
function partnerLedgerRows(partner){
  const rows = [];
  state.sales.forEach(s=>{
    if(s.staged || s.profit===undefined || s.partnerId!==partner.id) return;
    const commission = Math.max(0, s.profit) * ((Number(s.partnerPercent)||0)/100);
    rows.push({date:s.date, kind:'commission', party:s.party, item:s.item, sale:s, amount:commission});
  });
  state.payouts.forEach(p=>{
    if(p.recipientType!=='partner' || p.recipientId!==partner.id) return;
    rows.push({date:p.date, kind:'payout', amount:-Number(p.amount), payout:p});
  });
  rows.sort((a,b)=>{
    if(a.date<b.date) return -1;
    if(a.date>b.date) return 1;
    if(a.kind===b.kind) return 0;
    return a.kind==='payout' ? 1 : -1;
  });
  let running = Number(partner.openingProfit)||0;
  return rows.map(r=>{ running += r.amount; return {...r, balance:running}; });
}
// what the business currently owes across all commission agents — includes
// each agent's Opening Commission (entered once, before using this app) plus
// commission earned since, minus what's already been paid out.
function commissionAgentsOwedTotal(){
  return state.partners.reduce((a,p)=> a + (partnerTotalEarnings(p) - payoutsTotal('partner', p.id)), 0);
}
function totalProfitAllSales(){ return state.sales.reduce((a,s)=> a + (s.staged ? 0 : (s.profit||0)), 0); }
// the FULL commission expense incurred so far (earned, whether or not it's
// been paid out yet) — kept for Commission Agents Owed / Payable Due cards
// and the Partners page; no longer part of the Trade Summary formula (see
// tradeSummaryProfit below) since it mixes a historical carry-over balance
// with commission from current sales.
function totalCommissionEarnedAll(){ return state.partners.reduce((a,p)=>a+partnerTotalEarnings(p),0); }
// previously accrued payable — each agent's Opening Commission, a one-time
// historical balance entered when the agent was set up in this app. Stays
// tracked in the backend (Partners page, Owed totals) but is informational
// only in the Trade Summary — not a cost of current trading activity.
function totalCommissionOpeningAll(){ return state.partners.reduce((a,p)=>a+(Number(p.openingProfit)||0),0); }
// commission earned from actual sales recorded in this app (excludes the
// opening/historical balance above) — shown for reference in Trade Summary.
function totalCommissionNewAll(){ return totalCommissionEarnedAll() - totalCommissionOpeningAll(); }
// Total Profit = Total Sales − Total Purchases − Broker Commission (current,
// from actual sales) − Expenses. The historical accrued payable
// (totalCommissionOpeningAll) is excluded — it's a carry-over balance, not
// a cost of current trading — but current commission and expenses are real
// deductions. Historical (staged) entries stay excluded, same as every
// other Stock/Cash/Profit figure in the app.
function totalSalesValueAll(){ return state.sales.reduce((a,s)=> a + (s.staged?0:Number(s.total)), 0); }
function totalPurchasesValueAll(){ return state.purchases.reduce((a,p)=> a + (p.staged?0:Number(p.total)), 0); }
function tradeSummaryProfit(){ return totalSalesValueAll() - totalPurchasesValueAll() - totalCommissionNewAll() - totalExpensesAll(); }
// ---------- Books Balance Check ----------
// Computes the business's net worth two independent ways and compares them.
// Method A: today's snapshot (what's actually in Cash/Bank/Stock, and what's
// owed each way, right now). Method B: capital + earnings (what the day-one
// opening position plus everything recorded in the app since then implies
// net worth should be). If nothing is leaking or double-counted, A and B
// must be exactly equal — any gap is the Rs amount of an unexplained entry.
//
// Both methods must agree on what counts as "live" vs "pre-app history":
// a staged (Historical Data Entry Mode) sale/purchase/investor contributes
// nothing to current Cash/Bank/Profit by design, so it must also contribute
// nothing here — BUT a staged receipt/payment reduces the receivable/payable
// it's recorded against regardless of staging (same as it does everywhere
// else in the app), so it must be excluded from the live pending/advance
// math too, or Method A silently loses value that Method B never knew to
// subtract. (This is not a hypothetical: it's exactly the gap a real
// staged receipt produced when this was first verified against live data.)
function booksCheckPartyReceiptsLive(party){
  return state.receipts.filter(r=>r.party===party && !r.staged).reduce((a,r)=>a+Number(r.amount),0);
}
function booksCheckSupplierPaymentsLive(supplier){
  return state.supplierPayments.filter(p=>p.supplier===supplier && !p.staged).reduce((a,p)=>a+Number(p.amount),0);
}
function booksCheckPartyCreditSalesLive(party){
  return state.sales.filter(s=>s.party===party && s.type==='credit' && !s.staged)
    .reduce((a,s)=>a+Math.max(0, Number(s.total)-saleReturnsTotal(s.id)),0);
}
function booksCheckSupplierCreditPurchasesLive(supplier){
  return state.purchases.filter(p=>p.supplier===supplier && p.type==='credit' && !p.paid && !p.staged)
    .reduce((a,p)=>a+Math.max(0, Number(p.total)-purchaseReturnsTotal(p.id)-purchaseAdvanceAppliedFor(p.id)),0);
}
function booksBalanceCheck(){
  // lockers are purely informational (where the cash is physically sitting)
  // until it's actually moved into Cash in Hand or a real bank account —
  // same treatment totalFunds() already gives them on the Dashboard, so
  // this matches that figure instead of silently differing from it.
  const cashAndBanks = totalFunds();
  const stock = stockValue();
  const receivable = partyNames().reduce((a,p)=>{
    const pending = Math.max(0, partyOpeningBalance(p) + booksCheckPartyCreditSalesLive(p) - booksCheckPartyReceiptsLive(p));
    return a + pending;
  }, 0);
  const buyerAdvances = partyNames().reduce((a,p)=>{
    const adv = Math.max(0, booksCheckPartyReceiptsLive(p) - partyOpeningBalance(p) - booksCheckPartyCreditSalesLive(p));
    return a + adv;
  }, 0);
  const payable = supplierNames().reduce((a,s)=>{
    const pending = Math.max(0, supplierOpeningBalance(s) + booksCheckSupplierCreditPurchasesLive(s) - booksCheckSupplierPaymentsLive(s));
    return a + pending;
  }, 0);
  const supplierAdvances = supplierNames().reduce((a,s)=>{
    const adv = Math.max(0, booksCheckSupplierPaymentsLive(s) - supplierOpeningBalance(s) - booksCheckSupplierCreditPurchasesLive(s));
    return a + adv;
  }, 0);
  const commissionOwed = commissionAgentsOwedTotal();
  const loansOutstanding = totalPersonalLoansOutstanding();
  const methodA = cashAndBanks + stock + receivable + supplierAdvances - payable - commissionOwed - loansOutstanding - buyerAdvances;

  const openingCash = Number(state.settings.openingCash)||0;
  const openingBanks = state.banks.filter(b=>!b.locker).reduce((a,b)=>a+(Number(b.openingBalance)||0),0);
  const openingStock = state.stock.reduce((a,s)=>a+(Number(s.openingQty)||0)*(Number(s.openingRate)||0),0);
  const openingReceivable = state.parties.reduce((a,p)=>a+(Number(p.openingBalance)||0),0);
  const openingPayable = state.suppliers.reduce((a,s)=>a+(Number(s.openingBalance)||0),0);
  const openingCommission = totalCommissionOpeningAll();
  const openingNetWorth = openingCash + openingBanks + openingStock + openingReceivable - openingPayable - openingCommission;

  // Per the owner's explicit decision: a Historical investor's capital is
  // real, counted money — "staged" here only ever meant "don't double it
  // into Cash/Bank", not "don't count it toward net worth". Every investor
  // counts now, regardless of staged.
  const investmentLive = state.investors.reduce((a,i)=>a+Number(i.amount),0);
  const profit = totalProfitAllSales();
  const expenses = totalExpensesAll();
  const commissionNew = totalCommissionNewAll();
  const investorPayouts = state.payouts.filter(p=>p.recipientType==='investor').reduce((a,p)=>a+Number(p.amount),0);
  const methodB = openingNetWorth + investmentLive + profit - expenses - commissionNew - investorPayouts;
  // informational only, not part of either method: money currently sitting
  // in a Locker account. A transfer that moves cash OUT of Cash/Bank INTO a
  // Locker (or vice versa) is invisible to Method B (transfers are equity-
  // neutral) but DOES change Method A once Lockers are excluded from it —
  // so a real, expected gap can appear here whenever locker money has moved.
  // Surfacing the current locker total lets that be read directly instead
  // of looking like an unexplained leak.
  const lockerTotal = state.banks.filter(b=>b.locker).reduce((a,b)=>a+accountBalance(b.id),0);

  return {
    methodA, methodB, difference: methodA - methodB, lockerTotal,
    a: { cashAndBanks, stock, receivable, supplierAdvances, payable, commissionOwed, loansOutstanding, buyerAdvances },
    b: { openingNetWorth, investmentLive, profit, expenses, commissionNew, investorPayouts }
  };
}
// Net worth's trajectory since day one, month by month — unrolls the exact
// same components Books Balance Check's Method B sums into one final
// number (see above), spread across time instead, so the last point always
// ties out to today's live total. Answers "is it growing, and by how much
// relative to what was invested" rather than "do the books balance".
// Investors have no date field in this schema, so their capital can't be
// placed on the timeline — it's folded into the starting point instead,
// same treatment Method B already gives it.
function netWorthTimeline(){
  const bbc = booksBalanceCheck();
  const buckets = {}; // ym -> {profit, commission, expenses, investorPayouts, investment}
  const touch = (dateStr, field, amount) => {
    if(!dateStr) return false;
    const ym = dateStr.slice(0,7);
    if(!buckets[ym]) buckets[ym] = {profit:0, commission:0, expenses:0, investorPayouts:0, investment:0};
    buckets[ym][field] += amount;
    return true;
  };
  state.sales.forEach(s=>{
    if(s.staged || s.profit===undefined) return;
    touch(s.date, 'profit', Number(s.profit)||0);
    if(s.partnerId){
      touch(s.date, 'commission', Math.max(0, Number(s.profit)||0) * ((Number(s.partnerPercent)||0)/100));
    }
  });
  state.expenses.forEach(e=> touch(e.date, 'expenses', Number(e.amount)));
  state.payouts.filter(p=>p.recipientType==='investor').forEach(p=> touch(p.date, 'investorPayouts', Number(p.amount)));
  // an investor WITH a recorded date is placed on the timeline at that
  // date; one with no date on record (never set) still folds into the
  // starting point below, since there's nowhere else to put it.
  let undatedInvestment = 0;
  state.investors.forEach(i=>{
    const placed = touch(i.date, 'investment', Number(i.amount));
    if(!placed) undatedInvestment += Number(i.amount);
  });

  const months = Object.keys(buckets).sort();
  const thisYm = todayStr().slice(0,7);
  if(!months.length || months[months.length-1] < thisYm) months.push(thisYm);
  const startingValue = bbc.b.openingNetWorth + undatedInvestment;
  const points = [{ym:'Start', value:startingValue, delta:0, profit:0, commission:0, expenses:0, investorPayouts:0, investment:0}];
  let running = startingValue;
  months.forEach(ym=>{
    const b = buckets[ym] || {profit:0, commission:0, expenses:0, investorPayouts:0, investment:0};
    const delta = b.profit - b.commission - b.expenses - b.investorPayouts + b.investment;
    running += delta;
    points.push({ym, value:running, delta, ...b});
  });
  return {points, investment: bbc.b.investmentLive, startingValue};
}
// month only (same window as the Reports tab's "This Month" cards), 'all'
// = the same all-time totals shown on the Dashboard. commissionOpening (the
// historical accrued payable) is kept only for backend storage — it is
// never displayed and never subtracted here.
function tradeSummaryPeriodFigures(period){
  if(period==='month'){
    const ym = todayStr().slice(0,7);
    const monthSales = state.sales.filter(s=>!s.staged && s.date && s.date.startsWith(ym));
    const monthPurch = state.purchases.filter(p=>!p.staged && p.date && p.date.startsWith(ym));
    const sales = monthSales.reduce((a,s)=>a+Number(s.total),0);
    const purchases = monthPurch.reduce((a,p)=>a+Number(p.total),0);
    const expenses = state.expenses.filter(e=>e.date && e.date.startsWith(ym)).reduce((a,e)=>a+Number(e.amount),0);
    const commissionNew = monthSales.reduce((a,s)=> a + (s.profit!==undefined && s.partnerId ? Math.max(0, Number(s.profit))*((Number(s.partnerPercent)||0)/100) : 0), 0);
    return { sales, purchases, expenses, profit: sales-purchases-commissionNew-expenses, commissionNew, commissionOpening: totalCommissionOpeningAll(), periodLabel: ym };
  }
  return { sales: totalSalesValueAll(), purchases: totalPurchasesValueAll(), expenses: totalExpensesAll(), profit: tradeSummaryProfit(), commissionNew: totalCommissionNewAll(), commissionOpening: totalCommissionOpeningAll(), periodLabel: 'All Time' };
}

// generic "download any canvas as JPG" — shared by Trade Summary and
// Investor Summary saves. Where the browser supports it (the File System
// Access API — Chrome/Edge/other Chromium browsers; not Firefox/Safari),
// the FIRST save of a report prompts a real "Save As" folder picker, and
// the chosen folder is remembered (in IndexedDB) so every later save goes
// straight there with no prompt. Unsupported browsers, a denied/revoked
// permission, or a cancelled picker all fall back to a normal browser
// download (the previous behavior) rather than blocking the save.
const FS_HANDLE_DB = 'dhaaga-fs-handles', FS_HANDLE_STORE = 'handles', FS_HANDLE_KEY = 'summary-reports';
function fsHandleDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(FS_HANDLE_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FS_HANDLE_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function fsGetSavedDir(){
  try{
    const db = await fsHandleDb();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_HANDLE_STORE,'readonly');
      const req = tx.objectStore(FS_HANDLE_STORE).get(FS_HANDLE_KEY);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function fsSetSavedDir(handle){
  try{
    const db = await fsHandleDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_HANDLE_STORE,'readwrite');
      tx.objectStore(FS_HANDLE_STORE).put(handle, FS_HANDLE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){}
}
async function fsClearSavedDir(){
  try{
    const db = await fsHandleDb();
    const tx = db.transaction(FS_HANDLE_STORE,'readwrite');
    tx.objectStore(FS_HANDLE_STORE).delete(FS_HANDLE_KEY);
  }catch(e){}
}
function fsApiSupported(){ return typeof window.showDirectoryPicker === 'function'; }
// resolves a usable directory handle: the remembered one (if permission is
// still granted or can be silently re-granted), otherwise prompts a fresh
// folder picker and remembers the choice. Returns null if unsupported,
// cancelled, or denied — callers fall back to a plain download in that case.
//
// IMPORTANT: call this IMMEDIATELY inside a click handler, before any
// `await` of a network call (API request, refreshState, etc). Chrome only
// treats showDirectoryPicker()/requestPermission() as "triggered by the
// user" for a very short window right after the click (transient
// activation) — once that window passes (even one awaited fetch is enough
// to burn through it), both calls silently fail. That was the actual bug
// reported 2026-10-01: the folder was remembered correctly, but re-checking
// permission on it happened too late (after a POST + refreshState had
// already run), so requestPermission() threw and — because that throw was
// caught by the SAME try/catch that also wraps the showDirectoryPicker()
// fallback below it — the function bailed out entirely instead of falling
// through to re-prompt, so every save after the first silently dropped to
// the browser's default Downloads folder with no visible error.
async function fsResolveSaveDir(forcePrompt){
  if(!fsApiSupported()) return null;
  if(!forcePrompt){
    try{
      const existing = await fsGetSavedDir();
      if(existing){
        let perm = await existing.queryPermission({mode:'readwrite'});
        if(perm!=='granted') perm = await existing.requestPermission({mode:'readwrite'});
        if(perm==='granted'){ fsSavedDirName = existing.name; return existing; }
        console.warn('Dhaaga: saved folder permission not granted (' + perm + '), re-prompting');
      }
    }catch(e){ console.warn('Dhaaga: could not reuse saved folder, re-prompting', e); }
  }
  try{
    const picked = await window.showDirectoryPicker({mode:'readwrite'});
    await fsSetSavedDir(picked);
    fsSavedDirName = picked.name;
    return picked;
  }catch(e){
    console.warn('Dhaaga: folder picker unavailable or cancelled, falling back to default downloads', e);
    return null;
  }
}
// HH-mm-ss-mmm — appended to the filename itself (not a folder) so repeat
// saves on the same day never collide and overwrite each other, while
// everything still lands directly in the one chosen folder.
function fsTimeSuffix(){
  const d = new Date();
  const pad = (n,len)=>String(n).padStart(len||2,'0');
  return `${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}-${pad(d.getMilliseconds(),3)}`;
}
async function downloadCanvasAsJpg(canvas, filename, dir){
  const blob = await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));
  if(!blob) return;
  if(dir===undefined) dir = await fsResolveSaveDir(false);
  if(dir){
    try{
      const fileHandle = await dir.getFileHandle(filename, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(e){ console.warn('Dhaaga: writing to saved folder failed, falling back to default downloads', e); }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

    if(a.action!==action) return false;
    if(action==='edit' && !(a.before && a.after)) return false;
    if(action==='delete' && !a.entry) return false;
    if(auditFrom && a.actionDate < auditFrom) return false;
    if(auditTo && a.actionDate > auditTo) return false;
    if(auditParty){
      const needle = auditParty.trim().toLowerCase();
      if(action==='edit'){
        const b = auditDisplay(a.kind, a.before), af = auditDisplay(a.kind, a.after);
        if(!(b.who||'').toLowerCase().includes(needle) && !(af.who||'').toLowerCase().includes(needle)) return false;
      } else {
        const e = auditDisplay(a.kind, a.entry);
        if(!(e.who||'').toLowerCase().includes(needle)) return false;
      }
    }
    return true;
  }).slice().reverse();
  return hasFilter ? rows : rows.slice(0, 10);
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}"><span class="tab-icon">${t.icon}</span><span>${t.label}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ activeTab = b.dataset.tab; render(); };
  });
}
function updateHeader(){
  const title = document.getElementById('companyTitle');
  const sub = document.getElementById('companySub');
  title.textContent = state.settings.companyName || 'Yarn Trading Manager';
  sub.textContent = '';
  const bottom = document.getElementById('sidebarBottom');
  const topbar = document.getElementById('topbar');
  if(session){
    const roleLabel = session.role==='admin' ? 'Admin' : 'Standard';
    const activeClient = clientList.find(c=>c.id===session.activeClientId);
    const initials = session.username.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

    // Settings + Logout pinned at the bottom of the sidebar, below the
    // scrollable nav list — client switching now lives up in the topbar
    // next to the profile, alongside who's signed in.
    bottom.innerHTML = `
      <button class="settings-btn ${activeTab==='settings'?'active':''}" id="settingsTabBtn"><span class="tab-icon">⚙️</span><span>Settings</span></button>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    `;

      activeTab = 'settings'; render();
      if(isAdmin()){ refreshUsers(); refreshClients(); refreshBackups(); }
    };
    bottom.querySelector('#logoutBtn').onclick = logout;

    // Client is never picked while working — it comes from the user's own
    // assignment (standard users) or whichever client is active in Settings
    // (admin). Just show which one it is, under the name — no dropdown here.
    topbar.innerHTML = `
      <button class="profile-trigger ${activeTab==='profile'?'active':''}" id="profileTrigger">
        <div class="profile-info">
          <div class="profile-name">${session.username}</div>
          <div class="profile-meta">${roleLabel}${activeClient?' · '+activeClient.name:''}</div>
        </div>
        <div class="profile-avatar">${initials}</div>
      </button>
    `;
    topbar.querySelector('#profileTrigger').onclick = ()=>{ activeTab = 'profile'; render(); };
  } else {
    bottom.innerHTML = '';
    topbar.innerHTML = '';
  }
}

let lastRenderedTab = null; // tracks tab CHANGES specifically, so scroll only resets when you actually navigate — not on every re-render triggered by a form edit, save, etc. within the same tab
function render(){
  if(!loaded || !session) return;
  applyTheme();
  renderTabs();
  updateHeader();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const fn = { profile:renderProfile, dashboard:renderDashboard, master:renderMaster, sales:renderSales, purchases:renderPurchases,
    ledger:renderLedger, stock:renderStock, cheques:renderCheques, investors:renderInvestors, partners:renderPartners,
    loans:renderPersonalLoans, expenses:renderExpenses, reports:renderReports, settings:renderSettings }[activeTab];
  fn(main);
  if(lastRenderedTab !== activeTab){ window.scrollTo(0,0); lastRenderedTab = activeTab; }
}

          ${ro?'':`<td class="row-actions"><button class="btn danger" data-editbuyer="${p.id}">Edit</button><button class="btn danger" data-delbuyer="${p.id}">Remove</button></td>`}</tr>`).join('') || `<tr><td colspan="${ro?3:4}" class="empty">No buyers yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>`;
}
function wireBuyerSection(main){
  const editingParty = editingPartyId ? state.parties.find(x=>x.id===editingPartyId) : null;
  main.querySelector('#by_add').onclick = async()=>{
    const name = main.querySelector('#by_name').value.trim();
    const openingBalance = Number(main.querySelector('#by_balance').value)||0;
    const dueDate = main.querySelector('#by_due').value || null;
    if(!name){ await showAlert('Enter a buyer name'); return; }
    try{
      if(editingParty){
        await api('PATCH','/api/parties/'+editingParty.id, {name, openingBalance, dueDate});
        editingPartyId = null;
      } else {
        await api('POST','/api/parties', {name, openingBalance, dueDate});
      }
      await refreshState();
      showToast(editingParty ? 'Buyer updated' : 'Buyer added');
    }catch(e){ await showAlert(e.message); }
  };
  if(editingParty){
    main.querySelector('#by_cancel').onclick = ()=>{ editingPartyId = null; render(); };
  }
  main.querySelectorAll('[data-editbuyer]').forEach(b=>{
    b.onclick = ()=>{ editingPartyId = b.dataset.editbuyer; render(); };
  });
  main.querySelectorAll('[data-delbuyer]').forEach(b=>{
    b.onclick = async()=>{
      if(!await showConfirm('Remove this buyer\'s opening balance record? This cannot be undone (their sales/receipts history is not affected).')) return;
      try{
        await api('DELETE','/api/parties/'+b.dataset.delbuyer);
        if(editingPartyId===b.dataset.delbuyer) editingPartyId = null;
        await refreshState();
        showToast('Buyer removed');
      }catch(e){ await showAlert(e.message); }
    };
  });
  enableEnterNav(main.querySelector('#by_name').closest('section'), '#by_add');
}
function renderMaster(main){
  const ro = !canEditActiveClient();
  const MASTER_TABS = [
    {id:'material', label:'Material'},
    {id:'supplier', label:'Supplier'},
    {id:'buyer', label:'Buyer'}
  ];
  const tab = MASTER_TABS.find(t=>t.id===masterTab) ? masterTab : 'material';
  main.innerHTML = `
    <div class="subtabs">${MASTER_TABS.map(t=>`<button data-mtab="${t.id}" class="${tab===t.id?'active':''}">${t.label}</button>`).join('')}</div>
    ${tab==='material' ? materialSectionHtml(ro) : ''}
    ${tab==='supplier' ? supplierSectionHtml(ro) : ''}
    ${tab==='buyer' ? buyerSectionHtml(ro) : ''}
  `;
  main.querySelectorAll('[data-mtab]').forEach(b=>{
    b.onclick = ()=>{ masterTab = b.dataset.mtab; render(); };
  });
  if(ro) return;
  if(tab==='material') wireMaterialSection(main);
  if(tab==='supplier') wireSupplierSection(main);
  if(tab==='buyer') wireBuyerSection(main);
}

// ---------- SALES ----------
function renderSales(main){
  const ro = !canEditActiveClient();
  const editing = editingSaleId ? state.sales.find(x=>x.id===editingSaleId) : null;
  main.innerHTML = `
    ${ro? '' : `
    <section class="block">

        ${state.partners.length ? `
        <div><label>Commission Agent</label><select id="s_partner"><option value="">— none —</option>${state.partners.map(p=>`<option value="${p.id}" ${editing&&editing.partnerId===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>
        <div><label>Agent's Commission % of this sale's profit</label><input type="number" id="s_partner_pct" placeholder="e.g. 10" value="${editing&&editing.partnerPercent?editing.partnerPercent:''}"></div>` : ''}
        <div id="s_days_wrap" style="display:${editing&&editing.type==='credit'?'block':'none'};"><label>Credit Days</label><input type="number" id="s_days" placeholder="e.g. 45" value="${editing&&editing.creditDays?editing.creditDays:''}"></div>
        <div id="s_due_wrap" style="display:${editing&&editing.type==='credit'?'block':'none'};"><label>Expected Recovery Date</label><input type="date" id="s_due" value="${editing&&editing.dueDate?editing.dueDate:''}"></div>
      </div>
      <button class="btn gold" id="s_add">${editing?'Save Changes':'Add Sale'}</button>
      ${editing?'<button class="btn danger" id="s_cancel" style="margin-left:8px;">Cancel Edit</button>':''}
    </section>`}
    <section class="block">
      <h2>Sales List</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Party</th><th>Variety</th><th>Qty</th><th>Rate</th><th>Total</th><th>Batch</th><th>Profit</th><th>Agent %</th><th>Status</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.sales.slice().reverse().map(s=>{
            const st = s.staged ? 'staged' : (s.type==='cash' ? 'cash' : creditSaleStatus(s));
            const statusHtml = st==='staged' ? '<span class="pill role" title="Entered during Historical Data Entry Mode — permanently excluded from Stock/Cash/Bank/Profit, counts only toward the Party Ledger and reminders">Historical</span>'
              : st==='cash' ? '<span class="pill cash">Cash</span>'
              : st==='clear' ? '<span class="pill ok">Recovered</span>'
              : st==='partial' ? '<span class="pill partial">Partially Received</span>'
              : '<span class="pill credit">Credit Due</span>';
            const batchLabel = s.staged ? '—'
              : s.sourcePurchaseId==='opening' ? 'Opening Stock'
              : s.sourcePurchaseId ? (()=>{ const p = state.purchases.find(x=>x.id===s.sourcePurchaseId); return p ? `${fmtDate(p.date)} (${p.supplier})` : '(removed)'; })()
              : '—';
            return `
            <tr>
              <td>${fmtDate(s.date)}</td><td>${s.party}</td><td>${s.item}</td><td>${fmtQty(s.qty)} ${s.unit||'kg'}</td><td>${fmtQty(s.rate)}</td><td>Rs ${fmt(s.total)}</td><td>${batchLabel}</td><td>Rs ${fmt(s.profit||0)}</td><td>${s.partnerId ? (Number(s.partnerPercent)||0)+'%' : '—'}</td>
              <td>${statusHtml}</td>
              ${ro?'':`<td class="row-actions">
                <button class="btn danger" data-sedit="${s.id}">Edit</button>
                <button class="btn danger" data-sdelete="${s.id}">Delete</button></td>`}
            </tr>`;}).join('') || `<tr><td colspan="11" class="empty">No sales entered yet</td></tr>`}
        </tbody>
      </table>
      </div>
      <div class="save-note">To record a payment received against a credit sale (full or partial), go to the <b>Party Ledger</b> tab.</div>
    </section>
    ${(()=>{
      const returnableList = state.sales.filter(s=>!s.staged && saleReturnableQty(s.id)>0.001);
      return `
    ${ro? '' : `
    <section class="block">
      <h2>Sales Return</h2>
      <div class="save-note" style="margin-bottom:12px;">Goods a buyer sends back — adds back to Stock either way. Choose Refund if you hand money back from Cash/Bank, or Credit if it just reduces what they still owe you.</div>
      ${returnableList.length ? `
      <div class="form-grid">
        <div><label>Sale</label><select id="sr_sale">${returnableList.map(s=>`<option value="${s.id}">${fmtDate(s.date)} — ${s.party}, ${s.item} (${fmtQtyPlain(saleReturnableQty(s.id))} ${s.unit} returnable)</option>`).join('')}</select></div>
        <div><label>Date</label><input type="date" id="sr_date" value="${todayStr()}"></div>
        <div><label>Quantity Returned</label><input type="number" id="sr_qty" placeholder="e.g. 5"></div>
        <div><label>Settlement</label><select id="sr_settlement"><option value="refund">Refund (Cash/Bank)</option><option value="credit">Credit (reduce receivable)</option></select></div>
        <div id="sr_acc_wrap"><label>Refund From</label><select id="sr_account">${accountOptionsHtml('cash')}</select></div>
        <div><label>Note (optional)</label><input id="sr_note"></div>
      </div>
      <div class="settings-note" id="sr_hint" style="margin-bottom:12px;"></div>
      <button class="btn gold" id="sr_add">Record Return</button>
      ` : `<div class="empty">No sales are currently eligible for a return (everything is either Historical, or already fully returned).</div>`}
    </section>`}
    <section class="block">
      <h2>Sales Returns List</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Date</th><th>Sale</th><th>Qty</th><th>Rate</th><th>Total</th><th>Settlement</th><th>Account</th><th>Note</th>${ro?'':'<th></th>'}</tr></thead>
        <tbody>
          ${state.salesReturns.slice().reverse().map(r=>{
            const s = state.sales.find(x=>x.id===r.saleId);
            return `<tr><td>${fmtDate(r.date)}</td><td>${s?`${s.party} — ${s.item}`:'(sale removed)'}</td><td>${fmtQty(r.qty)} ${s?s.unit:''}</td><td>${fmtQty(r.rate)}</td><td>Rs ${fmt(r.total)}</td>
              <td>${r.settlement==='refund'?'<span class="pill cash">Refund</span>':'<span class="pill credit">Credit</span>'}</td>
              <td>${r.settlement==='refund'?((allAccounts().find(a=>a.id===r.account)||{}).name||'Cash'):'—'}</td><td>${r.note||'—'}</td>
              ${ro?'':`<td class="row-actions"><button class="btn danger" data-srdelete="${r.id}">Delete</button></td></tr>`}`;
          }).join('') || `<tr><td colspan="9" class="empty">No sales returns recorded yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </section>`;
    })()}
  `;
  if(ro) return;
  const form = main.querySelector('.form-grid').closest('section');
  attachCombo(main.querySelector('#s_party'), partyNames, form);
  attachCombo(main.querySelector('#s_item'), inStockVarieties, form);
  const s_qty = main.querySelector('#s_qty');
  s_qty.classList.add('no-skip-empty');
  const s_unit = main.querySelector('#s_unit');
  // Only the ITEM NAME changing should ever decide/lock the Unit field — the
  // Unit field's own change must never feed back into this, or picking a
  // unit re-triggers the same "auto-set" logic and silently snaps the
  // selection back (this was the Round 3 bug: selecting kg over an
  // already-locked "bags" guess got instantly overwritten back to bags).
  // If the item name matches stock in exactly one unit, lock to it (a
  // material normally has one unit). If it matches stock in more than one
  // unit (legacy fragmented data) or none at all, leave Unit selectable so
  // the user explicitly picks which pool this sale applies to.
  function syncSaleUnit(){
    const name = main.querySelector('#s_item').value.trim();
    const unitsForName = Array.from(new Set(state.stock.filter(x=>x.name===name).map(x=>x.unit)));
    if(unitsForName.length===1){ s_unit.value = unitsForName[0]; s_unit.disabled = true; }
    else { s_unit.disabled = false; }
  }
  const s_batch_wrap = main.querySelector('#s_batch_wrap');
  const s_batch = main.querySelector('#s_batch');
  // a staged (Historical) sale has no known cost basis and no batch concept
  // — this selector only ever applies to a real, non-staged sale.
  const usesBatches = editing ? !editing.staged : !state.settings.setupMode;
  function updateSaleBatches(){
    if(!usesBatches){ s_batch_wrap.style.display='none'; return; }
    const name = main.querySelector('#s_item').value.trim();
    const unit = s_unit.value;
    const batches = saleBatchesForItem(name, unit, editing?editing.id:null);
    if(!batches.length){ s_batch_wrap.style.display='none'; s_batch.innerHTML=''; return; }
    const prevVal = s_batch.value || (editing?editing.sourcePurchaseId:'') || '';
    s_batch.innerHTML = `<option value="" ${!prevVal?'selected':''}>— select a batch —</option>` + batches.map(b=>`<option value="${b.id}" ${b.id===prevVal?'selected':''}>${b.label}</option>`).join('');
    s_batch_wrap.style.display = 'block';
  }
  function updateQtyHint(){
    const name = main.querySelector('#s_item').value.trim();
    const unit = s_unit.value;
    let avail;
    if(usesBatches && s_batch_wrap.style.display!=='none' && s_batch.value){
      const batches = saleBatchesForItem(name, unit, editing?editing.id:null);
      const chosen = batches.find(b=>b.id===s_batch.value);
      avail = chosen ? chosen.remaining : 0;
    } else {
      const stockItem = state.stock.find(x=>x.name===name && x.unit===unit);
      avail = stockItem ? Number(stockItem.qty) : 0;
    }
    s_qty.placeholder = name ? `Available: ${fmtQtyPlain(avail)} ${unit}` : '';
  }
  main.querySelector('#s_item').addEventListener('input', ()=>{ syncSaleUnit(); updateSaleBatches(); updateQtyHint(); });
  s_unit.addEventListener('change', ()=>{ updateSaleBatches(); updateQtyHint(); });
  s_batch.addEventListener('change', updateQtyHint);
  syncSaleUnit(); updateSaleBatches(); updateQtyHint();
  const s_rate = main.querySelector('#s_rate');
  const s_total_display = main.querySelector('#s_total_display');
  function updateSaleTotalDisplay(){
    const qty = Number(s_qty.value)||0, rate = Number(s_rate.value)||0;
    s_total_display.value = (qty&&rate) ? fmtQtyPlain(qty*rate) : '';
  }
  s_qty.addEventListener('input', updateSaleTotalDisplay);
  s_rate.addEventListener('input', updateSaleTotalDisplay);
  main.querySelector('#s_type').onchange = (e)=>{
    const isCredit = e.target.value==='credit';
    main.querySelector('#s_due_wrap').style.display = isCredit ? 'block':'none';
    main.querySelector('#s_days_wrap').style.display = isCredit ? 'block':'none';
    main.querySelector('#s_acc_wrap').style.display = isCredit ? 'none':'block';
  };
  main.querySelector('#s_days').oninput = (e)=>{
    const days = Number(e.target.value);
    if(days>0){
      const base = new Date(main.querySelector('#s_date').value || todayStr());
      base.setDate(base.getDate()+days);
      main.querySelector('#s_due').value = toDateInputStr(base);
    }
  };
  main.querySelector('#s_add').onclick = guardDoubleSubmit('s_add', async ()=>{
    const date=main.querySelector('#s_date').value, party=main.querySelector('#s_party').value.trim(),
      item=main.querySelector('#s_item').value.trim(), qty=Number(main.querySelector('#s_qty').value),
      unit=main.querySelector('#s_unit').value,
      rate=Number(main.querySelector('#s_rate').value), type=main.querySelector('#s_type').value,
      account=main.querySelector('#s_account').value,
      due=main.querySelector('#s_due').value,
      creditDays=main.querySelector('#s_days').value ? Number(main.querySelector('#s_days').value) : null;
    const partnerSel = main.querySelector('#s_partner');
    const partnerId = partnerSel ? partnerSel.value : '';
    const partnerPercent = partnerId ? (Number(main.querySelector('#s_partner_pct').value)||0) : 0;
    if(!party||!item||!qty||!rate){ await showAlert('Please fill all required fields'); return; }
    const sourcePurchaseId = usesBatches ? (s_batch.value || null) : (editing ? editing.sourcePurchaseId : null);
    const body = {date, party, item, qty, unit, rate, type, account, dueDate: type==='credit'?due:null, creditDays: type==='credit'?creditDays:null, partnerId: partnerId||null, partnerPercent, sourcePurchaseId};
    try {
      if(editing){ await api('PATCH', '/api/sales/'+editing.id, body); editingSaleId = null; }
      else { await api('POST', '/api/sales', body); }
      await refreshState();
      showToast(editing ? 'Sale updated' : 'Sale added');
    } catch(e){ await showAlert(e.message); }
  });
  if(editing){
    main.querySelector('#s_cancel').onclick = ()=>{ editingSaleId = null; render(); };
  }
  main.querySelectorAll('[data-sedit]').forEach(b=>{
    b.onclick = ()=>{ editingSaleId = b.dataset.sedit; render(); };
  });
  main.querySelectorAll('[data-sdelete]').forEach(b=>{
    b.onclick = async ()=>{
      // QA Round 16: the server now blocks per-sale (only when THIS sale
      // has actually drawn money from the party's FIFO-pooled receipts),
      // not just because the party has receipts somewhere. Same check
      // up front here, using the Ledger's own FIFO math, so a blocked
      // delete never even shows the generic "cannot be undone" confirm.
      const sale = state.sales.find(s=>s.id===b.dataset.sdelete);
      if(sale && state.salesReturns.some(r=>r.saleId===sale.id)){
        await showAlert('This sale has a Sales Return recorded against it — delete that return first, then this sale.');
        return;
      }
      if(sale && sale.type==='credit'){
        const applied = Number(sale.total) - creditSaleOutstanding(sale);
        if(applied > 0.009){
          await showAlert(`Rs ${fmtPlain(applied)} has already been received against this sale (FIFO-applied from ${sale.party}'s receipts) — delete or edit that receipt from the Ledger first, then this sale.`);
          return;
        }
      }
      if(!await showConfirm('Delete this sale entry? This cannot be undone.')) return;
      try {
        await api('DELETE', '/api/sales/'+b.dataset.sdelete);
        if(editingSaleId===b.dataset.sdelete) editingSaleId = null;
        await refreshState();
        showToast('Sale deleted');
      } catch(e){ await showAlert(e.message); }
    };
  });
  enableEnterNav(form, '#s_add');
  const srSaleSel = main.querySelector('#sr_sale');
  if(srSaleSel){
    const srSettlementSel = main.querySelector('#sr_settlement');
    const srAccWrap = main.querySelector('#sr_acc_wrap');
    const srQty = main.querySelector('#sr_qty');
    function updateSrHint(){
      const sale = state.sales.find(x=>x.id===srSaleSel.value);
      if(!sale) return;
      const returnable = saleReturnableQty(sale.id);
      // 'credit' settlement only has something to reduce on a credit sale —
      // same guard the server enforces (see POST /api/sales-returns) — so
      // hide it here rather than let the user hit a confusing rejection.
      const creditOpt = srSettlementSel.querySelector('option[value="credit"]');
      const creditMakesSense = sale.type==='credit';
      creditOpt.disabled = !creditMakesSense;
      if(!creditMakesSense && srSettlementSel.value==='credit') srSettlementSel.value = 'refund';
      srAccWrap.style.display = srSettlementSel.value==='refund' ? 'block' : 'none';
      srQty.placeholder = `Up to ${fmtQtyPlain(returnable)} ${sale.unit}`;
    }
    srSaleSel.addEventListener('change', updateSrHint);
    srSettlementSel.addEventListener('change', updateSrHint);
    updateSrHint();
    main.querySelector('#sr_add').onclick = guardDoubleSubmit('sr_add', async ()=>{
      const saleId = srSaleSel.value;
      const date = main.querySelector('#sr_date').value;
      const qty = Number(srQty.value);
      const settlement = srSettlementSel.value;
      const account = main.querySelector('#sr_account').value;
      const note = main.querySelector('#sr_note').value.trim();
      if(!saleId||!date||!qty){ await showAlert('Select a sale and enter date and quantity'); return; }
      const returnable = saleReturnableQty(saleId);
      if(qty > returnable + 0.001){ await showAlert(`Only ${fmtQtyPlain(returnable)} can still be returned from this sale.`); return; }
      const body = {saleId, date, qty, settlement, note};
      if(settlement==='refund') body.account = account;
      try{
        await api('POST', '/api/sales-returns', body);
        await refreshState();
        showToast('Sales return recorded');
      }catch(e){ await showAlert(e.message); }
    });
  }
  main.querySelectorAll('[data-srdelete]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await showConfirm('Delete this sales return? This cannot be undone.')) return;
      try{ await api('DELETE', '/api/sales-returns/'+b.dataset.srdelete); await refreshState(); showToast('Sales return deleted'); }
      catch(e){ await showAlert(e.message); }
    };
  });
}

// ---------- PARTY LEDGER (per-customer statement + receiving payments) ----------
function renderLedger(main){
  const ro = !canEditActiveClient();
  const toggleHtml = `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn ${ledgerView==='buyer'?'gold':'danger'}" id="lv_buyer">Buyers (Receivable)</button>
      <button class="btn ${ledgerView==='supplier'?'gold':'danger'}" id="lv_supplier">Suppliers (Payable)</button>
    </div>`;
  main.innerHTML = toggleHtml + `<div id="ledger_body"></div>`;
  main.querySelector('#lv_buyer').onclick = ()=>{ ledgerView='buyer'; render(); };
  main.querySelector('#lv_supplier').onclick = ()=>{ ledgerView='supplier'; render(); };
  const body = main.querySelector('#ledger_body');
  if(ledgerView==='supplier') renderSupplierLedger(body, ro); else renderBuyerLedger(body, ro);
}
function renderBuyerLedger(main, ro){
  const parties = partyNames();
  if(!parties.length){
    main.innerHTML = `<section class="block"><div class="empty">No sales entered yet — a party ledger will appear here once you add sales.</div></section>`;
    return;
  }
  // no party is pre-selected — the ledger below only appears once one is
  // actively chosen (dropdown or a row's View button), never a default guess.
  if(ledgerParty && ledgerParty!=='__all__' && !parties.includes(ledgerParty)) ledgerParty = '';
  const partyPicker = `
    <section class="block">
      <h2>Party Ledger</h2>
      <div class="form-grid" style="margin-bottom:0;">
        <div><label>Party</label><select id="lg_party"><option value="" ${!ledgerParty?'selected':''}>— select a party —</option><option value="__all__" ${ledgerParty==='__all__'?'selected':''}>All Parties</option>${parties.map(p=>`<option value="${p}" ${p===ledgerParty?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
    </section>`;
  if(!ledgerParty || ledgerParty==='__all__'){
    main.innerHTML = `
      <section class="block">
        <h2>All Parties — Balances</h2>
