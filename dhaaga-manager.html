<style>
  :root{
    --bg:#F1F5F9;
    --panel:#FFFFFF;
    --ink:#1E293B;
    --ink-soft:#64748B;
    --line:#E2E8F0;
    --indigo:#2563EB;
    --indigo-dark:#1D4ED8;
    --gold:#2563EB;
    --gold-soft:#EFF6FF;
    --maroon:#8A3A3A;
    --teal:#059669;
    --danger:#DC2626;
    --ok:#059669;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
    --focus-ring:rgba(37,99,235,.16);
    --sidebar-bg:#0F172A;
    --sidebar-hover-bg:rgba(255,255,255,.10);
    --sidebar-active-bg:rgba(255,255,255,.20);
    --sidebar-line:rgba(255,255,255,.16);
    --sidebar-text:rgba(255,255,255,.68);
    --sidebar-text-active:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;direction:ltr;}
  .app{max-width:none;margin:0;width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:row;}
  .sidebar{width:248px;flex:0 0 248px;background:var(--sidebar-bg);
    display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;align-self:flex-start;
    height:100vh;height:100dvh;overflow:hidden;}
  .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid var(--sidebar-line);margin-bottom:12px;}
  .brand-icon{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:var(--sidebar-active-bg);color:var(--sidebar-text-active);
    display:flex;align-items:center;justify-content:center;font-size:17px;}
  header.top{display:contents;}
  header.top h1{font-size:14.5px;margin:0;font-weight:700;color:var(--sidebar-text-active);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.top .sub{font-size:11px;color:var(--sidebar-text);margin-top:2px;display:none;}
  nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;background:transparent;padding:2px 0;
    scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;
    border:none;color:var(--sidebar-text);padding:9px 10px;font-size:13.5px;font-family:inherit;cursor:pointer;
    border-radius:8px;white-space:nowrap;}
  nav.tabs button .tab-icon{font-size:15px;flex:0 0 18px;text-align:center;opacity:.9;}
  nav.tabs button.active{color:var(--sidebar-text-active);background:var(--sidebar-active-bg);font-weight:600;}
  nav.tabs button:hover:not(.active){background:var(--sidebar-hover-bg);color:var(--sidebar-text-active);}
  .sidebar-bottom{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding-top:8px;margin-top:6px;
    border-top:1px solid var(--sidebar-line);}
  .sidebar-bottom .settings-btn{flex:0 0 auto;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;
    border:none;color:var(--sidebar-text);padding:9px 10px;font-size:13.5px;font-family:inherit;cursor:pointer;
    border-radius:8px;white-space:nowrap;width:100%;}
  .sidebar-bottom .settings-btn .tab-icon{font-size:15px;flex:0 0 18px;text-align:center;opacity:.9;}
  .sidebar-bottom .settings-btn.active{color:var(--sidebar-text-active);background:var(--sidebar-active-bg);font-weight:600;}
  .sidebar-bottom .settings-btn:hover:not(.active){background:var(--sidebar-hover-bg);color:var(--sidebar-text-active);}
  .main-wrap{flex:1;min-width:0;}
  main{padding:22px 26px 60px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
    box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column;}
  /* fixed-height label area (room for 2 lines) so the value below it lines
     up across a row of cards regardless of whether a given card's label is
     short ("Stock Value") or wraps ("Payable Due (incl. Commission
     Agents)") — otherwise longer labels push their value down further
     than short ones, and the row of amounts reads staggered. */
  .card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;
    min-height:2.4em;line-height:1.2em;display:flex;align-items:flex-start;}
  .card .value{font-size:21px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .card .value-row{margin-top:auto;}
  .card.warn .value{color:var(--danger);}
  .value-row{display:flex;align-items:center;gap:8px;}
  .trend-card svg{display:block;}
  .eye-btn{background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1;opacity:.7;
    border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .eye-btn:hover{opacity:1;}
  .eye-btn.big{width:36px;height:36px;font-size:17px;}
  section.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
  section.block h2{font-size:15.5px;margin:0 0 14px;color:var(--ink);font-weight:700;letter-spacing:.1px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:14px;background:var(--panel);color:var(--ink);transition:border-color .12s,box-shadow .12s;}
  /* account-picker selects (Paid From / Cover Shortfall From / Received
     Into) show the account name plus its available balance, e.g. "Faysal
     3815 (Rs 80,057 available)" — too long for the grid's narrow columns
     at the default input font size, so these get a smaller font and
     tighter padding to fit more of that text before it's clipped. */
  select{font-size:12.5px;padding:9px 8px;}
  /* account-picker selects show a name + balance, e.g. "Faysal 3815 (Rs
     80,057)" or "...(Rs 80,057 available)" for a shortfall-cover choice —
     too long for one grid column even at the smaller select font size, so
     give these specific fields a second column's worth of width whenever
     the grid has room for it. Matched by id suffix so every form that
     builds its options via accountOptionsHtml()/fundingCoverOptionsHtml()
     picks this up automatically, with no per-form markup changes needed. */
  .form-grid > div:has(> select[id$="_account"]),
  .form-grid > div:has(> select[id$="_account1"]),
  .form-grid > div:has(> select#tr_from),
  .form-grid > div:has(> select#tr_to){ grid-column: span 2; }
  input:focus,select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--focus-ring);}
  .btn{display:inline-block;background:var(--indigo);color:#fff;border:none;padding:10px 18px;
    border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;transition:background .12s;}
  .btn:hover{background:var(--indigo-dark);}
  .btn.gold{background:var(--gold);color:#fff;}
  .btn.gold:hover{background:var(--indigo-dark);}
  .btn.danger{background:transparent;color:var(--ink-soft);border:1px solid var(--line);padding:6px 12px;
    font-size:12.5px;font-weight:600;border-radius:7px;}
  .btn.danger:hover{background:#F8FAFC;color:var(--ink);border-color:#CBD5E1;}
  /* same compact size as .btn.danger, but a solid dark fill — for
     navigation controls (e.g. Previous/Next Week) that need to stand out
     more than the usual light Edit/Delete/Cancel buttons do. */
  .btn.nav{background:var(--indigo-dark);color:#fff;border:none;padding:6px 12px;
    font-size:12.5px;font-weight:600;border-radius:7px;}
  .btn.nav:hover{background:var(--ink);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#F8FAFC;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.cash{background:#DCFCE7;color:#15803D;}
  .pill.credit{background:#FEF3C7;color:#B45309;}
  .pill.partial{background:#FDE7C8;color:#8A5A12;}
  .pill.due{background:#FEE2E2;color:var(--danger);}
  .pill.ok{background:#DCFCE7;color:#15803D;}
  .pill.role{background:var(--gold-soft);color:var(--indigo-dark);}
  .empty{color:var(--ink-soft);font-size:13px;padding:14px 0;text-align:center;}
  .alert-list{display:flex;flex-direction:column;gap:5px;}
  .alert{background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:6px 12px;font-size:13px;
    color:#92400E;}
  .alert.overdue{background:#FEF2F2;border-color:#FECACA;color:#991B1B;}
  .recovery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-content:start;}
  .recovery-box{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .recovery-box-name{padding:7px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);}
  .recovery-box-split{display:flex;}
  .recovery-box-cell{flex:1;padding:8px 12px;min-width:0;}
  .recovery-box-cell.due-soon{background:#FFFBEB;}
  .recovery-box-cell.overdue{background:#FEF2F2;}
  .recovery-box-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;}
  .recovery-box-amount{font-size:14px;font-weight:700;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;
    justify-content:center;z-index:1000;padding:20px;}
  .modal-box{background:var(--panel);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;
    box-shadow:0 20px 50px rgba(15,23,42,.3);}
  .modal-box p{margin:0 0 18px;color:var(--ink);font-size:14px;line-height:1.6;white-space:pre-wrap;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .modal-actions .btn.danger{padding:9px 16px;font-size:13px;}
  #toastRoot{position:fixed;top:18px;right:18px;z-index:1100;display:flex;flex-direction:column;gap:8px;
    max-width:min(320px,calc(100vw - 36px));}
  .toast{background:#0F172A;color:#fff;padding:11px 16px;border-radius:9px;font-size:13.5px;font-weight:500;
    box-shadow:0 8px 20px rgba(15,23,42,.25);opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast::before{content:"✓ ";color:#4ADE80;font-weight:700;}
  .settings-client-picker{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:var(--gold-soft);
    border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;flex-wrap:wrap;}
  .settings-client-picker label{margin:0;font-size:13px;color:var(--ink);font-weight:600;}
  .settings-client-picker select{width:auto;min-width:200px;}
  .subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .subtabs button{background:transparent;border:none;color:var(--ink-soft);padding:10px 14px;font-size:13.5px;
    font-family:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .subtabs button:hover{color:var(--ink);}
  .subtabs button.active{color:var(--indigo);border-bottom-color:var(--indigo);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .save-note{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.two-col{grid-template-columns:1fr;}}
  .settings-note{font-size:12px;color:var(--ink-soft);line-height:1.7;background:#F8FAFC;border:1px solid var(--line);padding:10px 12px;border-radius:9px;}
  .auth-wrap{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
  .auth-wrap h2{margin-top:0;color:var(--ink);}
  .auth-wrap .field{margin-bottom:12px;}
  .auth-error{color:var(--danger);font-size:13px;margin-top:8px;}
  .field-wrap{position:relative;}
  .combo-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:9px;margin-top:2px;max-height:180px;overflow-y:auto;z-index:20;box-shadow:0 8px 20px rgba(15,23,42,.12);}
  .combo-item{padding:8px 10px;font-size:13px;cursor:pointer;}
  .combo-item.hi{background:var(--indigo);color:#fff;}
  .topbar{display:flex;justify-content:flex-end;align-items:center;padding:14px 26px 0;}
  .profile-trigger{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);transition:border-color .12s;}
  .profile-trigger:hover,.profile-trigger.active{border-color:var(--indigo);}
  .profile-info{text-align:right;}
  .profile-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;}
  .profile-meta{font-size:11.5px;color:var(--ink-soft);}
  .profile-avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--indigo);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .logout-btn{width:100%;background:transparent;border:1px solid var(--sidebar-line);color:var(--sidebar-text);
    padding:8px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600;transition:background .12s,color .12s;}
  .logout-btn:hover{background:var(--sidebar-hover-bg);color:var(--sidebar-text-active);}
  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex:0 0 auto;height:auto;position:relative;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;}
    .brand{border-bottom:none;border-right:1px solid var(--sidebar-line);margin-bottom:0;padding:0 12px 0 0;flex:0 0 auto;}
    nav.tabs{flex-direction:row;overflow-x:auto;padding-left:10px;}
    nav.tabs button span:last-child{display:none;}
    .sidebar-bottom{flex-direction:row;flex:0 0 auto;margin-left:auto;margin-top:0;padding-top:0;border-top:none;
      border-left:1px solid var(--sidebar-line);padding-left:10px;}
    .sidebar-bottom .settings-btn span:last-child{display:none;}
    .logout-btn{width:auto;white-space:nowrap;}
    .topbar{padding:10px 14px 0;}
    .profile-info{display:none;}
    .profile-trigger{padding:4px;border-radius:50%;}
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🧵</div>
      <header class="top" id="topHeader">
        <h1 id="companyTitle">Yarn Trading Manager</h1>
        <div class="sub" id="companySub">Yarn stock and trade ledger — Sales, Purchases, Cheques, Investors</div>
      </header>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="sidebar-bottom" id="sidebarBottom"></div>
  </aside>
  <div class="main-wrap">
    <div class="topbar" id="topbar"></div>
    <main id="main"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
let state = {
  settings: { companyName: '', businessLabel: '', openingCash: 0, chequeReminderDays: 3, creditReminderDays: 3, setupMode: false, themeColor: '#2563EB', fontSize: 'medium', hideOtherCards: true, hideTotalInvestment: true, hideTradeSummary: true },
  stock: [],
  sales: [],
  purchases: [],
  cheques: [],
  investors: [],
  expenses: [],
  banks: [],
  partners: [],
  parties: [],
  suppliers: [],
  auditLog: [],
  receipts: [],
  payouts: [],
  supplierPayments: [],
  transfers: [],
  personalLoans: [],
  tradeSummaries: [],
  investorSummaries: [],
  purchaseReturns: [],
  salesReturns: [],
  purchaseAdvances: []
};
let activeTab = "dashboard";
let loaded = false;
let session = null; // {id, username, role, activeClientId}
let hasAdminAccount = false;
let userList = []; // loaded lazily for the Settings > User Accounts screen
let clientList = []; // {id, clientNumber, name, accessLevel} — the clients this user may switch between
let adminClients = []; // {id, clientNumber, name, status} — every client (incl. inactive), Settings > Clients tab only
let editingClientId = null;
let settingsTab = 'opening'; // 'opening' | 'preferences' | 'appearance' | 'banks' | 'clients' | 'users' | 'backup'
let backupHistory = [];
let backupSettings = null;
let editingSaleId = null;
let editingPurchaseId = null;
let editingInvestorId = null;
let editingUserId = null;
let editingBankId = null;
let editingPartyId = null;
let editingSupplierId = null;
let editingStockId = null;
let masterTab = 'material'; // 'material' | 'supplier' | 'buyer'
let financeTab = 'cheque'; // 'cheque' | 'payment' | 'transfer' — sub-tabs of the Financial Entry tab
let editingExpenseId = null;
let auditFrom = '';
let auditTo = '';
let auditParty = '';
let auditView = 'edit'; // 'edit' or 'delete'
let investorPeriod = 'all'; // 'day','week','month','all'
let isSavePeriod = 'all'; // 'month' or 'all' — which period the Investor Summary "Save" button captures next
let isSaveInvestorId = null; // which investor the Investor Summary "Save" button targets next
let ledgerParty = ''; // currently selected party on the Party Ledger tab
let ledgerSupplier = ''; // currently selected supplier on the Party Ledger tab's Supplier view
let ledgerView = 'buyer'; // 'buyer' or 'supplier' — which side of the Party Ledger tab is shown
let reportsAccount = 'cash'; // currently selected account on the Reports tab's Bank Ledger section
const dashReveal = {other:false, investment:false, tradesummary:false}; // in-memory only: every page load/restart starts hidden
let tsSavePeriod = 'all'; // which period the Trade Summary "Save" button captures next
let fsSavedDirName = null; // display-only: the name of the folder summary JPGs are currently saved into (null = none chosen yet)
let receivingReportPeriod = 'week'; // 'week' | 'month' | 'all' — which all-parties view the Receiving Report shows
let receivingReportWeekOffset = 0; // 0 = this week, -1 = last week, +1 = next week
let receivingReportMonthOffset = 0; // 0 = this month, -1 = last month, +1 = next month
let receivingReportParty = ''; // '' = show the all-parties view (period-dependent); a party name = show that party's full chronological statement instead
let ledgerPartnerId = '';// currently selected commission agent on the Commission Agents tab's ledger

function amountCard(label, value, keyId, warn, masked){
  return `<div class="card ${warn?'warn':''}" style="position:relative;"><div class="label">${label}</div>
    <div class="value-row"><div class="value">${masked?'••••••':(value===null?'—':`Rs ${fmt(value)}`)}</div></div>
    ${keyId?`<button class="eye-btn" id="${keyId}_eye" style="position:absolute;top:12px;right:12px;" title="${masked?'Show':'Hide'} amount">${masked?'\u{1F441}️':'\u{1F648}'}</button>`:''}
  </div>`;
}
function amountCardGrouped(label, value, warn, masked){
  return `<div class="card ${warn?'warn':''}"><div class="label">${label}</div>
    <div class="value-row"><div class="value">${masked?'••••••':`Rs ${fmt(value)}`}</div></div></div>`;
}

// ---------- dashboard trend mini-charts (plain inline SVG, no charting library) ----------
function lastNWeekBuckets(n){
  const today = new Date(todayStr());
  const buckets = [];
  for(let i=n-1;i>=0;i--){
    const end = new Date(today); end.setDate(end.getDate() - i*7);
    const start = new Date(end); start.setDate(start.getDate()-6);
    buckets.push({start: toDateInputStr(start), end: toDateInputStr(end), label: `${start.getDate()}/${start.getMonth()+1}`});
  }
  return buckets;
}
// calendar week (Sunday–Saturday, same week definition periodMatches()
// uses for period:'week'), shifted by offsetWeeks — 0 = this week, -1 =
// last week, etc. — for the Reports tab's Receiving Report.
function receivingReportWeekBounds(offsetWeeks){
  const now = new Date(todayStr());
  const startOfThisWeek = new Date(now); startOfThisWeek.setDate(now.getDate()-now.getDay());
  const start = new Date(startOfThisWeek); start.setDate(start.getDate() + offsetWeeks*7);
  const days = [];
  for(let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); days.push(toDateInputStr(d)); }
  return { start: days[0], end: days[6], days };
}
// receipts (money received) for one calendar week, pivoted by party × day
// — excludes staged/historical receipts, same convention as every other
// figure on the Reports tab.
function receivingReportData(offsetWeeks){
  const { days } = receivingReportWeekBounds(offsetWeeks);
  const daySet = new Set(days);
  const byParty = {};
  state.receipts.forEach(r=>{
    if(r.staged || !daySet.has(r.date)) return;
    if(!byParty[r.party]) byParty[r.party] = {};
    byParty[r.party][r.date] = (byParty[r.party][r.date]||0) + Number(r.amount);
  });
  const parties = Object.keys(byParty).sort((a,b)=>a.localeCompare(b));
  return { days, parties, byParty };
}
// calendar month, shifted by offsetMonths — 0 = this month, -1 = last
// month, etc. — for the Receiving Report's Monthly view.
function receivingReportMonthBounds(offsetMonths){
  const now = new Date(todayStr());
  const d = new Date(now.getFullYear(), now.getMonth()+offsetMonths, 1);
  const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const label = d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  return { ym, label };
}
// one total received per party, no daily breakdown — used by the
// Receiving Report's Monthly (one month's receipts) and All-Time (every
// receipt ever) views.
// every individual receipt within the period, chronological — the
// "All Parties" Monthly/All-Time views show this instead of a lump total
// per party, so each payment's date and method (cash/bank/cleared cheque)
// stays visible rather than being collapsed into one number.
function receivingReportTransactions(matchesDate){
  return state.receipts
    .filter(r=>!r.staged && matchesDate(r.date))
    .map(r=>({
      date: r.date, party: r.party, amount: Number(r.amount),

// Net Worth over time: a line chart (not bars) since this is a running
// level, not a per-period flow — each point is "net worth as of this
// month", so a line correctly shows the trajectory (growing, flat, or
// dipping) rather than implying independent per-month amounts.
function netWorthChartSVG(points, investment){
  const w = 820, h = 260, padL = 64, padR = 20, padT = 20, padB = 34;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const values = points.map(p=>p.value).concat([investment, 0]);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = (maxV - minV) || 1;
  const padding = range * 0.12;
  const yMin = minV - padding, yMax = maxV + padding;
  const xAt = (i) => padL + (points.length<=1 ? 0 : (i/(points.length-1)) * plotW);
  const yAt = (v) => padT + plotH - ((v - yMin)/(yMax - yMin)) * plotH;

  const linePath = points.map((p,i)=> `${i===0?'M':'L'} ${xAt(i).toFixed(1)} ${yAt(p.value).toFixed(1)}`).join(' ');
  const investY = yAt(investment).toFixed(1);
  const zeroY = yAt(0).toFixed(1);

  const markers = points.map((p,i)=> `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.value).toFixed(1)}" r="4" fill="var(--teal)"><title>${p.label}: Rs ${fmtPlain(p.value)}</title></circle>`).join('');
  // direct labels only at the ends — not every point, per the "selective
  // direct labels" rule, since the hover title already covers the rest.
  const firstLabel = points.length ? `<text x="${xAt(0).toFixed(1)}" y="${(yAt(points[0].value)-10).toFixed(1)}" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">Rs ${fmtPlain(points[0].value)}</text>` : '';
  const lastIdx = points.length-1;
  const lastLabel = points.length ? `<text x="${xAt(lastIdx).toFixed(1)}" y="${(yAt(points[lastIdx].value)-10).toFixed(1)}" font-size="12" font-weight="700" fill="var(--teal)" text-anchor="end">Rs ${fmtPlain(points[lastIdx].value)}</text>` : '';
  // month labels along the bottom — thin out if there are many, so they
  // never overlap.
  const labelEvery = Math.max(1, Math.ceil(points.length/9));
  const monthLabels = points.map((p,i)=> i%labelEvery===0 || i===lastIdx ? `<text x="${xAt(i).toFixed(1)}" y="${h-10}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">${p.ym==='Start'?'Start':fmtMonthLabel(p.ym)}</text>` : '').join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="260" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${investY}" x2="${w-padR}" y2="${investY}" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4,4"></line>
    <text x="${w-padR}" y="${(Number(investY)-6).toFixed(1)}" font-size="11" fill="var(--ink-soft)" text-anchor="end">Total Investment: Rs ${fmtPlain(investment)}</text>
    ${yMin<0 && yMax>0 ? `<line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="var(--line)" stroke-width="1"></line>` : ''}
    <path d="${linePath}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
    ${markers}
    ${firstLabel}
    ${lastLabel}
    ${monthLabels}
  </svg>`;
}
function fmtMonthLabel(ym){
  const [y,m] = ym.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[Number(m)-1]} ${y.slice(2)}`;
}
function barChartSVG(values, color){
  const w = 100, h = 34, gap = 2;
  const max = Math.max(1, ...values.map(v=>Number(v)||0));
  const bw = (w/values.length) - gap;
  const bars = values.map((v,i)=>{
    const bh = Math.max(1, (Number(v)||0)/max * (h-2));
    const x = i*(w/values.length) + gap/2;
    const y = h - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${color}"></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="44" preserveAspectRatio="none">${bars}</svg>`;
}

}

// numeric display is bold everywhere by default (fmt/fmtQty) — fmtPlain is
// the same formatting without the <b> wrapper, for the few spots (native
// confirm() dialogs) whose text is HTML-escaped, not rendered as HTML.
function fmtPlain(n){ return Math.round(Number(n||0)).toLocaleString('en-US'); }
// QA: several money forms accepted 0/negative/NaN/Infinity amounts (e.g. a
// Supplier Payment of -50 raised the bank balance instead of lowering it).
// Every transaction-amount field must pass this before submit; matches the
// server's own isPositiveAmount() guard exactly, just catching it earlier.
// every amount/total column is NUMERIC(14,2) server-side (12 integer
// digits) — 1e12 would overflow it outright, long before it's a plausible
// real transaction, so it's rejected here too rather than round-tripping
// to the server for an ugly error.
const MAX_SANE_AMOUNT = 1e11;
function isPositiveAmount(v){ const n = Number(v); return Number.isFinite(n) && n > 0 && n < MAX_SANE_AMOUNT; }
// for an opening-balance-style field, 0 is a legitimate "no prior history"
// value — only negative/NaN/Infinity/too-large should be rejected.
function isNonNegativeAmount(v){ const n = Number(v); return Number.isFinite(n) && n >= 0 && n < MAX_SANE_AMOUNT; }
function fmt(n){ return `<b>${fmtPlain(n)}</b>`; }
// quantities/rates (yarn kg, cost per kg) are commonly fractional and were
// being silently rounded to whole numbers in list views via fmt() — this
// keeps up to 2 decimal places (without padding whole numbers) so what's
// displayed matches what's actually stored.
function fmtQtyPlain(n){ return Number(n||0).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}); }
function fmtQty(n){ return `<b>${fmtQtyPlain(n)}</b>`; }
// display-only date formatter: "2026-10-04" (or a Postgres-style
// "2026-10-04T19:00:00.000Z") -> "04-10-26". Never use this on a value
// that's about to be sent back to the API, fed to an <input type="date">,
// compared/sorted, or used in periodMatches()/date-range filtering — all
// of those need the raw YYYY-MM-DD string, which sorts and compares
// correctly as plain text; DD-MM-YY does not.
function fmtDate(d){
  if(!d) return '—';
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return String(d);
  return `${m[3]}-${m[2]}-${m[1].slice(2)}`;
}
// same DD-MM-YY date, plus a time — for a generation timestamp or similar.
// Never use toLocaleString()/toLocaleDateString() directly for anything
// shown to the user: those render M/D/YYYY (with slashes) in en-US, which
// is exactly the inconsistent format this function replaces everywhere.
// wraps a money-moving button's async click handler so a second click
// while the first request is still in flight does nothing — prevents the
// exact double-submit bug seen in QA testing: a fast double-click on Add
// Purchase created two purchases, the second one using a stale
// (not-yet-refreshed) balance and leaving an account negative.
function guardDoubleSubmit(btnId, handler){
  return async (...args)=>{
    const btn = document.getElementById(btnId);
    if(btn){ if(btn.disabled) return; btn.disabled = true; }
    try{ await handler(...args); }
    finally{ if(btn) btn.disabled = false; }
  };
}
function fmtDateTime(d){
  const dt = d instanceof Date ? d : new Date(d);
  if(isNaN(dt.getTime())) return '—';
  const pad = n => String(n).padStart(2,'0');
  const datePart = `${pad(dt.getDate())}-${pad(dt.getMonth()+1)}-${String(dt.getFullYear()).slice(2)}`;
  const timePart = dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true});
  return `${datePart} ${timePart}`;
}

function escapeHtml(s){

}

    root.querySelector('#cam_cancel').onclick = ()=>close(null);

    const itemInput = root.querySelector('#cam_item');
    attachCombo(itemInput, knownVarieties, root.querySelector('.modal-box'));
    const unitSel = root.querySelector('#cam_unit');
    function syncUnit(){
      const name = itemInput.value.trim();
      const unitsForName = Array.from(new Set(state.stock.filter(x=>x.name===name).map(x=>x.unit)));
      if(unitsForName.length===1){ unitSel.value = unitsForName[0]; unitSel.disabled = true; } else { unitSel.disabled = false; }
    }
    const preview = root.querySelector('#cam_preview');
    function updatePreview(){
      syncUnit();
      const qty = Number(root.querySelector('#cam_qty').value)||0;
      const rate = Number(root.querySelector('#cam_rate').value)||0;
      const total = qty*rate;
      const covered = Math.min(total, Number(advance.amount));
      const remaining = Math.max(0, total - Number(advance.amount));

      preview.innerHTML = `Total: Rs ${fmtPlain(total)} — Advance covers Rs ${fmtPlain(covered)}`
        + (remaining>0.009?`, remaining payable: Rs ${fmtPlain(remaining)}`:'')
        + (leftover>0.009?`, Rs ${fmtPlain(leftover)} of the advance will be left unused (stays on record against this supplier)`:'');
    }
    itemInput.addEventListener('input', updatePreview);
    root.querySelector('#cam_qty').addEventListener('input', updatePreview);
    root.querySelector('#cam_rate').addEventListener('input', updatePreview);
    updatePreview();
    root.querySelector('#cam_save').onclick = ()=>{
      const item = itemInput.value.trim();
      const qty = Number(root.querySelector('#cam_qty').value);
      const unit = unitSel.value;
      const rate = Number(root.querySelector('#cam_rate').value);
      if(!item || !qty || !rate){ showAlert('Please fill all required fields'); return; }
      close({item, qty, unit, rate});
    };
    document.addEventListener('keydown', onKey);
    itemInput.focus();
  });

      if(!party || !amount || !dueDate){ showAlert('Please fill all fields'); return; }

// brief, non-blocking confirmation after a successful save/delete — errors
// still use showAlert() (a modal that requires acknowledgement), since a
// failure deserves deliberate attention but routine success shouldn't
// interrupt fast repeated data entry.
function showToast(message){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  root.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  }, 2200);
}

// ---------- per-client theme (accent color + font size, stored in settings) ----------
function hexToRgb(hex){
  hex = (hex||'#2563EB').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function shade(hex, percent){ // percent -1..1: negative darkens toward black, positive lightens toward white
  const [r,g,b] = hexToRgb(hex);
  const t = percent<0 ? 0 : 255;
  const p = Math.abs(percent);
  const mix = (c)=> Math.round(c+(t-c)*p);
  return '#'+[mix(r),mix(g),mix(b)].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
}
function relativeLuminance(hex){
  const [r,g,b] = hexToRgb(hex).map(c=>{
    c/=255;
    return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
// The client's one chosen color is the single source of truth for the whole
// look: it becomes the left sidebar's background directly, and every other
// accent (buttons, focus rings, active-tab highlight, sidebar text contrast)
// is derived from it — nobody picks more than one color.
function applyTheme(){
  const color = (state.settings && /^#[0-9a-fA-F]{6}$/.test(state.settings.themeColor||'')) ? state.settings.themeColor : '#2563EB';
  const root = document.documentElement.style;
  // accent color used on the white main content area (buttons, focus rings, pills)
  root.setProperty('--indigo', color);
  root.setProperty('--indigo-dark', shade(color, -0.15));
  root.setProperty('--gold', color);
  root.setProperty('--gold-soft', shade(color, 0.92));
  // sidebar: the same color as its background, with everything else on top
  // of it (active tab, hover, dividers, text) derived as translucent overlays
  // so they contrast automatically no matter what hue/lightness was picked.
  root.setProperty('--sidebar-bg', color);
  const dark = relativeLuminance(color) < 0.4;
  root.setProperty('--sidebar-text-active', dark ? '#FFFFFF' : '#0F172A');
  root.setProperty('--sidebar-text', dark ? 'rgba(255,255,255,.68)' : 'rgba(15,23,42,.68)');
  root.setProperty('--sidebar-line', dark ? 'rgba(255,255,255,.16)' : 'rgba(15,23,42,.14)');
  root.setProperty('--sidebar-hover-bg', dark ? 'rgba(255,255,255,.10)' : 'rgba(15,23,42,.07)');
  root.setProperty('--sidebar-active-bg', dark ? 'rgba(255,255,255,.20)' : 'rgba(15,23,42,.14)');
  // the rest of the app picks up a soft branded tint too — page background
  // and borders lean toward the chosen color; cards stay near-white so data
  // stays easy to read, and status colors (cash/credit/overdue) stay fixed
  // since those carry meaning, not brand identity.
  const [pr,pg,pb] = hexToRgb(color);
  root.setProperty('--bg', shade(color, 0.965));
  root.setProperty('--line', shade(color, 0.82));
  root.setProperty('--shadow', `0 1px 2px rgba(${pr},${pg},${pb},.10), 0 1px 3px rgba(${pr},${pg},${pb},.07)`);
  root.setProperty('--focus-ring', `rgba(${pr},${pg},${pb},.16)`);
  const sizeMap = {small:'88%', medium:'100%', large:'114%'};
  document.body.style.zoom = sizeMap[(state.settings && state.settings.fontSize) || 'medium'];
}
function daysUntil(dateStr){

async function loadState(){
  try {
    const statusRes = await fetch('/api/auth/status');
    hasAdminAccount = statusRes.ok ? (await statusRes.json()).hasAdmin : false;
  } catch (e) { hasAdminAccount = false; }
  try {
    const sessionRes = await fetch('/api/auth/session');
    session = sessionRes.ok ? await sessionRes.json() : null;
  } catch (e) { session = null; }
  if(session){
    try {
      const cRes = await fetch('/api/clients/mine');
      clientList = cRes.ok ? await cRes.json() : [];
    } catch (e) { clientList = []; }
  } else {
    clientList = [];
  }
  if(session && session.activeClientId){
    try {
      const res = await fetch('/api/state');
      if(res.ok){
        const data = await res.json();
        if(data && Object.keys(data).length) state = data;
      } else if(res.status===401){ session = null; }
    } catch (e) { /* keep defaults, offline */ }
  }
  if(!state.banks) state.banks = [];
  if(!state.partners) state.partners = [];
  if(!state.parties) state.parties = [];
  if(!state.suppliers) state.suppliers = [];
  if(!state.auditLog) state.auditLog = [];
  if(!state.receipts) state.receipts = [];
  if(!state.payouts) state.payouts = [];
  if(state.settings.setupMode===undefined) state.settings.setupMode = false;
  if(session && isAdmin() && migrateLegacyPaidSales()) saveState();
  loaded = true;
  renderAuthGate();
}
// one-time upgrade: sales that were marked "paid" the old way (before the
// party ledger/receipts system existed) get a matching receipt so their
// recovered status and account balances don't regress
function migrateLegacyPaidSales(){
  let changed = false;
  state.sales.forEach(s=>{
    if(s.type==='credit' && s.paid && !s._migratedReceipt){
      state.receipts.push({id:uid(), date:s.date, party:s.party, amount:s.total, account:s.account||'cash', note:'Migrated from legacy "Mark Recovered"'});
      s._migratedReceipt = true;
      changed = true;
    }
  });
  return changed;
}

// thin wrapper around fetch for the per-entity API: throws with the
// server's error message on failure, otherwise returns the parsed JSON body.
async function api(method, url, body){

    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function fmtBytes(n){
  if(!n) return '—';
  const units = ['B','KB','MB','GB']; let i=0; let v=Number(n);
  while(v>=1024 && i<units.length-1){ v/=1024; i++; }
  return v.toFixed(1)+' '+units[i];
}

// ---------- keyboard navigation helpers ----------
function moveFocusNext(el, container){
  const fields = Array.from(container.querySelectorAll('input, select'));
  const idx = fields.indexOf(el);
  let nextIdx = idx+1;
  while(fields[nextIdx] && (fields[nextIdx].disabled || fields[nextIdx].offsetParent===null)) nextIdx++;
  const next = fields[nextIdx];
  if(next){ next.focus(); if(next.select) next.select(); }
}
function enableEnterNav(container, addBtnSelector){
  const fields = Array.from(container.querySelectorAll('input, select'));
  fields.forEach((el, idx)=>{
    if(el.classList.contains('combo-input')) return; // combo handles its own Enter
    // a "select-required" field (e.g. Cover Shortfall From) starts blank and
    // must be deliberately chosen — Enter must NOT skip past it the moment
    // focus arrives. Leave its native Enter/arrow-key behavior alone (opens
    // the dropdown, arrows browse every option with its balance, Enter
    // picks one) and only advance once a real value has actually been set.
    if(el.tagName==='SELECT' && el.classList.contains('select-required')){
      el.addEventListener('change', ()=>{
        if(!el.value) return;
        // advance focus to the next field only — NEVER auto-click the
        // Add/Record button from here. A "Cover Shortfall From" choice is
        // reliably the LAST field in several forms, which meant simply
        // picking an account (even with a plain mouse click, not just
        // Enter) silently submitted the whole form — a real bug (QA Round
        // 14, Bug 5) that produced a duplicate purchase against a stale
        // balance. Submitting is always a deliberate, separate click now.
        let nextIdx = idx+1;
        while(fields[nextIdx] && (fields[nextIdx].disabled || fields[nextIdx].offsetParent===null)) nextIdx++;
        const next = fields[nextIdx];
        if(next){ next.focus(); if(next.select) next.select(); }
      });
      return;
    }
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        // a native date/time input reports an empty .value until EVERY
        // segment (day/month/year) is filled in — while that's still true,
        // leave Enter alone so it doesn't yank focus away mid-entry (e.g.
        // while the year segment is still blank). Once the browser considers
        // it a complete, valid date, treat Enter like any other field again.
        if((el.type==='date' || el.type==='time') && !el.value) return;
        // a plain <select> (e.g. "Paid From") previously skipped straight to
        // the next field on Enter, never actually opening its own list — the
        // only way to pick anything other than the default was a mouse
        // click. First Enter on a fresh arrival now opens the dropdown
        // itself instead (so arrow keys can browse it); only once it's been
        // opened does Enter go back to advancing to the next field.
        if(el.tagName==='SELECT' && !el.dataset.enterOpened){
          e.preventDefault();
          el.dataset.enterOpened = '1';
          if(typeof el.showPicker==='function'){ try{ el.showPicker(); }catch(err){} }
          return;
        }
        e.preventDefault();
        if(el.classList.contains('no-skip-empty') && !el.value.trim()) return; // stay put until filled
        // a disabled field (e.g. Unit auto-locked to a material's one known
        // unit) can't receive focus at all — .focus() on it is a silent
        // no-op, which left the cursor stuck exactly where it was. Same
        // problem for a field hidden behind a conditional display:none
        // wrapper (e.g. Received Into when Payment Type is Credit, or
        // Credit Days/Recovery Date when it's Cash) — offsetParent is null
        // for any element that isn't actually rendered. Skip forward past
        // any such field to the next one that can actually take focus.
        let nextIdx = idx+1;
        while(fields[nextIdx] && (fields[nextIdx].disabled || fields[nextIdx].offsetParent===null)) nextIdx++;
        const next = fields[nextIdx];
        if(next){ next.focus(); if(next.select) next.select(); }
        else if(addBtnSelector){ const b = container.querySelector(addBtnSelector); if(b) b.click(); }
      }
    });
    // re-arm "first Enter opens the list" for next time focus returns here
    if(el.tagName==='SELECT') el.addEventListener('blur', ()=>{ delete el.dataset.enterOpened; });
  });
}
// text input with a keyboard-navigable suggestion list (variety names etc.)
function attachCombo(input, getOptions, container){
  input.classList.add('combo-input');
  input.parentElement.classList.add('field-wrap');
  const box = document.createElement('div');
  box.className = 'combo-list';
  box.style.display = 'none';
  input.parentElement.appendChild(box);
  let items = []; let hi = -1;
  function renderList(){
    const q = input.value.toLowerCase();
    items = getOptions().filter(o=>o.toLowerCase().includes(q));
    if(items.length===0){ box.style.display='none'; return; }
    box.innerHTML = items.map((o,i)=>`<div class="combo-item" data-i="${i}">${o}</div>`).join('');
    hi = 0; updateHi(); box.style.display='block';
    box.querySelectorAll('.combo-item').forEach(el=>{
      el.onmousedown = (e)=>{ e.preventDefault(); pick(Number(el.dataset.i)); };
    });
  }
  function updateHi(){ box.querySelectorAll('.combo-item').forEach((el,i)=>el.classList.toggle('hi', i===hi)); }
  function pick(i){
    if(items[i]!==undefined){ input.value = items[i]; input.dispatchEvent(new Event('input')); }
    box.style.display='none';
    moveFocusNext(input, container);
  }
  input.addEventListener('input', renderList);
  input.addEventListener('focus', renderList);
  input.addEventListener('keydown', (e)=>{
    if(box.style.display==='block'){
      if(e.key==='ArrowDown'){ e.preventDefault(); hi=Math.min(hi+1, items.length-1); updateHi(); return; }
      if(e.key==='ArrowUp'){ e.preventDefault(); hi=Math.max(hi-1,0); updateHi(); return; }
      if(e.key==='Enter'){ e.preventDefault(); if(hi>=0){ pick(hi); } else { box.style.display='none'; moveFocusNext(input, container); } return; }
      if(e.key==='Escape'){ box.style.display='none'; return; }
    } else if(e.key==='Enter'){
      e.preventDefault(); moveFocusNext(input, container);
    }
  });
  input.addEventListener('blur', ()=> setTimeout(()=>{ box.style.display='none'; }, 150));
}
function knownVarieties(){
  const names = new Set();
  state.stock.forEach(s=>names.add(s.name));
  state.sales.forEach(s=>names.add(s.item));
  state.purchases.forEach(p=>names.add(p.item));
  return Array.from(names).filter(Boolean);
}
// only varieties that currently have stock on hand — used for the Sales item
// suggestion list so you can't accidentally pick something already sold out
function inStockVarieties(){
  const names = new Set();
  state.stock.forEach(s=>{ if(Number(s.qty)>0) names.add(s.name); });
  return Array.from(names).filter(Boolean);
}
// Profit is never a blended average across every purchase of an item — each
// sale names the exact batch (a specific purchase, or the material's own
// opening stock, tagged 'opening') its cost and quantity come from. This
// lists every batch for one item/unit that still has something left,
// excluding a given sale's own already-counted consumption when editing it.
// net qty drawn from a batch of sales (excludeSaleId omitted), offset by
// any sales returns against those same sales — mirrors the server's
// resolveSaleBatch() "consumed" math exactly.
function batchSoldQty(matchingSales, excludeSaleId){
  const sales = matchingSales.filter(s=>s.id!==excludeSaleId);
  const sold = sales.reduce((a,s)=>a+Number(s.qty),0);
  const saleIds = new Set(sales.map(s=>s.id));
  const returned = state.salesReturns.filter(r=>saleIds.has(r.saleId)).reduce((a,r)=>a+Number(r.qty),0);
  return sold - returned;
}
function saleBatchesForItem(name, unit, excludeSaleId){
  const batches = [];
  const stockItem = state.stock.find(x=>x.name===name && x.unit===unit);
  if(stockItem && Number(stockItem.openingQty)>0){
    const matching = state.sales.filter(s=>!s.staged && s.item===name && s.unit===unit && s.sourcePurchaseId==='opening');
    const remaining = Number(stockItem.openingQty) - batchSoldQty(matching, excludeSaleId);
    if(remaining>0.001) batches.push({id:'opening', rate:Number(stockItem.openingRate), remaining, label:`Opening Stock — ${fmtQtyPlain(remaining)} ${unit} left @ Rs ${fmtPlain(stockItem.openingRate)}`});
  }
  state.purchases.filter(p=>!p.staged && p.item===name && p.unit===unit).forEach(p=>{
    const matching = state.sales.filter(s=>!s.staged && s.sourcePurchaseId===p.id);
    // a purchase return draws down this same batch exactly like a sale would.
    const purchaseReturned = purchaseReturnsQtyFor(p.id);
    const remaining = Number(p.qty) - batchSoldQty(matching, excludeSaleId) - purchaseReturned;
    if(remaining>0.001) batches.push({id:p.id, rate:Number(p.rate), remaining, label:`${fmtDate(p.date)} (${p.supplier}) — ${fmtQtyPlain(remaining)} ${unit} left @ Rs ${fmtPlain(p.rate)}`});
  });
  return batches;
}
function purchaseReturnsQtyFor(purchaseId){
  return state.purchaseReturns.filter(r=>r.purchaseId===purchaseId).reduce((a,r)=>a+Number(r.qty),0);
}
function saleReturnsQtyFor(saleId){
  return state.salesReturns.filter(r=>r.saleId===saleId).reduce((a,r)=>a+Number(r.qty),0);
}
// how much of this specific purchase can still be sent back — mirrors the
// server's POST /api/purchase-returns validation exactly.
function purchaseReturnableQty(purchaseId){
  const p = state.purchases.find(x=>x.id===purchaseId);
  if(!p) return 0;
  const matching = state.sales.filter(s=>!s.staged && s.sourcePurchaseId===purchaseId);
  return Number(p.qty) - batchSoldQty(matching, null) - purchaseReturnsQtyFor(purchaseId);
}
// how much of this specific sale can still come back — mirrors the
// server's POST /api/sales-returns validation exactly.
function saleReturnableQty(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!s) return 0;
  return Number(s.qty) - saleReturnsQtyFor(saleId);
}

}
function accountBalance(accId){
  accId = accId || 'cash';
  let bal = accId==='cash' ? Number(state.settings.openingCash||0)
    : Number((state.banks.find(b=>b.id===accId)||{}).openingBalance||0);
  state.investors.forEach(i=>{ if(!i.staged && (i.account||'cash')===accId) bal += Number(i.amount); });
  state.personalLoans.forEach(l=>{ if((l.account||'cash')===accId) bal += Number(l.amount); });
  // staged (Historical Data Entry Mode) entries are permanently invisible to
  // every balance — there is no "unstage" step; turning the mode off only
  // changes how the next new entry is tagged.
  state.sales.forEach(s=>{
    if(s.staged) return;
    if(s.type==='cash' && (s.account||'cash')===accId) bal += Number(s.total);
  });
  state.receipts.forEach(r=>{ if(!r.staged && (r.account||'cash')===accId) bal += Number(r.amount); });
  state.purchases.forEach(p=>{
    if(p.staged) return;
    if(p.type==='cash' && (p.account||'cash')===accId) bal -= Number(p.total);
    else if(p.type==='credit' && p.paid && (p.account||'cash')===accId) bal -= Number(p.total);
  });
  state.supplierPayments.forEach(p=>{ if(!p.staged && (p.account||'cash')===accId) bal -= Number(p.amount); });
  // a purchase advance is real money handed to the supplier the moment
  // it's issued — stays counted even after it's "completed" into a
  // purchase, since that purchase is created unpaid specifically so this
  // is the only place the money actually leaves.
  state.purchaseAdvances.forEach(a=>{ if((a.account||'cash')===accId) bal -= Number(a.amount); });
  // a refund-settled return moves real money (purchase return = supplier
  // hands cash/bank back to us; sales return = we hand cash/bank back to a
  // buyer) — a credit-settled return never touches an account at all, it
  // only shifts the FIFO pool (see partyPoolTotal/supplierPoolTotal).
  state.purchaseReturns.forEach(r=>{ if(r.settlement==='refund' && (r.account||'cash')===accId) bal += Number(r.total); });
  state.salesReturns.forEach(r=>{ if(r.settlement==='refund' && (r.account||'cash')===accId) bal -= Number(r.total); });
  state.expenses.forEach(e=>{ if((e.account||'cash')===accId) bal -= Number(e.amount); });
  state.payouts.forEach(p=>{ if((p.account||'cash')===accId) bal -= Number(p.amount); });
  state.transfers.forEach(t=>{
    if(t.fromAccount===accId) bal -= Number(t.amount);
    if(t.toAccount===accId) bal += Number(t.amount);
  });
  return bal;
}
// Transaction-level listing for one account, in the same order/sign as
// accountBalance() sums it — used by the Bank Ledger report to show a
// running balance instead of just the final total.
function accountLedgerRows(accId){
  accId = accId || 'cash';
  const rows = [];
  state.investors.forEach(i=>{ if(!i.staged && (i.account||'cash')===accId) rows.push({date:'', kind:'Investment', desc:i.name, amount:Number(i.amount)}); });
  state.personalLoans.forEach(l=>{ if((l.account||'cash')===accId) rows.push({date:l.date, kind:'Personal Loan', desc:l.lender+(l.note?' — '+l.note:''), amount:Number(l.amount)}); });
  state.sales.forEach(s=>{ if(!s.staged && s.type==='cash' && (s.account||'cash')===accId) rows.push({date:s.date, kind:'Sale (Cash)', desc:s.party+' — '+s.item, amount:Number(s.total)}); });
  state.receipts.forEach(r=>{ if(!r.staged && (r.account||'cash')===accId) rows.push({date:r.date, kind:'Receipt', desc:r.party+(r.note?' — '+r.note:''), amount:Number(r.amount)}); });
  state.purchases.forEach(p=>{
    if(p.staged) return;
    if(p.type==='cash' && (p.account||'cash')===accId) rows.push({date:p.date, kind:'Purchase (Cash)', desc:p.supplier+' — '+p.item, amount:-Number(p.total)});
    else if(p.type==='credit' && p.paid && (p.account||'cash')===accId) rows.push({date:p.date, kind:'Purchase (Paid)', desc:p.supplier+' — '+p.item, amount:-Number(p.total)});
  });
  state.supplierPayments.forEach(p=>{ if(!p.staged && (p.account||'cash')===accId) rows.push({date:p.date, kind:'Payment to Supplier', desc:p.supplier+(p.note?' — '+p.note:''), amount:-Number(p.amount)}); });
  state.purchaseAdvances.forEach(a=>{ if((a.account||'cash')===accId) rows.push({date:a.date, kind:'Supplier Advance', desc:a.supplier+(a.note?' — '+a.note:''), amount:-Number(a.amount)}); });
  state.expenses.forEach(e=>{ if((e.account||'cash')===accId) rows.push({date:e.date, kind:'Expense', desc:e.desc, amount:-Number(e.amount)}); });
  state.payouts.forEach(p=>{
    if((p.account||'cash')===accId){
      const name = p.recipientType==='investor' ? (state.investors.find(i=>i.id===p.recipientId)||{}).name
        : p.recipientType==='loan' ? (state.personalLoans.find(l=>l.id===p.recipientId)||{}).lender
        : (state.partners.find(x=>x.id===p.recipientId)||{}).name;
      const label = p.recipientType==='investor' ? 'Investor' : p.recipientType==='loan' ? 'Personal Loan' : 'Commission Agent';
      rows.push({date:p.date, kind:'Payout ('+label+')', desc:name||'—', amount:-Number(p.amount)});
    }
  });
  state.transfers.forEach(t=>{
    const accName = (id)=> (allAccounts().find(a=>a.id===id)||{}).name || id;
    if(t.fromAccount===accId) rows.push({date:t.date, kind:'Transfer Out', desc:'To '+accName(t.toAccount)+(t.note?' — '+t.note:''), amount:-Number(t.amount)});
    if(t.toAccount===accId) rows.push({date:t.date, kind:'Transfer In', desc:'From '+accName(t.fromAccount)+(t.note?' — '+t.note:''), amount:Number(t.amount)});
  });
  rows.sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0));
  const opening = accId==='cash' ? Number(state.settings.openingCash||0) : Number((state.banks.find(b=>b.id===accId)||{}).openingBalance||0);
  let running = opening;
  return rows.map(r=>{ running += r.amount; return {...r, balance:running}; });
}
function totalExpensesAll(){ return state.expenses.reduce((a,e)=>a+Number(e.amount),0); }
function payoutsTotal(recipientType, recipientId){
  return state.payouts.filter(p=>p.recipientType===recipientType && p.recipientId===recipientId).reduce((a,p)=>a+Number(p.amount),0);

// personal loans: a person covered a shortfall on the spot — a liability
// owed back to them, tracked apart from Total Investment. Repayment reuses
// the payouts table (recipientType='loan'), same pattern as investors/agents.
function personalLoanOutstanding(loan){ return Number(loan.amount) - payoutsTotal('loan', loan.id); }
function totalPersonalLoansOutstanding(){ return state.personalLoans.reduce((a,l)=>a+personalLoanOutstanding(l),0); }
// For the Reports tab's Personal Loans Report — each loan's full lifecycle
// (when taken, into which account, and every repayment's date/account) in

    .sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0))
